name: TANUKI CIK Lookup

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol (e.g. KO)'
        required: true
        type: string

jobs:
  cik-lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Lookup CIK from SEC
        id: lookup
        run: |
          python - <<'EOF'
          import os
          import csv
          import json
          import requests

          ticker = os.environ.get("TICKER", "").strip().upper()
          sec_email = os.environ.get("SEC_USER_AGENT_EMAIL", "")
          csv_path = "config/cik_lookup.csv"
          result_path = "config/cik_lookup_result.json"

          def write_result(data: dict):
              os.makedirs(os.path.dirname(result_path), exist_ok=True)
              with open(result_path, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

          def clean_key(k):
              return k.lstrip('\ufeff').strip() if k else ''

          # Read existing CSV
          rows = []
          existing_tickers = set()
          fieldnames = ["ticker", "cik", "name"]

          try:
              with open(csv_path, newline='', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  raw_fn = reader.fieldnames or []
                  fieldnames = [clean_key(fn) for fn in raw_fn if clean_key(fn)]
                  print(f"[INFO] CSV headers: {fieldnames}")

                  for row in reader:
                      clean_row = {clean_key(k): v for k, v in row.items() if clean_key(k)}
                      rows.append(clean_row)
                      existing_tickers.add(clean_row.get('ticker', '').upper())

              print(f"[INFO] Existing rows: {len(rows)}")

          except FileNotFoundError:
              print(f"[INFO] {csv_path} not found, creating new file")

          if ticker in existing_tickers:
              print(f"[SKIP] {ticker} already exists in cik_lookup.csv")
              write_result({"ticker": ticker, "status": "already_exists"})
              exit(0)

          # Fetch CIK from SEC
          print(f"[INFO] Fetching CIK from SEC API: {ticker}")
          user_agent = f"Koichi-Shigihara2 On-a-journey {sec_email}"
          headers = {
              "User-Agent": user_agent,
              "Accept": "application/json",
              "Accept-Encoding": "gzip, deflate"
          }

          try:
              res = requests.get(
                  "https://www.sec.gov/files/company_tickers.json",
                  headers=headers,
                  timeout=30
              )
              if res.status_code == 403:
                  raise Exception("403 Forbidden: SEC_USER_AGENT_EMAIL secret is missing or invalid")
              res.raise_for_status()
              data = res.json()
          except Exception as e:
              print(f"[ERROR] SEC API error: {e}")
              write_result({"ticker": ticker, "status": "api_error", "error": str(e)})
              exit(1)

          cik = None
          name = None
          for entry in data.values():
              if entry.get("ticker", "").upper() == ticker:
                  cik = str(entry["cik_str"]).zfill(10)
                  name = entry.get("title", "")
                  break

          if not cik:
              print(f"[ERROR] CIK not found for {ticker}")
              write_result({"ticker": ticker, "status": "not_found"})
              exit(1)

          print(f"[OK] {ticker}: CIK={cik}, Name={name}")

          # Add new row and sort
          new_row = {fn: "" for fn in fieldnames}
          new_row["ticker"] = ticker
          new_row["cik"]    = cik
          new_row["name"]   = name
          rows.append(new_row)
          rows.sort(key=lambda r: r.get("ticker", ""))

          # Write CSV (UTF-8 without BOM)
          os.makedirs(os.path.dirname(csv_path), exist_ok=True)
          with open(csv_path, "w", newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, extrasaction='ignore')
              writer.writeheader()
              writer.writerows(rows)

          print(f"[DONE] cik_lookup.csv updated ({len(rows)} rows)")

          write_result({
              "ticker": ticker,
              "cik": cik,
              "name": name,
              "status": "ok"
          })
          EOF
        env:
          TICKER: ${{ github.event.inputs.ticker }}
          SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}

      - name: Commit updated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true

          git add config/cik_lookup.csv 2>/dev/null || true
          git add config/cik_lookup_result.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "[INFO] No changes to commit"
          else
            git commit -m "chore: CIK lookup for ${{ github.event.inputs.ticker }}"
            bash .github/scripts/push_with_retry.sh kaihatsu
            echo "[DONE] Commit complete"
          fi
