name: TANUKI TAIL RSS Monitor

on:
  schedule:
    - cron: '0 8 * * 1-5'  # 平日 UTC 08:00 = JST 17:00
  workflow_dispatch:
    inputs:
      ticker:
        description: '対象ティッカー（スペース区切り、空白で全保有ポジション）'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  rss-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run RSS monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python src/tail/edgar_rss_monitor.py --ticker ${{ github.event.inputs.ticker }}
          else
            python src/tail/edgar_rss_monitor.py
          fi

      - name: Run xbrl_segment_fetcher (layer2 - pending tickers only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          TICKERS=$(python -c "
          import json
          with open('docs/portfolio/tail/data/review_queue.json') as f:
              q = json.load(f)
          tickers = list({e['ticker'] for e in q.get('queue', []) if e.get('status') == 'pending'})
          print(' '.join(tickers))
          ")
          if [ -n "$TICKERS" ]; then
            echo "layer2 取得対象: $TICKERS"
            python src/tail/xbrl_segment_fetcher.py --ticker $TICKERS
          else
            echo "pending なし → layer2 スキップ"
          fi

      - name: Run text_kpi_extractor (layer3 - pending tickers only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          TICKERS=$(python -c "
          import json
          with open('docs/portfolio/tail/data/review_queue.json') as f:
              q = json.load(f)
          tickers = list({e['ticker'] for e in q.get('queue', []) if e.get('status') == 'pending'})
          print(' '.join(tickers))
          ")
          if [ -n "$TICKERS" ]; then
            echo "layer3 取得対象: $TICKERS"
            python src/tail/text_kpi_extractor.py --ticker $TICKERS
          else
            echo "pending なし → layer3 スキップ"
          fi

      - name: Run quarterly review generator (pending only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PENDING=$(python -c "
          import json
          with open('docs/portfolio/tail/data/review_queue.json') as f:
              q = json.load(f)
          pending = [e for e in q.get('queue', []) if e.get('status') == 'pending']
          print(len(pending))
          ")
          echo "pending件数: $PENDING"
          if [ "$PENDING" -gt 0 ]; then
            python src/tail/quarterly_review_generator.py
          else
            echo "pending なし → レビュー生成スキップ"
          fi

      - name: Run tail_dcf_bridge (scenario files)
        run: |
          TICKERS=$(python -c "
          import os
          val_dir = 'docs/value-monitor/tanuki_valuation/data'
          tickers = sorted(d for d in os.listdir(val_dir) if os.path.isdir(os.path.join(val_dir, d)))
          print(' '.join(tickers))
          ")
          if [ -n "$TICKERS" ]; then
            echo "DCF bridge 対象: $TICKERS"
            python src/tail/tail_dcf_bridge.py --ticker $TICKERS
          else
            echo "ティッカーなし → DCF bridge スキップ"
          fi

      - name: Run prediction_tracker (予測vs実績照合)
        run: |
          python src/tail/prediction_tracker.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/portfolio/tail/data/rss_state.json \
                  docs/portfolio/tail/data/review_queue.json \
                  docs/portfolio/tail/data/reviews/ \
                  docs/portfolio/tail/data/kpi/ \
                  config/tail_kpi_map.json \
                  docs/portfolio/scenario/ \
                  docs/portfolio/tail/data/prediction_history.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: TANUKI TAIL RSS state 更新 $(date +'%Y-%m-%d')"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi
