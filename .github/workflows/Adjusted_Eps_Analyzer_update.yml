name: Adjusted_EPS_Data_Update

# [[WORKFLOW-SEC-TANUKI-GAP-1]]対応: config/workflow_dependencies.jsonが
# 定義するSEC_Data_Update依存を実際のworkflow_runトリガーに反映。
# 旧・独立cron（毎週月曜10:07 UTC、SEC Data Update完了〈日曜12:00 UTC〉
# から最大約22時間後）はworkflow_runに置き換え、代わりにworkflow_run
# 連鎖が発火しなかった場合の安全網として低頻度（週1回）のフォールバック
# cronのみ残す。本パイプライン自体はmarket_data日次層に依存しない
# （SEC由来データのみ）ため、SEC_Data_Update完了トリガーで鮮度要件を
# 満たせる。
on:
  workflow_run:
    workflows: ["SEC Data Update"]
    types: [completed]
  schedule:
    - cron: '10 4 * * 1'  # 安全網: 月曜4:10 UTC（SEC Data Update日曜分の完了後、低頻度フォールバック）
  workflow_dispatch:
    branches:
      - kaihatsu
    inputs:
      ticker:
        description: 'Update target ticker (e.g. AMZN or AMZN,AMD,APP). Leave blank to update all tickers.'
        required: false
        default: ''

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Pipeline Start ==="
          echo "Ticker input: '${{ github.event.inputs.ticker }}'"
          # [[WORKFLOW-FALLBACK-CRON-DUPLICATE-1]]対応: workflow_dispatch
          # （手動実行）は常に意図的な実行のため、pipeline.py側の
          # 冪等性ガード（直近24時間以内の完了ならスキップ）を --force で
          # バイパスする。workflow_run（正規連鎖）・schedule（週次
          # フォールバック）はガードをそのまま適用する。
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_FLAG="--force"
          fi
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python -m src.value.adjusted_eps_analyzer.pipeline --ticker "${{ github.event.inputs.ticker }}" $FORCE_FLAG
          else
            python -m src.value.adjusted_eps_analyzer.pipeline $FORCE_FLAG
          fi
          echo "=== Pipeline End ==="

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain docs/value-monitor/adjusted_eps_analyzer/data/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Consistency Check Gate
        if: steps.git-check.outputs.changes == 'true'
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --ticker "${{ github.event.inputs.ticker }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet
          fi

      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/adjusted_eps_analyzer/data/
          git commit -m "Update EPS data - $(date +'%Y-%m-%d')"
          git pull --rebase origin kaihatsu
          git push origin kaihatsu
