name: Adjusted_EPS_Data_Update

# SEC Data Update（日曜）の完了で起動する（market_dataの日次には依存しない）。月曜04:10 UTCは安全網。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  workflow_run:
    workflows: ["SEC Data Update"]
    types: [completed]
  schedule:
    - cron: '10 4 * * 1'  # 安全網（月曜04:10 UTC）
  workflow_dispatch:
    branches:
      - kaihatsu
    inputs:
      ticker:
        description: 'Update target ticker (e.g. AMZN or AMZN,AMD,APP). Leave blank to update all tickers.'
        required: false
        default: ''

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Pipeline Start ==="
          echo "Ticker input: '${{ github.event.inputs.ticker }}'"
          # [[WORKFLOW-FALLBACK-CRON-DUPLICATE-1]]対応: workflow_dispatch
          # （手動実行）は常に意図的な実行のため、pipeline.py側の
          # 冪等性ガード（直近24時間以内の完了ならスキップ）を --force で
          # バイパスする。workflow_run（正規連鎖）・schedule（週次
          # フォールバック）はガードをそのまま適用する。
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_FLAG="--force"
          fi
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python -m src.value.adjusted_eps_analyzer.pipeline --ticker "${{ github.event.inputs.ticker }}" $FORCE_FLAG
          else
            python -m src.value.adjusted_eps_analyzer.pipeline $FORCE_FLAG
          fi
          echo "=== Pipeline End ==="

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain docs/value-monitor/adjusted_eps_analyzer/data/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Consistency Check Gate
        if: steps.git-check.outputs.changes == 'true'
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --ticker "${{ github.event.inputs.ticker }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet
          fi

      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/adjusted_eps_analyzer/data/
          git commit -m "Update EPS data - $(date +'%Y-%m-%d')"
          git pull --rebase origin kaihatsu
          git push origin kaihatsu
