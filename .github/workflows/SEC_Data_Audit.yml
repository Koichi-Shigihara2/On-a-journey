name: SEC Data Quality Audit

on:
  # SEC更新ワークフロー完了後に自動実行
  workflow_run:
    workflows: ["SEC Data Update"]
    types: [completed]
  # 手動実行
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for all)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # [[MARKETDATA-LAYER-CONSTRUCTION-1]]着手順序5: audit.pyが
        # common.market_data.reader経由になったため、common/market_data/
        # fetcher.py（reader.py経由で連鎖import）が要求するyfinance・
        # pandas・pandas_market_calendars・pyyaml等もrequirements.txt経由で
        # 導入する（TANUKI_VALUATION_Update.yml等の既存切替と同じ対応。
        # 旧: pip install requestsのみでは不足しImportErrorになる）
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SEC Data Quality Audit
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
          # 前段（SEC Data Update）の結果。success以外なら本文の先頭に「⚠ SEC更新が失敗：前回のデータを監査」
          # （audit.py。手動実行では空）
          SEC_UPDATE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python common/sec_data/audit.py $TICKERS
          else
            python common/sec_data/audit.py
          fi
        # 重大問題があっても workflow は続行（通知のみ・強制停止しない）
        continue-on-error: true
