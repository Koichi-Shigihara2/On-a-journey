name: Stonks Silo Update

# [[WORKFLOW-SEC-TANUKI-GAP-1]]対応: config/workflow_dependencies.jsonが
# 定義するSEC_Data_Update依存をworkflow_runで追加（SEC更新完了後、
# 既存の平日cronの実行を待たず即座に反映）。
#
# [[STONKS-SILO-PRICE-SCHEDULE-LAG-SUSPECT-1]]対応（2026-08-31）: 登録時点の
# 「疑い」を、ASTS/AVAV/BBAI/CRWVの複数銘柄でresults.json側current_priceと
# common/market_data/daily/の実際の保存日を突合し実データで確認した
# （current_priceが一貫してMarket_Data_Daily_Update完了前の前営業日終値に
# なっていた）。真因は上記コメントの旧設計判断（`案②`、平日日次cronを
# 独立トリガーとして意図的に併存）そのもの——旧・独立平日cron
# （15:05 UTC）がMarket_Data_Daily_Update完了（21:25 UTC）より6時間以上
# 先に発火するため、valuation_fetcher.py経由のcurrent_priceが常に
# 前営業日終値になる構造的ラグだった。[[TANUKI-VALUATION-PRICE-SCHEDULE-
# LAG-1]]・TANUKI_VALUATION_Update.ymlで確立済みの解決パターン
# （`workflow_run`対象にMarket Data Daily Updateを追加し、旧・独立cronは
# 低頻度フォールバックに置き換え）を横展開する。フォールバックは
# TANUKI_VALUATION_Update.ymlの金曜22:30 UTCと10分ずらし金曜22:40 UTC
# （Market_Data_Daily_Update金曜分の完了後になる時刻、衝突回避）。
on:
  workflow_run:
    workflows:
      - "SEC Data Update"
      - "Market Data Daily Update"
    types: [completed]
  schedule:
    - cron: '40 22 * * 5'  # 安全網: 金曜22:40 UTC（Market_Data_Daily_Update金曜分の完了後、低頻度フォールバック）
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for stonks_silo=true all)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-stonks-silo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stonks Silo Pipeline
        working-directory: discover/stonks-silo/src
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python pipeline.py $TICKERS
          else
            python pipeline.py
          fi

      - name: Consistency Check Gate
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --ticker "${{ github.event.inputs.tickers }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/stonks-silo/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Stonks Silo - $(date +'%Y-%m-%d %H:%M') JST"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi

      - name: Summary
        run: |
          echo "## Stonks Silo Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Verdict | Score |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:--------|------:|" >> $GITHUB_STEP_SUMMARY
          python - << 'EOF'
          import json, os
          path = "docs/value-monitor/stonks-silo/data/results.json"
          if not os.path.exists(path):
              print("results.json not found")
          else:
              with open(path) as f:
                  data = json.load(f)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  for ticker, info in data.get("tickers", {}).items():
                      verdict = info.get("overall_verdict", "--")
                      score = info.get("overall_score", "--")
                      out.write(f"| {ticker} | {verdict} | {score} |\n")
          EOF
