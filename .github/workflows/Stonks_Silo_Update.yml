name: Stonks Silo Update

# SEC Data Update・Market Data Daily Updateの完了で起動する（株価はMarket Data Dailyが保存したdaily/の最新の終値）。
# cronは無い（金曜の安全網は2026-10-03に削除）。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  workflow_run:
    workflows:
      - "SEC Data Update"
      - "Market Data Daily Update"
    types: [completed]
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for stonks_silo=true all)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-stonks-silo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stonks Silo Pipeline
        working-directory: discover/stonks-silo/src
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python pipeline.py $TICKERS
          else
            python pipeline.py
          fi

      - name: Consistency Check Gate
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --ticker "${{ github.event.inputs.tickers }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/stonks-silo/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Stonks Silo - $(date +'%Y-%m-%d %H:%M') JST"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi

      - name: Summary
        run: |
          echo "## Stonks Silo Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Verdict | Score |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:--------|------:|" >> $GITHUB_STEP_SUMMARY
          python - << 'EOF'
          import json, os
          path = "docs/value-monitor/stonks-silo/data/results.json"
          if not os.path.exists(path):
              print("results.json not found")
          else:
              with open(path) as f:
                  data = json.load(f)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  for ticker, info in data.get("tickers", {}).items():
                      verdict = info.get("overall_verdict", "--")
                      score = info.get("overall_score", "--")
                      out.write(f"| {ticker} | {verdict} | {score} |\n")
          EOF
