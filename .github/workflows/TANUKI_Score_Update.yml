name: TANUKI_Score_Update

# TANUKI VALUATION Daily Updateの完了で起動する。土日は13:30 UTCに独立に動く。
# 今の中身はPortfolioのスナップショット（src/portfolio/snapshot.py）だけ（今日の特選銘柄は2026-10-20に削除）。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  workflow_run:
    workflows: ["TANUKI VALUATION Daily Update"]
    types: [completed]
  schedule:
    - cron: "30 13 * * 6,0"   # 土日のみ独立実行（13:30 UTC）
  workflow_dispatch:

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      # 今日の特選銘柄（daily_pick.py・Grok）は2026-10-20に削除（[[OUTPUT-INVENTORY-CHECK-1]]、Koichiさんの判断）
      - name: Portfolio snapshot
        run: python src/portfolio/snapshot.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/portfolio/data/history.json
          git diff --staged --quiet || git commit -m \
            "chore: auto-update portfolio snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
          bash .github/scripts/push_with_retry.sh kaihatsu
