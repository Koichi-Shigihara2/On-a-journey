name: System Health Check

on:
  schedule:
    - cron: '30 23 * * *'  # 毎日 JST 8:30（UTC 23:30）※Score_Verifier(JST 9:00)の直前
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

permissions:
  contents: read
  actions: read  # [[DATA-FRESHNESS-MONITORING-FUTURE-IDEA-1]]対応: cronワークフロー
                 # の実行状況をGitHub Actions REST APIで確認するために必要

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu
          fetch-depth: 50  # git log でコミット日時を確認するために必要

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # [[HYPECORE-CI-SILENT-FAILURE-1]]: 個別指定ではpyyaml等が欠け、
        # common.market_data層のimportが黙って失敗していた（2026-08-11〜）。
        # SEC_Data_Update.yml（3637139f20）と同じrequirements.txt一括方式に統一。
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run System Health Check
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python common/system_health.py
