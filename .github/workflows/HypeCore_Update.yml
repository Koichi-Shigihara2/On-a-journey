name: HypeCore Update

# [[WORKFLOW-SEC-TANUKI-GAP-1]]対応: config/workflow_dependencies.jsonが
# 定義するSEC_Data_Update依存を実際のworkflow_runトリガーに反映。
# 旧・独立cron（毎週日曜13:08 UTC=SEC Data Updateの1時間後、という
# 手動オフセット推測）はworkflow_runに置き換え、代わりにworkflow_run
# 連鎖が発火しなかった場合の安全網として低頻度（週1回）の
# フォールバックcronのみ残す。TANUKI_Score_Update.ymlと同型の
# workflow_run+conclusionチェックパターン。
on:
  workflow_run:
    workflows: ["SEC Data Update"]
    types: [completed]
  schedule:
    - cron: '0 4 * * 1'  # 安全網: 月曜4:00 UTC（SEC Data Update日曜分の完了後、低頻度フォールバック）
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for all hypecore=true)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-hypecore:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # [[HYPECORE-CI-SILENT-FAILURE-1]]: 個別指定ではpyyaml等が欠け、
        # common.market_data層のimportが黙って失敗していた（2026-08-11〜）。
        # SEC_Data_Update.yml（3637139f20）と同じrequirements.txt一括方式に統一。
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HypeCore Pipeline
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python src/value/hypecore/hypecore.py --batch $TICKERS
          else
            python src/value/hypecore/hypecore.py --all
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/hypecore/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update HypeCore - $(date +'%Y-%m-%d %H:%M') JST"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi

      - name: Summary
        run: |
          echo "## HypeCore Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | LC | Stage | Phase | Rec |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:---|:------|:------|:----|" >> $GITHUB_STEP_SUMMARY
          python - << 'EOF'
          import json, os, glob

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          data_dir = "docs/value-monitor/hypecore/data"

          files = sorted(glob.glob(f"{data_dir}/*_poc.json"))
          lines = []
          for f in files:
              ticker = os.path.basename(f).replace("_poc.json", "")
              try:
                  with open(f) as fp:
                      d = json.load(fp)
                  months = d.get("monthly", [])
                  if not months:
                      continue
                  latest = months[-1]
                  lc   = latest.get("lifecycle_label", "--")
                  stage = f"S{latest.get('stage', '--')}"
                  phase = latest.get("substage_label", "--")[:12]
                  rec   = latest.get("recommendation", "--")
                  lines.append(f"| {ticker} | {lc} | {stage} | {phase} | {rec} |")
              except Exception:
                  lines.append(f"| {ticker} | -- | -- | -- | error |")

          if summary_path:
              with open(summary_path, "a") as out:
                  out.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))
          EOF
