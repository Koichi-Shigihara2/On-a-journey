name: Score Verifier

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 JST 9:00（UTC 0:00）
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # [[MARKETDATA-LAYER-CONSTRUCTION-1]]着手順序5-2: score_verifier.pyが
        # common.market_data.reader経由になったため、common/market_data/
        # fetcher.py（__init__.py経由で連鎖import）が要求するpandas_market_
        # calendars・pyyaml等もrequirements.txt経由で導入する
        # （旧: pip install yfinance requests だけでは不足しImportErrorになる）
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run score_verifier
        run: python src/value/tanuki_valuation/score_verifier.py

      - name: Commit if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/tanuki_valuation/data/*/score_history.json
          if git diff --staged --quiet; then
            echo "更新なし（30d/60d/90d いずれもまだ経過していないか取得失敗）"
          else
            git commit -m "chore: score_verifier 自動更新 $(date +'%Y-%m-%d') [skip ci]"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi
