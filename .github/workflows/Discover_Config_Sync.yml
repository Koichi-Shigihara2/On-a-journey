name: Discover Config Sync

# [[DISCOVER-CONFIG-DUAL-MGMT-1]] 対応。config/discover_config.jsonの
# 書き手は複数存在した（value-monitor/admin.html・
# discover/admin.html〈どちらも削除済み、value-monitorは2026-10-21〉・
# CLAUDE_CODE_START.md新規銘柄登録手順〈shutil.copy一回限り〉・
# Claude Code経由の直接編集）。書き手ごとに同期処理を分散実装するのでは
# なく、config/側への変更を検知してdocs/側へ自動同期する仕組みを本
# ワークフロー1箇所に集約する。config/を唯一の正（バックエンド入力、
# common/registration/register_ticker.py〈新規登録のStep 6で書く〉と
# common/sec_data/registration_validator.py〈P1-Step6・P4〉が参照）とし、
# docs/portfolio/data/側はPortfolioの画面が読む表示専用の自動追従コピーと
# 位置づける。theme_config.jsonは読み手が同期の確認（rcc CHECK-32）だけ
# だったため、2026-10-23にconfig/・docs/の両方を消した（R-A Portfolioの段階2）。

on:
  push:
    branches: [kaihatsu]
    paths:
      - 'config/discover_config.json'
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Sync config/ to docs/portfolio/data/
        run: |
          cp config/discover_config.json docs/portfolio/data/discover_config.json

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/portfolio/data/discover_config.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: discover_config.json をdocs/へ自動同期 [skip ci]"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi
