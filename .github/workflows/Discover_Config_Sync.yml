name: Discover Config Sync

# [[DISCOVER-CONFIG-DUAL-MGMT-1]] 対応。config/discover_config.json・
# config/theme_config.jsonの書き手は複数存在する（value-monitor/admin.html
# 〈dual-write済み〉・discover/admin.html〈single-write〉・
# CLAUDE_CODE_START.md新規銘柄登録手順〈shutil.copy一回限り〉・
# Claude Code経由の直接編集）。書き手ごとに同期処理を分散実装するのでは
# なく、config/側への変更を検知してdocs/側へ自動同期する仕組みを本
# ワークフロー1箇所に集約する。config/を唯一の正（バックエンド入力、
# src/discover/collect.pyとcommon/sec_data/registration_validator.pyが
# 参照）とし、docs/portfolio/data/側は表示専用の自動追従コピーと
# 位置づける。

on:
  push:
    branches: [kaihatsu]
    paths:
      - 'config/discover_config.json'
      - 'config/theme_config.json'
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Sync config/ to docs/portfolio/data/
        run: |
          cp config/discover_config.json docs/portfolio/data/discover_config.json
          cp config/theme_config.json    docs/portfolio/data/theme_config.json

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/portfolio/data/discover_config.json \
                  docs/portfolio/data/theme_config.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: discover_config.json/theme_config.json をdocs/へ自動同期 [skip ci]"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi
