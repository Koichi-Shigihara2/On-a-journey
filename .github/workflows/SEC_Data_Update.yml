name: SEC Data Update

on:
  schedule:
    - cron: '0 12 * * 0'  # Sunday 12:00 UTC
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for all)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-sec-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SEC Data Update
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python common/sec_data/update.py $TICKERS
          else
            python common/sec_data/update.py
          fi

      - name: Consistency Check Gate
        # --include-yfinance-checks: CHECK-35/41のyfinance突合（operating_
        # income/revenue/net_income）を実行する。SECデータ更新は本ワーク
        # フロー（週1回、日曜）でのみ発生するため、yfinance突合も同じ頻度に
        # 揃える（[[QUALITY-GATES-EPIC-1]]、2026-09-03）。他3ワークフロー
        # （TANUKI_VALUATION_Update.yml等、日次実行）ではこのフラグを付けない。
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --include-yfinance-checks --ticker "${{ github.event.inputs.tickers }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --include-yfinance-checks
          fi

      - name: Sync normalized data to docs/ (stock.html public copy)
        # [[DOCS-SECDATA-NORMALIZED-DIR-STALE-1]]対応: common/sec_data/normalized/
        # （正規化ストアの唯一の正）を、GitHub Pages公開用コピー
        # docs/common/sec_data/normalized/ へ毎回同期する。stock.htmlが
        # クライアントサイドからこのdocs/配下のパスを直接fetchしているため、
        # docs/配下の存在自体は維持しつつ内容を常に本家と一致させる。
        run: |
          mkdir -p docs/common/sec_data/normalized
          rsync -a --delete common/sec_data/normalized/ docs/common/sec_data/normalized/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add common/sec_data/data/ || true
          git add common/sec_data/normalized/ || true
          git add common/sec_data/ttm/ || true
          git add docs/common/sec_data/normalized/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SEC Data - $(date +'%Y-%m-%d')"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi

      - name: Summary
        run: |
          echo "## SEC Data Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Annual Files | TTM Files |" >> $GITHUB_STEP_SUMMARY
          echo "|:-----------|:-----------|:-----------|" >> $GITHUB_STEP_SUMMARY
          for dir in common/sec_data/data/*/; do
            ticker=$(basename $dir)
            if [ "$ticker" != "_cik_cache.json" ]; then
              annual_count=$(ls -1 $dir/annual_*.json 2>/dev/null | wc -l)
              ttm_count=$(ls -1 common/sec_data/ttm/${ticker}_ttm_series.json 2>/dev/null | wc -l)
              echo "| $ticker | ${annual_count} files | ${ttm_count} files |" >> $GITHUB_STEP_SUMMARY
            fi
          done
