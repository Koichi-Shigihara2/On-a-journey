name: SEC Data Update

on:
  schedule:
    - cron: '0 12 * * 0'  # Sunday 12:00 UTC
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for all)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo
  # SECに名乗る連絡先（common/external_api.py が User-Agent を作る。無ければ止まる。[[EXTERNAL-API-CLIENT-UNIFY-1]]）
  SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}

jobs:
  update-sec-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        id: install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 1銘柄の失敗では止まらない（[[SEC-UPDATE-EXIT1-BLOCKS-ALL-1]]、2026-10-15）。失敗した銘柄は
      # $RUNNER_TEMP/sec_update_result.jsonに段階と理由つきで書き、_freshness.jsonにはFAILEDとして残す。
      # 終了コード1になるのは、失敗が対象の10%を超えたときと、銘柄のループの外で例外が出たときだけ
      - name: Run SEC Data Update
        id: update
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python common/sec_data/update.py $TICKERS
          else
            python common/sec_data/update.py
          fi

      # 失敗した銘柄の出力（common/sec_data/data/{T}/・normalized・ttm）を前回の状態（HEAD）に戻す。
      # 既存の銘柄はgit checkout HEAD --、新規の銘柄の作りかけはgit cleanで消す（rollback_failed.py）
      - name: Roll back failed tickers
        id: rollback
        run: python common/sec_data/rollback_failed.py

      - name: Consistency Check Gate
        id: gate
        # --include-yfinance-checks: CHECK-35/41のyfinance突合（operating_
        # income/revenue/net_income）を実行する。SECデータ更新は本ワーク
        # フロー（週1回、日曜）でのみ発生するため、yfinance突合も同じ頻度に
        # 揃える（[[QUALITY-GATES-EPIC-1]]、2026-09-03）。他3ワークフロー
        # （TANUKI_VALUATION_Update.yml等、日次実行）ではこのフラグを付けない。
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --include-yfinance-checks --ticker "${{ github.event.inputs.tickers }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --include-yfinance-checks
          fi

      - name: Sync normalized data to docs/ (stock.html public copy)
        id: sync
        # [[DOCS-SECDATA-NORMALIZED-DIR-STALE-1]]対応: common/sec_data/normalized/
        # （正規化ストアの唯一の正）を、GitHub Pages公開用コピー
        # docs/common/sec_data/normalized/ へ毎回同期する。stock.htmlが
        # クライアントサイドからこのdocs/配下のパスを直接fetchしているため、
        # docs/配下の存在自体は維持しつつ内容を常に本家と一致させる。
        run: |
          mkdir -p docs/common/sec_data/normalized
          rsync -a --delete common/sec_data/normalized/ docs/common/sec_data/normalized/

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add common/sec_data/data/ || true
          git add common/sec_data/normalized/ || true
          git add common/sec_data/ttm/ || true
          git add docs/common/sec_data/normalized/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SEC Data - $(date +'%Y-%m-%d')"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi

      # 表示だけの段。失敗してもjobの結果（下流の連鎖の条件）を変えない（通知の段はこの段を見ていないため）
      - name: Summary
        continue-on-error: true
        run: |
          echo "## SEC Data Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Annual Files | TTM Files |" >> $GITHUB_STEP_SUMMARY
          echo "|:-----------|:-----------|:-----------|" >> $GITHUB_STEP_SUMMARY
          for dir in common/sec_data/data/*/; do
            ticker=$(basename $dir)
            if [ "$ticker" != "_cik_cache.json" ]; then
              annual_count=$(ls -1 $dir/annual_*.json 2>/dev/null | wc -l)
              ttm_count=$(ls -1 common/sec_data/ttm/${ticker}_ttm_series.json 2>/dev/null | wc -l)
              echo "| $ticker | ${annual_count} files | ${ttm_count} files |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      # 結果・止まった段・失敗した銘柄と理由をDiscordへ送る（どの段で止まっても送る）。
      # webhookは他のワークフロー（SEC_Data_Audit.yml等）と同じDISCORD_WEB_HOOK
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
          OUTCOME_INSTALL: ${{ steps.install.outcome }}
          OUTCOME_UPDATE: ${{ steps.update.outcome }}
          OUTCOME_ROLLBACK: ${{ steps.rollback.outcome }}
          OUTCOME_GATE: ${{ steps.gate.outcome }}
          OUTCOME_SYNC: ${{ steps.sync.outcome }}
          OUTCOME_COMMIT: ${{ steps.commit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 common/sec_data/update_notify.py
