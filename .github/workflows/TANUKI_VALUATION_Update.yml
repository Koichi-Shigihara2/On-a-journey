name: TANUKI VALUATION Daily Update

# [[TANUKI-VALUATION-PRICE-SCHEDULE-LAG-1]]・[[WORKFLOW-SEC-TANUKI-GAP-1]]
# 対応: config/workflow_dependencies.jsonが定義する論理的依存
# （HypeCore_Update・Adjusted_EPS_Update・Stonks_Silo_Update）に加え、
# current_priceの取得元であるMarket_Data_Daily_Update（新たに判明した
# 未定義の依存）もworkflow_runの対象に含め、4本いずれかの完了で連鎖実行
# する。旧・独立cron（平日14:05 UTC）はMarket_Data_Daily_Update
# （平日21:40 UTC完了）より先に発火してしまい、current_priceが常に
# 前営業日終値になる構造的ラグの原因だったため削除。
# 安全網として、chainが何らかの理由で発火しなかった場合に備え、
# 週1回のみ低頻度フォールバックcronを残す（Market_Data_Daily_Updateの
# 金曜実行〈2026-08-29時点で21:25 UTC、旧21:40 UTC〉より確実に後になる
# 時刻に設定し、旧cronと同じレースを再現しないようにする）。
#
# 指示書㉕ STEP C（2026-09-30）: 一晩に2回動いていた（09-30: 00:49と00:51 UTC）。原因は、Market Data Daily Updateの完了と、
# その完了で動くStonks Silo Updateの完了の両方で起動していたこと。TANUKI VALUATIONはStonks Siloの結果
# （docs/value-monitor/stonks-silo/data/results.json: runway・revenue_growth）を読むため、Market Data Dailyの直後の1回目は
# 前夜のStonks Siloの結果で計算しており不要だった。2本が同時に動き、同じファイルへのcommit・pushとDiscord通知
# （score_watcher、同じ.watcher_state.jsonから判定）が重なる恐れもあった。Market Data Daily Updateを起動元から外し、
# Stonks Silo Updateの完了（Market Data Dailyの後に必ず動く）で1回だけ起動する。Stonks Siloが失敗した日も株価は
# 更新されているため、Stonks Siloのfailureでも起動する（その場合はStonks Siloの前回の結果を使う）。
# あわせてconcurrencyで同時実行を防ぐ（HypeCore・Adjusted EPSの完了と重なった場合は順番に動く）。
# 2026-10-03: 金曜のフォールバックcron（22:30 UTC）を削除。10-03（土）01:15 UTCに遅れて起動し、Market Data Dailyの取得（02:06）
# より前のデータで動いたうえ、Stonks Siloのフォールバックの完了でも起動し、この夜は3回動いた。起点はworkflow_runと手動実行だけ。
on:
  workflow_run:
    workflows:
      - "HypeCore Update"
      - "Adjusted_EPS_Data_Update"
      - "Stonks Silo Update"
    types: [completed]
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for all)'
        required: false
        default: ''

concurrency:
  group: tanuki-valuation
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  update-valuations:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      (github.event.workflow_run.name == 'Stonks Silo Update' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # [[MARKETDATA-LAYER-CONSTRUCTION-1]]着手順序4-2: data_fetcher.pyが
        # common.market_data.reader経由になったため、common/market_data/
        # fetcher.py（__init__.py経由で連鎖import）が要求する
        # pandas_market_calendars・pyyaml等もrequirements.txt経由で導入する
        # （Beta_Config_Update.ymlと同じ対応。旧: pip install yfinance
        # numpy requests xlrd だけでは不足しImportErrorになる。xlrdは
        # requirements.txtに既に含まれているため個別インストール不要）
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TANUKI VALUATION Pipeline
        working-directory: src/value/tanuki_valuation
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python pipeline.py $TICKERS
          else
            python pipeline.py
          fi

      - name: Consistency Check Gate
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --ticker "${{ github.event.inputs.tickers }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet
          fi

      # 2026-09-26（指示書㉑）: 通知はゲート通過後に行う。以前はゲートより前にあり、ゲートが
      # 公開を止めた日（例: 株価欠損でNG-56が出た日）もDiscordへ誤った判定変化が通知されていた。
      # ゲートが失敗するとジョブが止まるため、この段は実行されない（.watcher_state.jsonも更新されない）。
      - name: Detect TANUKI SCORE changes and notify Discord
        working-directory: src/value/tanuki_valuation
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
        run: python score_watcher.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/tanuki_valuation/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TANUKI VALUATION - $(date +'%Y-%m-%d %H:%M') JST"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi

      - name: Summary
        run: |
          echo "## TANUKI VALUATION Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Intrinsic Value | Validation |" >> $GITHUB_STEP_SUMMARY
          echo "|:-----------|:---------|:-----|" >> $GITHUB_STEP_SUMMARY
          for f in docs/value-monitor/tanuki_valuation/data/*/latest.json; do
            ticker=$(basename $(dirname $f))
            value=$(cat $f | python -c "import sys,json; d=json.load(sys.stdin); print(f\"{d.get('intrinsic_value_per_share', 0):.2f}\")" 2>/dev/null || echo "N/A")
            validation=$(cat $f | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('validation',{}).get('overall','--'))" 2>/dev/null || echo "--")
            echo "| $ticker | \$$value | $validation |" >> $GITHUB_STEP_SUMMARY
          done
