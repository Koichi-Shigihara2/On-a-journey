name: TANUKI VALUATION Daily Update

# Stonks Silo Update（Market Data Dailyの後に動く）・HypeCore Update・Adjusted_EPS_Data_Updateの完了で起動する。
# Stonks Siloは失敗でも起動する（株価は更新済み、Stonks Siloは前回の結果を使う）。同時に1本だけ動く。金曜22:30 UTCは安全網。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  workflow_run:
    workflows:
      - "HypeCore Update"
      - "Adjusted_EPS_Data_Update"
      - "Stonks Silo Update"
    types: [completed]
  schedule:
    - cron: '30 22 * * 5'  # 安全網（金曜22:30 UTC）
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for all)'
        required: false
        default: ''

concurrency:
  group: tanuki-valuation
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  update-valuations:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      (github.event.workflow_run.name == 'Stonks Silo Update' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # [[MARKETDATA-LAYER-CONSTRUCTION-1]]着手順序4-2: data_fetcher.pyが
        # common.market_data.reader経由になったため、common/market_data/
        # fetcher.py（__init__.py経由で連鎖import）が要求する
        # pandas_market_calendars・pyyaml等もrequirements.txt経由で導入する
        # （Beta_Config_Update.ymlと同じ対応。旧: pip install yfinance
        # numpy requests xlrd だけでは不足しImportErrorになる。xlrdは
        # requirements.txtに既に含まれているため個別インストール不要）
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TANUKI VALUATION Pipeline
        working-directory: src/value/tanuki_valuation
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python pipeline.py $TICKERS
          else
            python pipeline.py
          fi

      - name: Consistency Check Gate
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --ticker "${{ github.event.inputs.tickers }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet
          fi

      # 2026-09-26（指示書㉑）: 通知はゲート通過後に行う。以前はゲートより前にあり、ゲートが
      # 公開を止めた日（例: 株価欠損でNG-56が出た日）もDiscordへ誤った判定変化が通知されていた。
      # ゲートが失敗するとジョブが止まるため、この段は実行されない（.watcher_state.jsonも更新されない）。
      - name: Detect TANUKI SCORE changes and notify Discord
        working-directory: src/value/tanuki_valuation
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
        run: python score_watcher.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/tanuki_valuation/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TANUKI VALUATION - $(date +'%Y-%m-%d %H:%M') JST"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi

      - name: Summary
        run: |
          echo "## TANUKI VALUATION Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Intrinsic Value | Validation |" >> $GITHUB_STEP_SUMMARY
          echo "|:-----------|:---------|:-----|" >> $GITHUB_STEP_SUMMARY
          for f in docs/value-monitor/tanuki_valuation/data/*/latest.json; do
            ticker=$(basename $(dirname $f))
            value=$(cat $f | python -c "import sys,json; d=json.load(sys.stdin); print(f\"{d.get('intrinsic_value_per_share', 0):.2f}\")" 2>/dev/null || echo "N/A")
            validation=$(cat $f | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('validation',{}).get('overall','--'))" 2>/dev/null || echo "--")
            echo "| $ticker | \$$value | $validation |" >> $GITHUB_STEP_SUMMARY
          done
