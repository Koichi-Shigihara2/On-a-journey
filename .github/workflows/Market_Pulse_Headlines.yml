name: Market Pulse Headlines

# 見出しの日ごとの積み足し（[[MARKETPULSE-MOVE-POSTMORTEM-EPIC-1]] ①、2026-11-01）。6時間ごと・土日も含む。
# Grokは呼ばない。新しい記事が無ければ何も書かず、commitしない。夜のMarket Pulseの回も同じファイルに積み足す（訳・判定を写す）。
# 監視: System Healthの[N]（fetchesの最新が12時間より古ければ⚠️、24時間より古ければ🔴）と[J]（cronのあるワークフロー）。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  schedule:
    - cron: '40 0,6,12,18 * * *'   # 00:40・06:40・12:40・18:40 UTC（12:40は夏時間8:40 ET・冬時間7:40 ETで寄り付き前）
  workflow_dispatch:

concurrency:
  group: market-pulse-headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "feedparser>=6.0.0" "requests==2.31.0"

      - name: Fetch and accumulate headlines
        run: |
          python src/market/market_pulse/headlines_fetch.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/market-monitor/market-pulse/data/headlines/
          if git diff --staged --quiet; then
            echo "新しい記事が無い（commitしない）"
            exit 0
          fi
          git commit -m "chore: auto-update market pulse headlines $(date -u '+%Y-%m-%d %H:%M') UTC"
          bash .github/scripts/push_with_retry.sh kaihatsu
