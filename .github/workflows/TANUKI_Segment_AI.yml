name: TANUKI Segment AI

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Target ticker (e.g. NVDA)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate segment config via Grok
        env:
          TICKER: ${{ github.event.inputs.ticker }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import json
          import re
          import requests

          ticker = os.environ['TICKER'].strip().upper()
          xai_api_key = os.environ['XAI_API_KEY']

          seg_path = 'config/segment_config.json'
          with open(seg_path, 'r', encoding='utf-8') as f:
              seg_config = json.load(f)

          prompt = (
              f"{ticker}の事業セグメント別売上構成比(weight)と今後1〜3年の成長率予測(growth)を"
              "JSON形式で返せ。\n"
              '{"fiscal_year":"FY20XX","segments":['
              '{"name":"xxx","weight":0.XX,"growth":0.XX,"note":"xxx"}'
              ']}\n'
              "weightの合計は1.0。他のテキスト不要。"
          )

          res = requests.post(
              'https://api.x.ai/v1/chat/completions',
              headers={
                  'Authorization': f'Bearer {xai_api_key}',
                  'Content-Type': 'application/json'
              },
              json={
                  'model': 'grok-3-mini',
                  'messages': [
                      {
                          'role': 'system',
                          'content': 'あなたは米国株アナリストです。指定された銘柄の事業セグメント構成を分析し、JSON形式のみで回答してください。'
                      },
                      {'role': 'user', 'content': prompt}
                  ],
                  'max_tokens': 1024
              }
          )
          res.raise_for_status()
          content = res.json()['choices'][0]['message']['content']
          print(f'[Grok response]\n{content}\n')

          match = re.search(r'\{[\s\S]*\}', content)
          if not match:
              raise ValueError(f'JSONが見つかりません: {content[:200]}')
          parsed = json.loads(match.group(0))

          if 'segments' not in parsed or not isinstance(parsed['segments'], list):
              raise ValueError('segmentsフィールドが不正です')

          segs = {}
          for s in parsed['segments']:
              segs[s['name']] = {
                  'weight': s['weight'],
                  'growth': s['growth'],
                  'note': s.get('note', '')
              }

          seg_config[ticker] = {
              'enabled': True,
              'fiscal_year': parsed.get('fiscal_year', 'FY2025'),
              'segments': segs
          }

          with open(seg_path, 'w', encoding='utf-8') as f:
              json.dump(seg_config, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print(f'[OK] {ticker} のセグメント設定を更新しました')
          print(json.dumps(seg_config[ticker], ensure_ascii=False, indent=2))
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add config/segment_config.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: AI-generated segment config for ${{ github.event.inputs.ticker }}"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi
