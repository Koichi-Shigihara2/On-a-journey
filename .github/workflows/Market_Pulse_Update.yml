name: Market_Pulse_Update

# Market Data Daily Updateの完了（新しいデータを保存した実行だけ）で起動する。金曜22:50 UTCは安全網。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  workflow_run:
    workflows:
      - "Market Data Daily Update"
    types: [completed]
  schedule:
    - cron: "50 22 * * 5"  # 安全網（金曜22:50 UTC）
  workflow_dispatch:
    branches:
      - kaihatsu

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Run breadth calculator
        run: |
          python src/market/market_pulse/breadth_calculator.py

      - name: Run collect_and_send
        env:
          XAI_API_KEY:     ${{ secrets.XAI_API_KEY }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:  ${{ secrets.GMAIL_PASSWORD }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
        run: |
          python src/market/market_pulse/collect_and_send.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/market-monitor/market-pulse/data/
          git diff --staged --quiet || git commit -m "chore: auto-update market pulse data $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin kaihatsu
          git push origin kaihatsu
