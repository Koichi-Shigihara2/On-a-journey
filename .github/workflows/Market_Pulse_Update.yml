name: Market_Pulse_Update

# Market Data Daily Updateの完了（新しいデータを保存した実行だけ）で起動する。cronは無い（金曜の安全網は2026-10-03に削除）。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  workflow_run:
    workflows:
      - "Market Data Daily Update"
    types: [completed]
  workflow_dispatch:
    branches:
      - kaihatsu

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Run breadth calculator
        run: |
          python src/market/market_pulse/breadth_calculator.py

      - name: Run collect_and_send
        env:
          XAI_API_KEY:     ${{ secrets.XAI_API_KEY }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:  ${{ secrets.GMAIL_PASSWORD }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
        run: |
          python src/market/market_pulse/collect_and_send.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          # 見出しのファイル（data/headlines/）は merge=ours にしない。衝突したらリモートの版に戻し、collect_and_send.py が
          # ${RUNNER_TEMP}/headlines_pending.json に残したこの回の入力で積み足し直す（最大3回、だめならjobを失敗に）。
          # ほかのファイル（market_data.json 等）は今までどおり merge=ours。
          # git add は scripts/gen_update_schedule.py が出力のパスを読むためにも書く（headlines_push.py も同じパスを add する）
          git add docs/market-monitor/market-pulse/data/
          python src/market/market_pulse/headlines_push.py \
            --add docs/market-monitor/market-pulse/data/ \
            --message "chore: auto-update market pulse data $(date -u '+%Y-%m-%d %H:%M') UTC"
