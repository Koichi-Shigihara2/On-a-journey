name: Market_Pulse_Update

# [[MARKETPULSE-MDD-CHECKOUT-RACE-1]]対応（2026-09-26）: collect_and_send.py・
# breadth_calculator.pyは2026-08-11以降common/market_data/daily/（Market_Data_Daily_
# Updateが書く）に依存しているが、独立cron（21:35 UTC）はMarket_Data_Daily_Update
# （21:25 UTC）とcronの10分差だけに依存していた。GitHub側の遅延で両者がほぼ同時に
# 起動し、checkoutが日次データのpushより先になった日（直近20回中3回）は画面全体が
# 1営業日古くなっていた。TANUKI_VALUATION_Update.yml・Stonks_Silo_Update.ymlと同じ
# 型で、Market Data Daily Updateの完了を起点にし、独立cronは低頻度の
# フォールバックに置き換える（金曜22:50 UTC、Stonks Silo 22:40の10分後）。
# 2026-10-03: 金曜のフォールバックcronを削除。GitHubのscheduleが遅れ、10-03（土）01:28 UTCにMarket Data Dailyの取得（02:06）より
# 前に起動して前日のデータで動いた。Market Data Dailyは外部起動（tools/external_trigger/）とscheduleの保険で起動するため、
# この完了（workflow_run）だけを起点にする。
on:
  workflow_run:
    workflows:
      - "Market Data Daily Update"
    types: [completed]
  workflow_dispatch:
    branches:
      - kaihatsu

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Run breadth calculator
        run: |
          python src/market/market_pulse/breadth_calculator.py

      - name: Run collect_and_send
        env:
          XAI_API_KEY:     ${{ secrets.XAI_API_KEY }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:  ${{ secrets.GMAIL_PASSWORD }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
        run: |
          python src/market/market_pulse/collect_and_send.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/market-monitor/market-pulse/data/
          git diff --staged --quiet || git commit -m "chore: auto-update market pulse data $(date -u '+%Y-%m-%d %H:%M') UTC"
          bash .github/scripts/push_with_retry.sh kaihatsu
