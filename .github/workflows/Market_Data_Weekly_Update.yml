name: Market Data Weekly Update

on:
  schedule:
    - cron: '20 13 * * 0'  # 日曜13:20 UTC（JST 22:20）。 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for full universe: S&P500+monitor+index/ETF/commodity)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-market-data-weekly:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Run fetch_weekly_attributes and fetch_analyst_events
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python common/market_data/fetcher.py $TICKERS --layer attributes
            python common/market_data/fetcher.py $TICKERS --layer analyst
          else
            python common/market_data/fetcher.py --layer attributes
            python common/market_data/fetcher.py --layer analyst
          fi

      - name: Append valuation snapshots
        # forward_pe・trailing_pe・price_to_sales・ev_to_ebitda を取得の日付つきで積む（追記だけ。common/market_data/valuation_history/）。
        # フォワードPERは過去の値が取れないため、週1回の値を今から保存する（[[HYPECORE-STAGE-TIMESCALE-1]] 段B-4、2026-11-05）
        continue-on-error: true
        run: python common/market_data/valuation_history.py

      - name: Rebuild sector master
        # 業種のマスター（config/sector_master.json）を属性の取得の後に作り直す（[[HYPECORE-STAGE-TIMESCALE-1]] 段B-1、2026-11-05）。
        # yfinanceの業種が変わった銘柄は changes に残り、System Health の [P] ExternalChange に出る
        run: python common/sector_master.py --all

      - name: Rebuild profitability
        # 業種のマスターの作り直しの後に、収益の段階（区分なし・金融はマスターで決まる）を作り直す（[[HYPECORE-STAGE-TIMESCALE-1]] 段B-2）
        continue-on-error: true
        run: python common/profitability.py --all

      - name: Rebuild multiples
        # 倍率の履歴（前の月末まで）と分割の食い違いの台帳（[[HYPECORE-STAGE-TIMESCALE-1]] 段B-4）
        continue-on-error: true
        run: python common/multiples.py --all

      - name: Rebuild stage v2 (parallel)
        # 定義v2の並行計算（[[STAGE-V2-ROLLOUT-1]] ①）。倍率の履歴の作り直しの後
        continue-on-error: true
        run: python common/stage_v2.py --all

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add common/market_data/attributes/ || true
          git add common/market_data/analyst_history/ || true
          git add common/market_data/_sp500_constituents_cache.json || true
          git add config/sector_master.json || true
          git add docs/common/profitability.json || true
          git add common/market_data/valuation_history/ docs/common/multiples/ config/split_price_ledger.json || true
          git add docs/common/stage_v2/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Market Data Weekly - $(date +'%Y-%m-%d')"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi

      - name: Summary
        run: |
          echo "## Market Data Weekly Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          attr_count=$(ls -1 common/market_data/attributes/*.json 2>/dev/null | wc -l)
          hist_count=$(ls -1 common/market_data/analyst_history/*.json 2>/dev/null | wc -l)
          echo "attributes/ 保存銘柄数: ${attr_count}" >> $GITHUB_STEP_SUMMARY
          echo "analyst_history/ 保存銘柄数: ${hist_count}" >> $GITHUB_STEP_SUMMARY
