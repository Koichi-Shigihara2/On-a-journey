name: Market Data Daily Update

# 主の起動は外部（tools/external_trigger/ のCloudflare Worker、平日20:25・20:55・21:25 UTCにworkflow_dispatch〈guard=true〉、
# 21:50 UTCに成功した実行が無ければもう一度）。下のscheduleは保険（平日20:47〜23:17 UTCの30分おき＋01:47・02:17 UTC〈火〜土〉）。
# 最初のガード（common/market_data/daily_guard.py）で「NYSEの引けから20分経っていない」「その日の終値が既にそろっている」なら何もしない。
# 作り直しの時間帯（半数以上に終値が無い）は保存せず終了。新しいデータを保存しなかった実行は自分を取り消し、下流（Market Pulse・Stonks Silo）を動かさない。
# 起動時刻・連鎖・経緯: docs/architecture/UPDATE_SCHEDULE.md
on:
  schedule:
    - cron: '47 20 * * 1-5'        # 20:47 UTC（平日）
    - cron: '17,47 21-22 * * 1-5'  # 21:17・21:47・22:17・22:47 UTC（平日）
    - cron: '17 23 * * 1-5'        # 23:17 UTC（平日。00:00 UTCより前に終える最後の起動）
    # 保険（上の起動がすべて遅延・失敗した日。ガードはニューヨーク時間の日付＝前日の米国の取引日で判定）
    - cron: '47 1 * * 2-6'         # 01:47 UTC
    - cron: '17 2 * * 2-6'         # 02:17 UTC
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for full universe: S&P500+monitor+index/ETF/commodity)'
        required: false
        default: ''
      # 外部起動（tools/external_trigger/ のCloudflare Worker、2026-10-03）はguard=trueで呼び、scheduleと同じガードを通す。
      # 人が手動で実行するとき（既定のfalse）は従来どおりガードを通さず取得する
      guard:
        description: 'Run the guard (NYSE close + 20 min / closes already saved) like scheduled runs. Leave unchecked for a manual fetch.'
        type: boolean
        required: false
        default: false

concurrency:
  group: market-data-daily
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  update-market-data-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # 何もしなかった実行を自分で取り消すため（gh run cancel）
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Guard (NYSE close + 20 min / closes already saved)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.guard }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=手動実行" >> "$GITHUB_OUTPUT"
          else
            python common/market_data/daily_guard.py >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Run fetch_daily_prices
        id: fetch
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python common/market_data/fetcher.py $TICKERS --layer daily --status-file /tmp/daily_status.json
          else
            python common/market_data/fetcher.py --layer daily --status-file /tmp/daily_status.json
          fi
          echo "status=$(python -c "import json;print(json.load(open('/tmp/daily_status.json'))['status'])")" >> "$GITHUB_OUTPUT"

      # reset_window（Yahooの作り直しの時間帯）で終わった実行はcommitしない（2026-10-03）。daily/は変わらず、
      # _daily_close_retry_log.jsonの記録だけのcommitが「Update Market Data Daily」の件名で残っていた（10-03の2本）
      - name: Commit and push changes
        id: commit
        if: steps.guard.outputs.run == 'true' && steps.fetch.outputs.status != 'reset_window'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          # 新しいデータを保存したか（daily/に変更があるか）。下流を動かすかの判定に使う
          if git diff --quiet -- common/market_data/daily/; then
            echo "saved=false" >> "$GITHUB_OUTPUT"
          else
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
          git add common/market_data/daily/ || true
          git add common/market_data/*/market_data_violations_log.json || true
          git add common/market_data/_sp500_constituents_cache.json || true
          git add common/market_data/_daily_close_retry_log.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Market Data Daily - $(date +'%Y-%m-%d')"
            bash .github/scripts/push_with_retry.sh kaihatsu
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Market Data Daily Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ガード: run=${{ steps.guard.outputs.run }}（${{ steps.guard.outputs.reason }}）" >> $GITHUB_STEP_SUMMARY
          echo "- 取得: status=${{ steps.fetch.outputs.status }} / 新しいデータの保存: ${{ steps.commit.outputs.saved }}" >> $GITHUB_STEP_SUMMARY
          count=$(ls -1 common/market_data/daily/*.json 2>/dev/null | wc -l)
          echo "- daily/ 保存銘柄数: ${count}" >> $GITHUB_STEP_SUMMARY

      # 何もしなかった実行・新しいデータを保存しなかった実行は、下流を起動しないよう自分自身を取り消す
      # （conclusionが'cancelled'になり、下流のジョブの`conclusion == 'success'`の条件に当たらない）
      - name: Cancel this run when no new data was saved (downstream stays idle)
        if: steps.guard.outputs.run != 'true' || steps.fetch.outputs.status != 'fetched' || steps.commit.outputs.saved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "新しいデータなし（guard=${{ steps.guard.outputs.run }} status=${{ steps.fetch.outputs.status }} saved=${{ steps.commit.outputs.saved }}）: 下流を起動しないため取り消す"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
          sleep 120
