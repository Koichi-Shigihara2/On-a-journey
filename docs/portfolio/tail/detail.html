<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANUKI TAIL — 詳細</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:   #0a0d14;
      --sur:  #111520;
      --sur2: #161c2d;
      --bdr:  #1e2840;
      --acc:  #3b82f6;
      --grn:  #10b981;
      --red:  #f43f5e;
      --amb:  #f59e0b;
      --txt:  #e2e8f0;
      --sub:  #7a92b0;
      --mut:  #64748b;
      --core: #f0a500;
      --sat:  #4a9eff;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', 'Noto Sans JP', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--txt); font-family: var(--sans); font-size: 14px; line-height: 1.6; }

    /* ── Site header ── */
    header {
      border-bottom: 1px solid var(--bdr); padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--bg); z-index: 100; gap: 12px;
    }
    .logo { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: .12em; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--txt); }
    .logo-dot { width: 8px; height: 8px; background: var(--core); border-radius: 50%; animation: pdot 2s ease-in-out infinite; }
    @keyframes pdot { 0%,100%{box-shadow:0 0 0 0 rgba(240,165,0,.4)} 50%{box-shadow:0 0 0 6px rgba(240,165,0,0)} }
    .nav-links a,.site-nav a { font-family: var(--mono); font-size: 11px; color: var(--mut); text-decoration: none; letter-spacing: .06em; padding: 4px 0; border-bottom: 1px solid transparent; transition: all .2s; }
    .nav-links a:hover,.site-nav a:hover { color: var(--acc); border-bottom-color: var(--acc); }
    .nav-links a.active,.site-nav a.active { color: var(--core); border-bottom-color: var(--core); }
    .site-nav { display: flex; gap: 14px; flex-wrap: wrap; }

    /* ── Auth ── */
    #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-box { background: var(--sur); border: 1px solid var(--bdr); border-radius: 12px; padding: 48px 40px; width: 340px; text-align: center; }
    .auth-title { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--core); letter-spacing: .1em; margin-bottom: 8px; }
    .auth-sub   { font-family: var(--mono); font-size: 11px; color: var(--mut); margin-bottom: 28px; }
    .auth-row   { display: flex; gap: 8px; justify-content: center; }
    .auth-input { font-family: var(--mono); font-size: 13px; padding: 10px 14px; background: var(--sur2); border: 1px solid var(--bdr); color: var(--txt); width: 190px; border-radius: 4px; outline: none; }
    .auth-input:focus { border-color: var(--acc); }
    .auth-btn   { padding: 10px 18px; background: var(--core); color: #000; border: none; cursor: pointer; font-family: var(--mono); font-size: 13px; border-radius: 4px; font-weight: 700; }
    .auth-btn:hover { opacity: .85; }
    #pw-error   { color: var(--red); font-size: 11px; font-family: var(--mono); margin-top: 12px; min-height: 16px; }

    /* ── Sub-header ── */
    .sub-hdr {
      border-bottom: 1px solid var(--bdr); padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--sur); gap: 12px; flex-wrap: wrap;
    }
    .back-link { font-family: var(--mono); font-size: 11px; color: var(--sub); text-decoration: none; border: 1px solid var(--bdr); padding: 4px 10px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .back-link:hover { color: var(--core); border-color: var(--core); }
    #ticker-info { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; flex-wrap: wrap; }
    #ticker-nav  { display: flex; gap: 6px; flex-shrink: 0; }
    .nav-btn { font-family: var(--mono); font-size: 11px; color: var(--sub); text-decoration: none; border: 1px solid var(--bdr); padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
    .nav-btn:hover { color: var(--core); border-color: var(--core); }

    /* ── Layout ── */
    .shell { max-width: 940px; margin: 0 auto; padding: 24px 16px 64px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 660px) { .two-col { grid-template-columns: 1fr; } }
    .col-card { background: var(--sur); border-radius: 8px; padding: 16px; min-width: 0; }

    /* ── Section title ── */
    .sec-hd {
      font-family: var(--mono); font-size: 11px; text-transform: uppercase;
      color: var(--sub); letter-spacing: .1em; margin: 28px 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .sec-hd::after { content: ''; flex: 1; height: 1px; background: var(--bdr); }
    .sec-hd:first-child { margin-top: 0; }

    /* ── Badges ── */
    .tag { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 2px; flex-shrink: 0; }
    .tag.core { background: rgba(240,165,0,.1);  color: var(--core); border: 1px solid rgba(240,165,0,.2); }
    .tag.sat  { background: rgba(74,158,255,.1); color: var(--sat);  border: 1px solid rgba(74,158,255,.2); }
    .rec-badge { display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }
    .rec-continue { background: rgba(16,185,129,.15); color: var(--grn); border: 1px solid rgba(16,185,129,.3); }
    .rec-watch    { background: rgba(245,158,11,.15);  color: var(--amb); border: 1px solid rgba(245,158,11,.3); }
    .rec-revise   { background: rgba(244,63,94,.12);   color: var(--red); border: 1px solid rgba(244,63,94,.25); }
    .rec-exit     { background: rgba(244,63,94,.22);   color: var(--red); border: 2px solid rgba(244,63,94,.5); }

    /* ── Section 1: サマリーバー ── */
    .sum-bar { display: flex; border: 1px solid var(--bdr); border-radius: 8px; overflow: hidden; }
    .sum-item { flex: 1; padding: 12px 14px; border-right: 1px solid var(--bdr); min-width: 0; }
    .sum-item:last-child { border-right: none; }
    .sum-label { font-family: var(--mono); font-size: 9px; color: var(--mut); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
    .sum-value { font-family: var(--mono); font-size: 17px; font-weight: 700; line-height: 1.2; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    @media (max-width: 540px) {
      .sum-bar { flex-direction: column; }
      .sum-item { border-right: none; border-bottom: 1px solid var(--bdr); }
      .sum-item:last-child { border-bottom: none; }
    }

    /* ── Section 2: テーゼ（折りたたみ） ── */
    .thesis-wrap details { background: var(--sur); border: 1px solid var(--bdr); border-radius: 8px; }
    .thesis-wrap summary {
      padding: 12px 16px; cursor: pointer; font-family: var(--mono); font-size: 12px;
      color: var(--sub); letter-spacing: .06em; list-style: none; user-select: none;
      display: flex; align-items: center; gap: 8px;
    }
    .thesis-wrap summary::-webkit-details-marker { display: none; }
    .thesis-wrap summary::before { content: '▶'; font-size: 10px; }
    .thesis-wrap details[open] summary::before { content: '▼'; }
    .thesis-wrap details[open] summary { border-bottom: 1px solid var(--bdr); }
    .thesis-inner { padding: 16px; }
    .thesis-text { font-size: 14px; line-height: 1.8; color: var(--txt); white-space: pre-wrap; word-break: break-word; }
    .sub-label { font-family: var(--mono); font-size: 10px; color: var(--sub); letter-spacing: .07em; margin: 14px 0 6px; }
    .sub-block { font-size: 13px; line-height: 1.7; color: var(--sub); white-space: pre-wrap; padding: 10px 14px; background: var(--sur2); border-radius: 6px; border-left: 2px solid var(--bdr); }
    .meta-row  { display: flex; gap: 20px; font-family: var(--mono); font-size: 11px; color: var(--mut); margin-top: 12px; flex-wrap: wrap; }

    /* ── Section 3: KPIトレンド ── */
    .kpi-block { margin-bottom: 16px; }
    .kpi-name  { font-family: var(--mono); font-size: 11px; color: var(--sub); margin-bottom: 4px; }

    /* ── Section 3: 最新レビュー ── */
    .gauge-row  { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .gauge-num  { font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1; flex-shrink: 0; }
    .gauge-bar  { flex: 1; height: 6px; background: var(--sur2); border-radius: 3px; overflow: hidden; }
    .gauge-fill { height: 100%; border-radius: 3px; }
    .rv-summary { font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
    .bias-box   { background: rgba(244,63,94,.07); border: 1px solid rgba(244,63,94,.3); border-radius: 4px; padding: 8px 12px; margin-bottom: 10px; font-size: 12px; color: var(--red); line-height: 1.6; }
    .bias-lbl   { display: block; font-family: var(--mono); font-size: 9px; margin-bottom: 2px; letter-spacing: .06em; }
    .inner-two  { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    @media (max-width: 480px) { .inner-two { grid-template-columns: 1fr; } }
    .list-box   { background: var(--sur2); border-radius: 6px; padding: 10px; }
    .list-title { font-family: var(--mono); font-size: 9px; letter-spacing: .07em; margin-bottom: 6px; }
    .list-title.pos { color: var(--grn); } .list-title.neg { color: var(--amb); }
    .blist      { list-style: none; }
    .blist li   { font-size: 12px; line-height: 1.6; padding: 3px 0 3px 12px; position: relative; border-bottom: 1px solid rgba(30,40,64,.4); }
    .blist li:last-child { border-bottom: none; }
    .blist li::before { content: '›'; position: absolute; left: 0; }
    .blist.pos li::before { color: var(--grn); } .blist.neg li::before { color: var(--amb); }
    .exit-row   { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; background: var(--sur2); border-radius: 6px; margin-bottom: 10px; }
    .exit-dist  { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
    .ed-far     { background: rgba(16,185,129,.12); color: var(--grn); border: 1px solid rgba(16,185,129,.25); }
    .ed-close   { background: rgba(244,63,94,.12);  color: var(--red); border: 1px solid rgba(244,63,94,.25); }
    .ed-watch   { background: rgba(245,158,11,.12); color: var(--amb); border: 1px solid rgba(245,158,11,.25); }
    .nkpi-wrap  { display: flex; flex-wrap: wrap; gap: 5px; }
    .nkpi-tag   { font-family: var(--mono); font-size: 10px; padding: 2px 8px; background: rgba(59,130,246,.1); color: var(--acc); border: 1px solid rgba(59,130,246,.25); border-radius: 2px; }

    /* ── Section 4: DCF ── */
    .dcf-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .dcf-tbl th { background: var(--sur2); padding: 7px 10px; font-family: var(--mono); font-size: 9px; letter-spacing: .06em; border-bottom: 1px solid var(--bdr); text-align: center; color: var(--sub); white-space: nowrap; }
    .dcf-tbl th:first-child { text-align: left; }
    .dcf-tbl td { padding: 7px 10px; border-bottom: 1px solid rgba(30,40,64,.4); }
    .dcf-tbl td:first-child { font-family: var(--mono); font-size: 11px; }
    .dcf-tbl td:not(:first-child) { text-align: center; font-family: var(--mono); }
    .dcf-tbl tr:last-child td { border-bottom: none; }
    .dcf-bear td { color: var(--red); }
    .dcf-base td { color: var(--acc); }
    .dcf-bull td { color: var(--grn); }
    .tbl-wrap { overflow-x: auto; }
    .dcf-rationale { font-size: 12px; line-height: 1.6; color: var(--sub); padding: 8px 10px; background: var(--sur2); border-radius: 4px; margin-top: 6px; }

    /* ── Section 4: AI視点 ── */
    .persp-block { padding: 10px 12px; background: var(--sur2); border-radius: 6px; margin-bottom: 8px; }
    .persp-label { font-family: var(--mono); font-size: 9px; color: var(--sub); letter-spacing: .07em; margin-bottom: 3px; }
    .persp-text  { font-size: 12px; line-height: 1.6; }
    .analogy-box { border: 1px solid rgba(59,130,246,.3); border-radius: 6px; padding: 12px; margin-bottom: 10px; background: rgba(59,130,246,.04); }
    .analogy-co  { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--acc); margin-bottom: 6px; }
    .analogy-row { font-size: 12px; line-height: 1.6; color: var(--sub); margin-bottom: 3px; }
    .analogy-row strong { color: var(--txt); }
    .tq-list     { list-style: none; }
    .tq-list li  { font-size: 12px; line-height: 1.6; padding: 5px 0 5px 14px; position: relative; border-bottom: 1px solid rgba(30,40,64,.4); color: var(--acc); }
    .tq-list li:last-child { border-bottom: none; }
    .tq-list li::before { content: '?'; position: absolute; left: 0; font-family: var(--mono); }
    .focus-wrap  { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .focus-tag   { font-family: var(--mono); font-size: 10px; padding: 2px 8px; background: rgba(240,165,0,.1); color: var(--core); border: 1px solid rgba(240,165,0,.2); border-radius: 2px; }

    /* ── Section 5: 内部統制 ── */
    .ctrl-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 4px; margin-bottom: 8px; font-family: var(--mono); }
    .ctrl-ok    { background: rgba(16,185,129,.12); color: var(--grn); border: 1px solid rgba(16,185,129,.3); }
    .ctrl-ng    { background: rgba(244,63,94,.12);  color: var(--red); border: 1px solid rgba(244,63,94,.3); }
    .ctrl-unk   { background: rgba(100,116,139,.1); color: var(--mut); border: 1px solid var(--bdr); }
    .ctrl-excerpt { font-size: 12px; line-height: 1.8; white-space: pre-wrap; padding: 12px; background: var(--sur2); border-radius: 6px; color: var(--txt); max-height: 200px; overflow-y: auto; }
    .ctrl-en    { font-family: var(--mono); font-size: 10px; color: var(--sub); }
    details > summary { cursor: pointer; font-family: var(--mono); font-size: 10px; color: var(--sub); padding: 6px 0; list-style: none; user-select: none; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: '▶ '; font-size: 9px; }
    details[open] > summary::before { content: '▼ '; }
    .thesis-wrap details > summary::before { content: ''; } /* thesis uses its own style */

    /* ── Section 6: 履歴 ── */
    .hist-row  { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(30,40,64,.4); }
    .hist-row:last-child { border-bottom: none; }
    .hist-q    { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 72px; flex-shrink: 0; padding-top: 2px; color: var(--txt); }
    .hist-sc   { font-family: var(--mono); font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .hist-sum  { font-size: 12px; line-height: 1.5; color: var(--sub); flex: 1; min-width: 0; }
    .hist-delta { display: inline-block; font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; margin-left: 3px; vertical-align: middle; }
    .delta-up   { color: var(--grn); background: rgba(16,185,129,.1); }
    .delta-dn   { color: var(--red); background: rgba(244,63,94,.1); }
    .delta-zero { color: var(--mut); background: rgba(100,116,139,.1); }

    /* Misc */
    .no-data   { font-family: var(--mono); font-size: 12px; color: var(--mut); padding: 20px; text-align: center; background: var(--sur2); border-radius: 6px; }
    .muted-meta { font-family: var(--mono); font-size: 10px; color: var(--mut); margin-bottom: 10px; }
    .sec-sub   { font-family: var(--mono); font-size: 9px; color: var(--sub); letter-spacing: .07em; margin-bottom: 6px; text-transform: uppercase; }
    .assm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 480px) { .assm-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-tool="tail">

<!-- 認証画面 -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">TANUKI TAIL</div>
    <div class="auth-sub">DETAIL VIEW</div>
    <div class="auth-row">
      <input id="pw-input" type="password" class="auth-input" placeholder="Password">
      <button class="auth-btn" onclick="checkPassword()">→</button>
    </div>
    <div id="pw-error"></div>
  </div>
</div>

<!-- アプリシェル（認証後に表示） -->
<div id="app-shell" style="display:none">
  <header>
    <a class="logo" href="/On-a-journey/">
      <span class="logo-dot"></span>TANUKI TAIL
    </a>
    <div class="nav-links"></div>
  </header>

  <div class="sub-hdr">
    <a href="index.html" class="back-link">← TAIL一覧</a>
    <div id="ticker-info"></div>
    <div id="ticker-nav"></div>
  </div>

  <main>
    <div class="shell" id="det-main">
      <div class="no-data">読込中...</div>
    </div>
  </main>
</div>

<script src="../../common/site-nav.js"></script>
<script>
/* ─── 認証 ─── */
var PW_HASH     = '1ccaba2b5d2e782f70745dc02ee88f537d51f6938bd6c22982a3d4d685be483a';
var SESSION_KEY = 'tail_auth';

async function sha256(t) {
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
}
async function checkPassword() {
  var pw = document.getElementById('pw-input').value;
  if (await sha256(pw) === PW_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    boot();
  } else {
    document.getElementById('pw-error').textContent = 'パスワードが違います';
  }
}
function boot() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-shell').style.display   = 'block';
  loadAll();
}
document.addEventListener('DOMContentLoaded', function () {
  var inp = document.getElementById('pw-input');
  if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') checkPassword(); });
  if (sessionStorage.getItem(SESSION_KEY) === '1') boot();
});

/* ─── State ─── */
var ticker = new URLSearchParams(location.search).get('ticker') || '';
var S = {
  thesis:  null,   /* positions/{ticker}_thesis.json */
  reviews: {},     /* { quarter: reviewJson } */
  kpi:     null,   /* kpi/{ticker}_layer2.json */
  ctrlItems: {},   /* { item1, item1a, item3, item4, item7 } */
  scenarios: {},   /* { bear, base, bull } — ../scenario/{ticker}/{sc}.json */
  val:     null,   /* value-monitor/tanuki_valuation/data/{ticker}/latest.json */
  allPos:  [],     /* ナビ用全ポジション（CORE→SAT順） */
};

/* ─── 全データ一括取得 ─── */
function loadAll() {
  if (!ticker) { render(); return; }
  document.title = 'TANUKI TAIL — ' + ticker;

  /* テーゼ */
  var thP = fetch('data/positions/' + ticker + '_thesis.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (d) { S.thesis = d; });

  /* レビュー一覧 → 個別ファイル */
  var rvP = fetch('data/review_queue.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : { queue: [] }; })
    .catch(function () { return { queue: [] }; })
    .then(function (data) {
      var done = (data.queue || []).filter(function (e) {
        return e.ticker === ticker && e.status === 'completed';
      });
      return Promise.all(done.map(function (e) {
        return fetch('data/reviews/' + e.ticker + '_' + e.quarter + '_review.json?_=' + Date.now())
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (rv) { if (rv) S.reviews[e.quarter] = rv; });
      }));
    });

  /* KPI layer2 */
  var kpiP = fetch('data/kpi/' + ticker + '_layer2.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (d) { S.kpi = d; });

  /* 内部統制（Item 1/1A/3/4/7 並列取得） */
  var CTRL_ITEMS = [
    { key: 'item1',  path: 'item1/latest.json',  label: 'ITEM 1 — 事業概要',                          badge: false },
    { key: 'item1a', path: 'item1a/latest.json', label: 'ITEM 1A — リスク要因',                       badge: false },
    { key: 'item3',  path: 'item3/latest.json',  label: 'ITEM 3 — 法的手続き',                        badge: false },
    { key: 'item4',  path: 'latest.json',         label: 'ITEM 4 — 内部統制',                         badge: true  },
    { key: 'item7',  path: 'item7/latest.json',  label: 'ITEM 7 — 経営者による財務状態の分析（MD&A）', badge: false },
  ];
  var ctrlBase = 'data/ctrl/' + ticker + '/';
  var ctrlP = Promise.allSettled(
    CTRL_ITEMS.map(function (item) {
      return fetch(ctrlBase + item.path + '?_=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    })
  ).then(function (results) {
    CTRL_ITEMS.forEach(function (item, i) {
      var r = results[i];
      if (r.status === 'fulfilled' && r.value) S.ctrlItems[item.key] = r.value;
    });
  });
  window._CTRL_ITEMS = CTRL_ITEMS; /* buildCtrl() から参照 */

  /* DCFシナリオ（将来株価 bear/base/bull） */
  var scenP = Promise.allSettled(['bear', 'base', 'bull'].map(function (sc) {
    return fetch('../scenario/' + ticker + '/' + sc + '.json?_=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  })).then(function (results) {
    ['bear', 'base', 'bull'].forEach(function (sc, i) {
      var r = results[i];
      if (r.status === 'fulfilled' && r.value) S.scenarios[sc] = r.value;
    });
  });

  /* バリュエーション（任意） */
  var valP = fetch('../../value-monitor/tanuki_valuation/data/' + ticker + '/latest.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (d) {
      if (!d) return;
      var comp = d.components || {};
      S.val = {
        current_price:   comp.current_price          || null,
        intrinsic_value: d.intrinsic_value_per_share || null,
        upside_percent:  d.upside_percent            || null,
      };
    });

  /* 銘柄ナビ */
  var navP = fetch('data/positions_index.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : { positions: [] }; })
    .catch(function () { return { positions: [] }; })
    .then(function (idx) {
      return Promise.all((idx.positions || []).map(function (fname) {
        return fetch('data/positions/' + fname + '?_=' + Date.now())
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }));
    })
    .then(function (items) {
      S.allPos = items.filter(Boolean).filter(function (p) { return p.status !== 'archived'; });
      S.allPos.sort(function (a, b) {
        if (a.type !== b.type) return a.type === 'core' ? -1 : 1;
        return (a.ticker || '').localeCompare(b.ticker || '');
      });
    });

  Promise.all([thP, rvP, kpiP, ctrlP, scenP, valP, navP]).then(render);
}

/* ─── 一括描画 ─── */
function render() {
  renderSubHeader();
  var parts = [
    buildSummaryBar(),    /* セクション1: サマリーバー */
    buildThesis(),        /* セクション2: 投資テーゼ（折りたたみ） */
    '<div class="two-col">' + buildReview() + buildKpi() + '</div>', /* セクション3: 最新レビュー（左）| KPIトレンド（右） */
    '<div class="two-col">' + buildAi()    + buildDcf() + '</div>', /* セクション4: AI視点（左）| DCFシナリオ（右） */
    buildCtrl(),          /* セクション5: 内部統制（DCF直下） */
    buildHistory(),       /* セクション6: 過去レビュー履歴 */
  ];
  document.getElementById('det-main').innerHTML = parts.join('');
}

/* ─── サブヘッダー ─── */
function renderSubHeader() {
  var th     = S.thesis;
  var isCore = th && th.type === 'core';
  var tc     = isCore ? 'var(--core)' : 'var(--sat)';
  var qs     = Object.keys(S.reviews).sort().reverse();
  var s1     = qs.length ? (S.reviews[qs[0]].stage1 || {}) : {};
  var score  = s1.health_score;
  var rec    = s1.recommendation || '';

  var scoreHtml = score != null
    ? '<span style="font-family:var(--mono);font-size:14px;font-weight:700;color:' + scoreColor(score) + '">' + score + '</span>' +
      (rec ? ' <span class="rec-badge rec-' + rec.toLowerCase() + '">' + esc(rec) + '</span>' : '')
    : '';

  document.getElementById('ticker-info').innerHTML =
    '<span style="font-family:var(--mono);font-size:16px;font-weight:700;color:' + tc + '">' + esc(ticker || '?') + '</span>' +
    (th ? ' <span class="tag ' + (isCore ? 'core' : 'sat') + '">' + (isCore ? 'CORE' : 'SAT') + '</span>' : '') +
    (scoreHtml ? ' ' + scoreHtml : '');

  var all  = S.allPos;
  var idx  = all.findIndex(function (x) { return x.ticker === ticker; });
  var prev = idx > 0 ? all[idx - 1] : null;
  var next = (idx >= 0 && idx < all.length - 1) ? all[idx + 1] : null;
  document.getElementById('ticker-nav').innerHTML =
    (prev ? '<a href="detail.html?ticker=' + prev.ticker + '" class="nav-btn">← ' + prev.ticker + '</a>' : '') +
    (next ? '<a href="detail.html?ticker=' + next.ticker + '" class="nav-btn">' + next.ticker + ' →</a>' : '');
}

/* ══════════════════════════════════
   セクション1: サマリーバー
══════════════════════════════════ */
function buildSummaryBar() {
  var v    = S.val;
  var dev  = v ? v.upside_percent  : null;
  var iv   = v ? v.intrinsic_value : null;
  var cp   = v ? v.current_price   : null;
  var qs   = Object.keys(S.reviews).sort().reverse();
  var s1   = qs.length ? (S.reviews[qs[0]].stage1 || {}) : {};
  var sc   = s1.health_score;
  var rec  = s1.recommendation || '';
  var devC = dev != null ? (dev >= 0 ? 'var(--grn)' : 'var(--red)') : 'var(--mut)';

  return '<div class="sec-hd">サマリー</div>' +
    '<div class="sum-bar">' +
    sumItem('乖離率',
      dev != null ? '<span style="color:' + devC + '">' + (dev >= 0 ? '+' : '') + dev.toFixed(1) + '%</span>'
                  : '<span style="color:var(--mut)">–</span>') +
    sumItem('理論株価 IV',
      iv  != null ? '$' + iv.toFixed(2)  : '<span style="color:var(--mut)">–</span>') +
    sumItem('現在株価',
      cp  != null ? '$' + cp.toFixed(2)  : '<span style="color:var(--mut)">–</span>') +
    sumItem('スコア / 判定',
      sc != null
        ? '<span style="color:' + scoreColor(sc) + '">' + sc + '</span>' +
          (rec ? ' <span class="rec-badge rec-' + rec.toLowerCase() + '" style="font-size:10px">' + esc(rec) + '</span>' : '')
        : '<span style="color:var(--mut)">–</span>') +
    '</div>';
}
function sumItem(label, html) {
  return '<div class="sum-item"><div class="sum-label">' + esc(label) + '</div><div class="sum-value">' + html + '</div></div>';
}

/* ══════════════════════════════════
   セクション2: 投資テーゼ（デフォルト閉）
══════════════════════════════════ */
function buildThesis() {
  var th = S.thesis;
  var out = '<div class="sec-hd">投資テーゼ</div><div class="thesis-wrap">';
  if (!th) return out + '<div class="no-data">テーゼデータなし</div></div>';

  var isCore = th.type === 'core';
  var ep     = th.entry_price != null ? '$' + Number(th.entry_price).toFixed(2) : '–';

  out += '<details>'; /* デフォルト閉 */
  out += '<summary>' + esc(ticker) + ' — ' + (isCore ? 'CORE THESIS' : 'SAT STRATEGY') +
    '（クリックで展開）</summary>';
  out += '<div class="thesis-inner">';

  if (isCore) {
    out += '<div class="thesis-text">' + esc(th.thesis || '–') + '</div>';
    if (th.exit_guide)
      out += '<div class="sub-label">EXIT GUIDE</div><div class="sub-block">' + esc(th.exit_guide) + '</div>';
    if (th.entry_story)
      out += '<div class="sub-label">ENTRY STORY</div><div class="sub-block">' + esc(th.entry_story) + '</div>';
  } else {
    out += '<div class="thesis-text">' + esc(th.strategy_name || th.thesis || '–') + '</div>';
    if (th.exit_condition)
      out += '<div class="sub-label">EXIT CONDITION</div><div class="sub-block">' + esc(th.exit_condition) + '</div>';
    if (th.entry_condition)
      out += '<div class="sub-label">ENTRY CONDITION</div><div class="sub-block">' + esc(th.entry_condition) + '</div>';
  }

  out += '<div class="meta-row">' +
    '<span>登録日: ' + esc(th.entry_date || '–') + '</span>' +
    '<span>取得単価: ' + ep + '</span>' +
    '<span>ステータス: ' + esc(th.status || '–') + '</span>' +
    '</div>';

  return out + '</div></details></div>';
}

/* ══════════════════════════════════
   セクション3-右: KPIトレンド
══════════════════════════════════ */
function buildKpi() {
  var out = '<div class="col-card"><div class="sec-hd" style="margin-top:0">KPIトレンド</div>';
  if (!S.kpi) return out + '<div class="no-data">KPIデータなし</div></div>';

  var kpis  = S.kpi.kpis || {};
  var names = Object.keys(kpis).filter(function (k) {
    return (kpis[k].data || []).some(function (d) { return d.value != null; });
  });
  if (!names.length) return out + '<div class="no-data">KPIデータなし</div></div>';

  names.forEach(function (name) {
    var ki   = kpis[name];
    var data = (ki.data || [])
      .filter(function (d) { return d.value != null; })
      .sort(function (a, b) { return quarterToNum(a.quarter) - quarterToNum(b.quarter); });
    if (!data.length) return;
    out += '<div class="kpi-block"><div class="kpi-name">' + esc(name) + '</div>' +
      buildSparkline(data, ki.unit, 160) + '</div>';
  });

  return out + '</div>';
}

/* ══════════════════════════════════
   セクション3-左: 最新レビュー
══════════════════════════════════ */
function buildReview() {
  var qs  = Object.keys(S.reviews).sort().reverse();
  var out = '<div class="col-card"><div class="sec-hd" style="margin-top:0">最新レビュー</div>';
  if (!qs.length) return out + '<div class="no-data">レビューデータなし</div></div>';

  var q     = qs[0];
  var rv    = S.reviews[q];
  var s1    = rv.stage1 || {};
  var score = s1.health_score || 0;
  var rec   = s1.recommendation || '';
  var gc    = scoreColor(score);

  out += '<div class="muted-meta">' + esc(q) +
    (rv.generated_at ? ' — ' + esc(rv.generated_at.slice(0, 10)) : '') + '</div>';

  out += '<div class="gauge-row">' +
    '<span class="gauge-num" style="color:' + gc + '">' + score + '</span>' +
    '<div class="gauge-bar"><div class="gauge-fill" style="width:' + score + '%;background:' + gc + '"></div></div>' +
    (rec ? '<span class="rec-badge rec-' + rec.toLowerCase() + '">' + esc(rec) + '</span>' : '') +
    '</div>';

  if (s1.summary)
    out += '<div class="rv-summary">' + esc(s1.summary) + '</div>';

  if (s1.optimism_bias_warning)
    out += '<div class="bias-box"><span class="bias-lbl">⚠ 楽観バイアス警告</span>' + esc(s1.optimism_bias_warning) + '</div>';

  var posH = (s1.positives || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
  var conH = (s1.concerns  || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
  if (posH || conH) {
    out += '<div class="inner-two">' +
      '<div class="list-box"><div class="list-title pos">ポジティブ</div><ul class="blist pos">' + posH + '</ul></div>' +
      '<div class="list-box"><div class="list-title neg">懸念点</div><ul class="blist neg">' + conH + '</ul></div>' +
      '</div>';
  }

  var ed    = s1.exit_distance || '';
  var edCls = ed.indexOf('遠') !== -1 ? 'ed-far' : ed.indexOf('近い') !== -1 ? 'ed-close' : 'ed-watch';
  if (ed)
    out += '<div class="exit-row"><span class="exit-dist ' + edCls + '">' + esc(ed) + '</span>' +
      '<span style="font-size:12px;color:var(--sub)">' + esc(s1.exit_distance_reason || '') + '</span></div>';

  var nkH = (s1.next_kpis || []).map(function (k) { return '<span class="nkpi-tag">' + esc(k) + '</span>'; }).join('');
  if (nkH)
    out += '<div class="sec-sub" style="margin-top:8px">次四半期 確認KPI</div><div class="nkpi-wrap">' + nkH + '</div>';

  /* スコア推移ミニグラフ */
  var scoreData = Object.keys(S.reviews)
    .sort(function (a, b) { return quarterToNum(a) - quarterToNum(b); })
    .map(function (sq) {
      var sc2 = (S.reviews[sq].stage1 || {}).health_score;
      return { quarter: sq, value: sc2 };
    }).filter(function (d) { return d.value != null; });

  if (scoreData.length >= 2) {
    out += '<div class="sec-sub" style="margin-top:12px">スコア推移</div>' +
      buildScoreSparkline(scoreData, 100);
  }

  return out + '</div>';
}

/* ══════════════════════════════════
   セクション4-右: DCFシナリオ（将来株価）
══════════════════════════════════ */
function buildDcf() {
  var out = '<div class="col-card"><div class="sec-hd" style="margin-top:0">DCFシナリオ</div>';

  /* シナリオファイルあり → 将来株価テーブル */
  if (S.scenarios.bear || S.scenarios.base || S.scenarios.bull) {
    return out + _buildFuturePriceTable(S.scenarios) + '</div>';
  }

  /* フォールバック: stage2.scenarios の成長率テーブル */
  var qs = Object.keys(S.reviews).sort().reverse();
  if (qs.length) {
    var s2 = S.reviews[qs[0]].stage2 || {};
    var sc = s2.scenarios || {};
    if (sc.bear || sc.base || sc.bull) {
      return out + _buildLegacyDcfTable(sc, s2) + '</div>';
    }
  }

  return out + '<div class="no-data">DCFデータなし</div></div>';
}

function _buildFuturePriceTable(scd) {
  var anyScen  = scd.base || scd.bear || scd.bull || {};
  var curPrice = anyScen.current_price;
  var periods  = ['現在', '1年後', '3年後', '5年後'];

  function fv(v) { return (v != null && v !== 0) ? '$' + Number(v).toFixed(0) : '—'; }
  function getVal(sd, period) {
    if (!sd) return null;
    if (period === '現在') return sd.base_intrinsic_value || null;
    return (sd.future_values || {})[period] || null;
  }
  function cellStyle(val) {
    if (val == null || !curPrice) return '';
    return val >= curPrice ? 'color:var(--grn);font-weight:600' : '';
  }

  var thead = '<tr><th></th>' + periods.map(function (p) {
    return '<th style="text-align:center">' + p + '</th>';
  }).join('') + '</tr>';

  var scRows = [
    { key: 'bear', label: '🐻 BEAR', cls: 'dcf-bear' },
    { key: 'base', label: '📊 BASE', cls: 'dcf-base' },
    { key: 'bull', label: '🐂 BULL', cls: 'dcf-bull' },
  ];
  var tbody = scRows.map(function (row) {
    var sd = scd[row.key];
    return '<tr class="' + row.cls + '">' +
      '<td>' + row.label + '</td>' +
      periods.map(function (p) {
        var v = getVal(sd, p);
        return '<td style="text-align:center;' + cellStyle(v) + '">' + fv(v) + '</td>';
      }).join('') + '</tr>';
  }).join('');

  var cpRow = curPrice
    ? '<tr style="border-top:2px solid var(--acc)">' +
      '<td style="color:var(--acc);font-family:var(--mono);font-size:11px">現在株価</td>' +
      '<td style="text-align:center;color:var(--acc)">' + fv(curPrice) + '</td>' +
      '<td colspan="3" style="text-align:center;color:var(--mut);font-size:10px;font-family:var(--mono)">← 緑字 = 現在株価超え</td></tr>'
    : '';

  return (curPrice ? '<div class="muted-meta">現在株価: $' + Number(curPrice).toFixed(2) + ' / 将来理論価格</div>' : '') +
    '<div class="tbl-wrap"><table class="dcf-tbl"><thead>' + thead + '</thead><tbody>' + tbody + cpRow + '</tbody></table></div>';
}

function _buildLegacyDcfTable(sc, s2) {
  var rows = [
    { key: 'bear', label: '🐻 BEAR', cls: 'dcf-bear' },
    { key: 'base', label: '📊 BASE', cls: 'dcf-base' },
    { key: 'bull', label: '🐂 BULL', cls: 'dcf-bull' },
  ];
  var cols = ['Y1成長率', 'Y2成長率', 'Y3成長率', 'Terminal利益率'];
  var thead = '<tr><th></th>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
  var tbody = rows.map(function (row) {
    var s = sc[row.key] || {};
    return '<tr class="' + row.cls + '"><td>' + row.label + '</td>' +
      '<td>' + pct(s.revenue_growth_y1) + '</td>' +
      '<td>' + pct(s.revenue_growth_y2) + '</td>' +
      '<td>' + pct(s.revenue_growth_y3) + '</td>' +
      '<td>' + pct(s.operating_margin_terminal) + '</td></tr>';
  }).join('');
  var out = '<div class="tbl-wrap"><table class="dcf-tbl"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
  var assH  = (s2.key_assumptions || []).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('');
  var riskH = (s2.risk_factors    || []).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');
  if (assH || riskH) {
    out += '<div class="assm-grid">';
    if (assH)  out += '<div class="list-box"><div class="list-title">KEY ASSUMPTIONS</div><ul class="blist">' + assH + '</ul></div>';
    if (riskH) out += '<div class="list-box"><div class="list-title neg">RISK FACTORS</div><ul class="blist neg">' + riskH + '</ul></div>';
    out += '</div>';
  }
  return out;
}
function pct(v) { return v != null ? (v * 100).toFixed(1) + '%' : '–'; }

/* ══════════════════════════════════
   セクション4-左: AI視点
   表示優先順位（TAIL-UX-1 Phase2）:
   1. 業績見通し（KPI予想）— 最重視
   2. テーゼへの問いかけ・次回確認論点
   3. 歴史的類比・エントリーストーリー進捗・世の中の注目・マクロ環境の示唆
   4. 5観点（折りたたみ・デフォルト閉）
══════════════════════════════════ */
function buildAi() {
  var qs  = Object.keys(S.reviews).sort().reverse();
  var out = '<div class="col-card"><div class="sec-hd" style="margin-top:0">AI視点</div>';
  if (!qs.length) return out + '<div class="no-data">レビューデータなし</div></div>';
  var rv = S.reviews[qs[0]];
  var c2 = rv.call2;
  if (!c2) return out + '<div class="no-data">AI定性分析データなし</div></div>';

  /* 1. 業績見通し（KPI予想）*/
  out += buildAiKpiForecast(rv);

  /* 2. テーゼへの問いかけ・次回確認論点 */
  var tqs = c2.thesis_questions || [];
  if (tqs.length) {
    out += '<div class="sec-sub" style="margin-top:14px">テーゼへの問いかけ</div>' +
      '<ul class="tq-list">' + tqs.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul>';
  }
  var nrf = c2.next_review_focus || [];
  if (nrf.length) {
    out += '<div class="sec-sub" style="margin-top:10px">次回確認論点</div><div class="focus-wrap">' +
      nrf.map(function (f, i) { return '<span class="focus-tag">' + (i + 1) + '. ' + esc(f) + '</span>'; }).join('') +
      '</div>';
  }

  /* 3. 歴史的類比・エントリーストーリー進捗・世の中の注目・マクロ環境の示唆 */
  var ha = c2.historical_analogy || {};
  if (ha.company) {
    out += '<div class="analogy-box" style="margin-top:14px">' +
      '<div class="analogy-co">歴史的類比: ' + esc(ha.company) + '</div>' +
      '<div class="analogy-row"><strong>類似点:</strong> ' + esc(ha.similarity || '—') + '</div>' +
      '<div class="analogy-row"><strong>その後:</strong> ' + esc(ha.outcome || '—') + '</div>' +
      '<div class="analogy-row"><strong>示唆:</strong> ' + esc(ha.implication || '—') + '</div>' +
      '</div>';
  }
  if (c2.entry_story_progress) out += aiSubBlock('エントリーストーリー進捗', c2.entry_story_progress);
  if (c2.market_attention)     out += aiSubBlock('世の中の注目ポイント', c2.market_attention);
  if (c2.macro_implications)   out += aiSubBlock('マクロ環境の示唆', c2.macro_implications);

  /* 4. 5観点（折りたたみ・デフォルト閉） */
  var fp    = c2.five_perspectives || {};
  var fpDef = [
    { key: 'business_model',        label: 'ビジネスモデル' },
    { key: 'growth',                label: '成長性' },
    { key: 'competitive_advantage', label: '競争優位' },
    { key: 'management',            label: '経営' },
    { key: 'market',                label: '市場環境' },
  ];
  var fpHtml = fpDef.map(function (d) {
    var txt = fp[d.key]; if (!txt) return '';
    return '<div class="persp-block"><div class="persp-label">' + esc(d.label) + '</div>' +
      '<div class="persp-text">' + esc(txt) + '</div></div>';
  }).join('');
  if (fpHtml) {
    out += '<details style="margin-top:14px"><summary>5観点での気になる点を表示</summary>' +
      '<div style="margin-top:8px">' + fpHtml + '</div></details>';
  }

  return out + '</div>';
}

function aiSubBlock(label, text) {
  return '<div class="sub-label" style="margin:14px 0 6px">' + esc(label) + '</div>' +
    '<div class="sub-block">' + esc(text) + '</div>';
}

/* AI視点1段目: 業績見通し（KPI予想）テーブル
   優先: S.scenarios（../scenario/{ticker}/{bear,base,bull}.json、kpi_current/kpi_format付き）
   フォールバック: レビューJSON stage2.scenarios（生値のみ、書式は既定ヒューリスティック） */
function buildAiKpiForecast(rv) {
  var head = '<div class="sec-sub" style="margin-top:0">業績見通し（KPI予想）</div>';
  var scd  = S.scenarios || {};
  var hasScenarioFile = !!(scd.bear || scd.base || scd.bull);

  var kfcSource, kpiCurrent, kpiL1Keys, kpiFmt;
  if (hasScenarioFile) {
    kfcSource  = scd;
    kpiCurrent = (scd.base || {}).kpi_current    || {};
    kpiL1Keys  = (scd.base || {}).kpi_layer1_keys || [];
    kpiFmt     = (scd.base || {}).kpi_format      || {};
  } else {
    var sc = ((rv.stage2 || {}).scenarios) || {};
    kfcSource  = sc;
    kpiCurrent = {};
    kpiL1Keys  = [];
    kpiFmt     = {};
  }

  var baseKfc = (kfcSource.base || kfcSource.bear || kfcSource.bull || {}).kpi_forecasts || {};
  var allKeys = Object.keys(kpiCurrent).length
    ? Object.keys(kpiCurrent)
    : Object.keys(baseKfc['1年後'] || baseKfc['3年後'] || {});

  if (!allKeys.length || !(baseKfc['1年後'] || baseKfc['3年後'])) {
    return head + '<div class="no-data" style="padding:10px">KPI予想データなし</div>';
  }

  function fmtKv(v, fmt) {
    if (v == null) return '—';
    var n = Number(v);
    if (isNaN(n)) return String(v);
    fmt = fmt || (Math.abs(n) >= 1e6 ? 'usd' : Math.abs(n) <= 2 ? 'pct' : 'usd_small');
    if (fmt === 'usd') {
      if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
      if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(0) + 'M';
      return '$' + n.toFixed(0);
    }
    if (fmt === 'pct')       return (n * 100).toFixed(1) + '%';
    if (fmt === 'usd_small') return '$' + n.toFixed(2);
    return n.toFixed(2);
  }

  var l2Keys = allKeys.filter(function (k) { return kpiL1Keys.indexOf(k) === -1; });
  var l1Keys = allKeys.filter(function (k) { return kpiL1Keys.indexOf(k) !== -1; });

  var thead = '<tr><th>KPI</th><th>現在</th>' +
    ['bear', 'base', 'bull'].map(function (s) {
      return '<th class="dcf-' + s + '">' + s.toUpperCase() + '<br><span style="font-size:9px">1年後</span></th>' +
             '<th class="dcf-' + s + '">' + s.toUpperCase() + '<br><span style="font-size:9px">3年後</span></th>';
    }).join('') + '</tr>';

  function buildRow(kpiName, isL1) {
    var fmt      = kpiFmt[kpiName];
    var curVal   = kpiCurrent[kpiName];
    var nameHtml = isL1
      ? '<span style="color:var(--mut)">' + esc(kpiName) + '</span> <span style="font-size:9px;color:var(--mut)">(財務推計)</span>'
      : esc(kpiName);
    return '<tr><td>' + nameHtml + '</td>' +
      '<td style="text-align:center;color:var(--sub)">' + fmtKv(curVal, fmt) + '</td>' +
      ['bear', 'base', 'bull'].map(function (s) {
        var fc1 = ((kfcSource[s] || {}).kpi_forecasts || {})['1年後'] || {};
        var fc3 = ((kfcSource[s] || {}).kpi_forecasts || {})['3年後'] || {};
        return '<td class="dcf-' + s + '">' + fmtKv(fc1[kpiName], fmt) + '</td>' +
               '<td class="dcf-' + s + '">' + fmtKv(fc3[kpiName], fmt) + '</td>';
      }).join('') + '</tr>';
  }

  var body = l2Keys.map(function (k) { return buildRow(k, false); }).join('');
  if (l1Keys.length) {
    body += '<tr><td colspan="8" style="padding:2px 0"></td></tr>' +
      l1Keys.map(function (k) { return buildRow(k, true); }).join('');
  }

  return head + '<div class="tbl-wrap"><table class="dcf-tbl"><thead>' + thead + '</thead><tbody>' + body + '</tbody></table></div>';
}

/* ══════════════════════════════════
   セクション5: 内部統制
══════════════════════════════════ */
function buildCtrl() {
  var items  = window._CTRL_ITEMS || [];
  var out    = '<div class="sec-hd">内部統制 · SEC提出書類</div>';
  var hasAny = false;

  items.forEach(function (item) {
    var d = S.ctrlItems[item.key];
    if (!d) return;
    hasAny = true;

    out += '<div style="margin-bottom:24px">';
    out += '<div class="sec-sub" style="margin-bottom:8px">' + esc(item.label) + '</div>';

    /* 有効性バッジ（Item 4 のみ） */
    if (item.badge) {
      var effLabel, effCls;
      if (d.effective === true)       { effLabel = '有効 (Effective)';     effCls = 'ctrl-ok'; }
      else if (d.effective === false) { effLabel = '無効 (Not Effective)'; effCls = 'ctrl-ng'; }
      else                             { effLabel = '判定不能';              effCls = 'ctrl-unk'; }
      out += '<span class="ctrl-badge ' + effCls + '">' + esc(effLabel) + '</span>';

      var mw = d.material_weaknesses || [];
      if (mw.length) {
        out += '<div style="margin:8px 0"><div class="sec-sub" style="color:var(--red)">マテリアルウィークネス (' + mw.length + '件)</div>' +
          '<ul class="blist">' + mw.map(function (s) { return '<li style="color:var(--red)">' + esc(s) + '</li>'; }).join('') + '</ul></div>';
      }
    }

    /* 四半期 / 提出日 */
    if (d.quarter || d.filing_date) {
      out += '<div class="muted-meta">' +
        esc(d.quarter || '') + (d.filing_date ? ' / 提出日: ' + esc(d.filing_date) : '') + '</div>';
    }

    /* 日本語訳（優先）→ 英文原文 */
    var jaKey = item.key + '_excerpt_ja';
    var enKey = item.key + '_excerpt';
    var jaText = d[jaKey] || d.excerpt_ja || null;
    var enText = d[enKey] || d.excerpt    || null;

    if (jaText) {
      out += '<div class="ctrl-excerpt">' + esc(jaText) + '</div>';
      if (enText) {
        out += '<details style="margin-top:8px"><summary>英文原文を表示</summary>' +
          '<div class="ctrl-excerpt ctrl-en" style="margin-top:6px">' + esc(enText) + '</div></details>';
      }
    } else if (enText) {
      out += '<div class="ctrl-excerpt ctrl-en">' + esc(enText) + '</div>';
    }

    out += '</div>';
  });

  if (!hasAny) out += '<div class="no-data">データなし（未取得 or CIK未登録）</div>';
  return out;
}

/* ══════════════════════════════════
   セクション6: 過去レビュー履歴
══════════════════════════════════ */
function buildHistory() {
  var qs  = Object.keys(S.reviews).sort().reverse(); /* 降順: 新→旧 */
  var out = '<div class="sec-hd">過去レビュー履歴</div>';
  if (qs.length <= 1) return out + '<div class="no-data">過去レビューなし</div>';

  out += '<div>';
  qs.slice(1).forEach(function (q, sliceIdx) {
    var s1    = (S.reviews[q].stage1 || {});
    var score = s1.health_score;
    var rec   = s1.recommendation || '';
    var gc    = score != null ? scoreColor(score) : 'var(--mut)';
    var summ  = (s1.summary || '').slice(0, 130);
    if (s1.summary && s1.summary.length > 130) summ += '…';

    /* 前期比デルタ: 現在行 vs 1期前 */
    var deltaHtml = '';
    var olderQ    = qs[sliceIdx + 2];
    if (olderQ !== undefined && score != null) {
      var olderSc = ((S.reviews[olderQ].stage1 || {}).health_score);
      if (olderSc != null) {
        var delta = score - olderSc;
        var dCls  = delta > 0 ? 'delta-up' : delta < 0 ? 'delta-dn' : 'delta-zero';
        deltaHtml = '<span class="hist-delta ' + dCls + '">' + (delta > 0 ? '+' : '') + delta + '</span>';
      }
    }

    out += '<div class="hist-row">' +
      '<span class="hist-q">' + esc(q) + '</span>' +
      '<span class="hist-sc" style="color:' + gc + '">' + (score != null ? score : '–') + deltaHtml + '</span>' +
      (rec ? '<span class="rec-badge rec-' + rec.toLowerCase() + '">' + esc(rec) + '</span>' : '') +
      '<span class="hist-sum">' + esc(summ) + '</span>' +
      '</div>';
  });

  return out + '</div>';
}

/* ─── スパークライン（KPI用） ─── */
function buildSparkline(data, unit, height) {
  var H  = height || 160;
  var W  = 560, PL = 50, PR = 14, PT = 10, PB = 24;
  var cW = W - PL - PR, cH = H - PT - PB;
  var n  = data.length;
  if (!n) return '';

  var vals = data.map(function (d) { return d.value; });
  var minV = Math.min.apply(null, vals);
  var maxV = Math.max.apply(null, vals);
  var rng  = maxV === minV ? (Math.abs(maxV) * 0.1 || 1) : maxV - minV;

  function xAt(i) { return PL + (n > 1 ? (i / (n - 1)) * cW : cW / 2); }
  function yAt(v) { return PT + cH - ((v - minV) / rng) * cH; }

  var pts  = data.map(function (d, i) { return xAt(i).toFixed(1) + ',' + yAt(d.value).toFixed(1); });
  var dots = data.map(function (d, i) {
    return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(d.value).toFixed(1) +
      '" r="' + (i === n - 1 ? 3.5 : 2) + '" fill="var(--acc)" stroke="var(--bg)" stroke-width="1.5">' +
      '<title>' + d.quarter + ': ' + formatVal(d.value, unit) + '</title></circle>';
  }).join('');

  var showIs = {}; showIs[0] = true; showIs[n - 1] = true;
  var step = Math.max(1, Math.ceil(n / 4));
  for (var j = 0; j < n; j += step) showIs[j] = true;
  var xLbls = data.map(function (d, i) {
    return showIs[i]
      ? '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="8" fill="var(--mut)">' + d.quarter + '</text>'
      : '';
  }).join('');

  var yLbls =
    '<text x="' + (PL - 3) + '" y="' + (PT + 4)  + '" text-anchor="end" font-size="9" fill="var(--mut)">' + formatVal(maxV, unit) + '</text>' +
    '<text x="' + (PL - 3) + '" y="' + (PT + cH) + '" text-anchor="end" font-size="9" fill="var(--mut)">' + formatVal(minV, unit) + '</text>';

  var lx  = xAt(n - 1), ly = yAt(data[n - 1].value);
  var anc = lx > W * 0.72 ? 'end' : 'start';
  var lxO = anc === 'end' ? -6 : 6;
  var lyA = ly < PT + 14 ? ly + 12 : ly - 4;
  var lastLbl = '<text x="' + (lx + lxO).toFixed(1) + '" y="' + lyA.toFixed(1) + '" text-anchor="' + anc +
    '" font-size="10" fill="var(--acc)" font-weight="bold">' + formatVal(data[n - 1].value, unit) + '</text>';

  var midY = (PT + cH / 2).toFixed(1);
  var grid = '<line x1="' + PL + '" y1="' + midY + '" x2="' + (W - PR) + '" y2="' + midY + '" stroke="var(--bdr)" stroke-dasharray="3,3"/>';

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block">' +
    grid + yLbls +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-linejoin="round"/>' +
    dots + lastLbl + xLbls + '</svg>';
}

/* ─── スコア推移ミニグラフ ─── */
function buildScoreSparkline(data, height) {
  var H  = height || 100;
  var W  = 560, PL = 30, PR = 10, PT = 8, PB = 20;
  var cW = W - PL - PR, cH = H - PT - PB;
  var n  = data.length;
  if (!n) return '';

  var scores = data.map(function (d) { return d.value; });
  var minV = Math.max(0,   Math.min.apply(null, scores) - 5);
  var maxV = Math.min(100, Math.max.apply(null, scores) + 5);
  var rng  = maxV - minV || 1;

  function xAt(i) { return PL + (n > 1 ? (i / (n - 1)) * cW : cW / 2); }
  function yAt(v) { return PT + cH - ((v - minV) / rng) * cH; }

  var pts  = data.map(function (d, i) { return xAt(i).toFixed(1) + ',' + yAt(d.value).toFixed(1); });
  var dots = data.map(function (d, i) {
    return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(d.value).toFixed(1) +
      '" r="' + (i === n - 1 ? 3.5 : 2) + '" fill="' + scoreColor(d.value) + '" stroke="var(--bg)" stroke-width="1.5">' +
      '<title>' + d.quarter + ': ' + d.value + '</title></circle>';
  }).join('');

  var showIs = {}; showIs[0] = true; showIs[n - 1] = true;
  var xLbls = data.map(function (d, i) {
    return showIs[i]
      ? '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="8" fill="var(--mut)">' + d.quarter + '</text>'
      : '';
  }).join('');

  var yLbls =
    '<text x="' + (PL - 3) + '" y="' + (PT + 4)  + '" text-anchor="end" font-size="9" fill="var(--mut)">' + maxV + '</text>' +
    '<text x="' + (PL - 3) + '" y="' + (PT + cH) + '" text-anchor="end" font-size="9" fill="var(--mut)">' + minV + '</text>';

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block">' +
    yLbls +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--sub)" stroke-width="1.5" stroke-linejoin="round"/>' +
    dots + xLbls + '</svg>';
}

/* ─── ユーティリティ ─── */
function quarterToNum(q) {
  var m = q.match(/(\d{4})Q(\d)/);
  return m ? parseInt(m[1]) * 10 + parseInt(m[2]) : 0;
}
function formatVal(v, unit) {
  if (v === null || v === undefined) return '–';
  /* [[KPI-UNIT-HARDCODE-USD-1]]: ratio KPI（貢献利益率等、0〜1の小数
     比率で保存）をパーセント表示にする */
  if (unit === 'ratio' || unit === '%') return (v * 100).toFixed(1) + '%';
  if (Math.abs(v) >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'B';
  if (Math.abs(v) >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  return v.toLocaleString();
}
function scoreColor(s) {
  return s >= 71 ? 'var(--grn)' : s >= 41 ? 'var(--amb)' : 'var(--red)';
}
function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
