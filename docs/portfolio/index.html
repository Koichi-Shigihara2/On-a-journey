<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO — On a Journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:#0a0d14; --sur:#111520; --sur2:#161c2d; --bdr:#1e2840;
      --acc:#3b82f6; --grn:#10b981; --red:#f43f5e; --amb:#f59e0b; --orn:#f97316;
      --txt:#e2e8f0; --mut:#64748b;
      --mono:'Space Mono',monospace; --sans:'DM Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;min-height:100vh}
    .shell{max-width:1200px;margin:0 auto;padding:0 20px 60px}

    /* Auth */
    #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
    .auth-box{text-align:center;padding:48px 40px;background:var(--sur);border:1px solid var(--bdr);border-radius:12px;width:340px}
    .auth-title{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--orn);letter-spacing:.1em;margin-bottom:8px}
    .auth-sub{font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:28px}
    .auth-row{display:flex;gap:8px;justify-content:center}
    .auth-input{font-family:var(--mono);font-size:13px;padding:10px 14px;background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);width:190px;border-radius:4px;outline:none}
    .auth-input:focus{border-color:var(--acc)}
    .auth-btn{padding:10px 18px;background:var(--orn);color:#fff;border:none;cursor:pointer;font-family:var(--mono);font-size:13px;border-radius:4px;transition:opacity .2s}
    .auth-btn:hover{opacity:.85}
    #pw-error{color:var(--red);font-size:11px;font-family:var(--mono);margin-top:12px;min-height:16px}

    /* Header */
    header{border-bottom:1px solid var(--bdr);padding:16px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:0;flex-wrap:wrap;gap:10px}
    .logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;display:flex;align-items:center;gap:10px;color:var(--txt);text-decoration:none}
    .logo-dot{width:8px;height:8px;background:var(--orn);border-radius:50%;animation:pdot 2s ease-in-out infinite}
    @keyframes pdot{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.4)}50%{box-shadow:0 0 0 6px rgba(249,115,22,0)}}
    nav.nav-links{display:flex;flex-wrap:wrap;gap:12px}
    nav.nav-links a{font-family:var(--mono);font-size:11px;color:var(--mut);text-decoration:none;padding:4px 0;border-bottom:1px solid transparent;transition:all .2s}
    nav.nav-links a:hover{color:var(--acc);border-bottom-color:var(--acc)}

    .last-updated{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;padding:4px 16px;letter-spacing:.05em;border-bottom:1px solid var(--bdr)}
    .last-updated::before{content:"最終更新: "}

    /* Summary cards */
    .summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
    .s-card{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:16px 18px}
    .s-card-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
    .s-card-value{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.04em}
    .s-card-sub{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:4px}
    .pos{color:var(--grn)} .neg{color:var(--red)} .neu{color:var(--mut)}

    /* Broker summary */
    /* PORT-LAYOUT-2: flex+flex:1だと最終行に1枚だけ残った場合に横長化するため
       grid+auto-fillに変更し、行をまたいでも全カード幅を揃える */
    .broker-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
    .broker-card{background:var(--sur);border:1px solid var(--bdr);border-radius:6px;padding:12px 16px}
    .broker-name{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .broker-val{font-family:var(--mono);font-size:15px;font-weight:700}

    /* Section title */
    .sec{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--orn);letter-spacing:.15em;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
    .sec::after{content:'';flex:1;height:1px;background:var(--bdr)}

    /* Portfolio table */
    .tbl-wrap{overflow-x:auto;background:var(--sur);border:1px solid var(--bdr)}
    table{width:100%;border-collapse:collapse;min-width:1100px}
    /* EPIC-LAYOUT-1: data-priority="low"の列を960px以下で間引いた後はmin-widthを解除し、
       残った列だけで自然に収まるようにする（このページの.tbl-wrap内tableに限定したスコープ） */
    @media (max-width: 1000px) {
      .tbl-wrap table { min-width: 0; }
    }
    th{font-family:var(--mono);font-size:10px;color:var(--mut);text-align:left;padding:10px 12px;background:var(--sur2);border-bottom:1px solid var(--bdr);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
    td{padding:9px 12px;border-bottom:1px solid rgba(30,40,64,.5);font-size:13px;white-space:nowrap;vertical-align:middle}
    tr:hover td{background:rgba(255,255,255,.015)}
    tr.total-row td{background:var(--sur2);font-weight:600;border-top:2px solid var(--bdr)}
    tr.broker-row td{background:rgba(22,28,45,.6);color:var(--mut);font-size:12px}
    tr.cash-row td{background:var(--sur2);color:var(--mut)}
    .mono{font-family:var(--mono);font-size:12px}
    .tkr-a{color:var(--acc);font-family:var(--mono);font-weight:700;font-size:13px;text-decoration:none}
    .tkr-a:hover{text-decoration:underline}

    /* Score badges */
    .cat-badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:3px;white-space:nowrap}
    .badge-BUY  {background:rgba(34,197,94,.12);  color:#22c55e}
    .badge-WATCH{background:rgba(234,179,8,.12);  color:#eab308}
    .badge-HOLD {background:rgba(59,130,246,.12); color:#3b82f6}
    .badge-TRIM {background:rgba(249,115,22,.12); color:#f97316}
    .badge-SELL {background:rgba(239,68,68,.10);  color:#ef4444}
    .badge-PASS {background:rgba(71,85,105,.10);  color:#475569}
    .badge-UNDETERMINED {background:rgba(148,163,184,.12); color:#94a3b8}
    .badge-warn {background:rgba(245,158,11,.1);  color:var(--amb);font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:3px;white-space:nowrap}

    /* Phase distribution */
    .dist-bar{display:flex;flex-wrap:wrap;gap:16px;background:var(--sur);border:1px solid var(--bdr);padding:16px 20px;border-radius:8px;margin-bottom:24px}
    .dist-item{font-family:var(--mono);font-size:12px;color:var(--txt)}
    .dist-label{color:var(--mut);font-size:11px;margin-right:4px}

    /* Loading */
    .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading{color:var(--mut);font-family:var(--mono);font-size:12px;padding:40px;text-align:center}

    /* History chart */
    .chart-wrap{background:var(--sur);border:1px solid var(--bdr);padding:4px;margin-bottom:24px}
    .chart-ctrl{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bdr)}
    .chart-btn{font-family:var(--mono);font-size:11px;padding:5px 14px;border:1px solid var(--bdr);background:var(--sur2);color:var(--mut);cursor:pointer;border-radius:3px;transition:all .2s}
    .chart-btn.active{background:var(--orn);color:#fff;border-color:var(--orn)}
    .chart-empty{color:var(--mut);font-family:var(--mono);font-size:12px;padding:48px;text-align:center}

    /* HYPEMIX */
    .hypemix-wrap{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:20px 24px;margin-bottom:24px}
    .hypemix-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .hypemix-badge{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:3px;font-weight:700;letter-spacing:.05em}
    .hbadge-good{background:rgba(16,185,129,.15);color:#10b981}
    .hbadge-caution{background:rgba(245,158,11,.15);color:#f59e0b}
    .hbadge-danger{background:rgba(244,63,94,.15);color:#f43f5e}
    .hypemix-charts{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px}
    .hypemix-chart-card{text-align:center}
    .hypemix-chart-title{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
    .hypemix-dev{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .hypemix-dev-row{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:8px}
    .hypemix-proposal{font-family:var(--mono);font-size:12px;line-height:1.9;background:var(--sur2);border:1px solid var(--bdr);border-radius:4px;padding:12px 16px;word-break:break-word}
    .hypemix-cand-hdr{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px}
    .hypemix-cand-list{display:flex;flex-direction:column;gap:6px}
    .hypemix-cand-chip{display:flex;align-items:center;gap:10px;background:var(--sur2);border:1px solid var(--bdr);border-radius:4px;padding:8px 12px;text-decoration:none;transition:border-color .15s}
    .hypemix-cand-chip:hover{border-color:#22c55e}
    .hcc-meta{font-family:var(--mono);font-size:11px;color:var(--mut)}
    .hypemix-cand-empty{font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--sur2);border:1px solid var(--bdr);border-radius:4px;padding:12px 16px}

    @media(max-width:700px){
      .summary-cards{grid-template-columns:repeat(2,1fr)}
      .hypemix-charts{grid-template-columns:1fr}
    }
  </style>
  <link rel="stylesheet" href="../common/site-theme.css">
</head>
<body data-tool="portfolio">

<!-- ── Auth screen ── -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">💼 PORTFOLIO</div>
    <div class="auth-sub">このページはパスワードで保護されています</div>
    <div class="auth-row">
      <input type="password" id="pw-input" class="auth-input" placeholder="Password" autocomplete="current-password">
      <button class="auth-btn" onclick="checkPassword()">Enter</button>
    </div>
    <div id="pw-error"></div>
  </div>
</div>

<!-- ── Main content ── -->
<div id="main-content" style="display:none">
<div class="shell">
  <header>
    <a href="../" class="logo">
      <img src="../common/images/logo.png" alt="logo" style="height:28px;width:auto;object-fit:contain" onerror="this.style.display='none'">
      <span class="logo-dot"></span>
      PORTFOLIO
    </a>
    <nav class="nav-links">
      <a href="../">HOME</a>
      <a href="../value-monitor/tanuki_score/">TANUKI SCORE</a>
      <a href="../value-monitor/tanuki_valuation/">TANUKI</a>
      <a href="../value-monitor/hypecore/">HYPE CORE</a>
    </nav>
  </header>
  <div class="last-updated" id="last-updated"></div>

  <div id="summary-section"><div class="loading"><span class="spinner"></span>データ読み込み中...</div></div>
  <div id="broker-summary-section"></div>
  <div id="table-section"></div>
  <div id="hypemix-section"></div>
  <div id="dist-section"></div>
  <div id="chart-section"></div>
</div>
</div><!-- /main-content -->

<script>
// ── Auth ──
const PW_HASH = "1ccaba2b5d2e782f70745dc02ee88f537d51f6938bd6c22982a3d4d685be483a";
const SESSION_KEY = "portfolio_auth";

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const pw = document.getElementById('pw-input').value;
  const hash = await sha256(pw);
  if (hash === PW_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    loadData();
  } else {
    document.getElementById('pw-error').textContent = 'パスワードが違います';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pw-input');
  if (pwInput) {
    pwInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') checkPassword();
    });
  }
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    loadData();
  }
});

// ── Config ──
const BASE      = '/On-a-journey';
const PF_PATH   = BASE + '/portfolio/data/portfolio.json';
const T_BASE    = BASE + '/value-monitor/tanuki_valuation/data/';
const H_BASE    = BASE + '/value-monitor/hypecore/data/';
const DISC_PATH = BASE + '/portfolio/data/discover_config.json';
const HIST_PATH = BASE + '/portfolio/data/history.json';
const TS        = '?t=' + Date.now();

// ── Utilities ──
function toJST(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return '—';
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }) + ' JST';
}
function fmt$(v) {
  if (v == null) return '—';
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtPct(v, dec=1) {
  if (v == null) return '—';
  const s = (v>=0?'+':'') + v.toFixed(dec) + '%';
  return `<span class="${v>=0?'pos':'neg'}">${s}</span>`;
}

let _usdJpy    = 150;
let _currMode2 = 'usd';
let _pfState   = null;

function fmtC(v) {
  if (v == null) return '—';
  if (_currMode2 === 'jpy') return '¥' + Math.round(v * _usdJpy).toLocaleString('ja-JP');
  return fmt$(v);
}
function switchCurr(mode) {
  _currMode2 = mode;
  document.querySelectorAll('.curr-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (_pfState) { _renderSummary(); _renderBrokers(); _renderTable(); }
}

// ── Score logic ──
// ARCH-PORTFOLIO-DUP-1: 分類は再計算せず、latest.jsonのtanuki_score/funda_score/
// timing_scoreをそのまま参照する（ARCH-SCORE-SYNC-1の方針に統一）
const CAT_META = {
  BUY:  { badge:'badge-BUY',   label:'BUY'  },
  WATCH:{ badge:'badge-WATCH', label:'WATCH' },
  HOLD: { badge:'badge-HOLD',  label:'HOLD'  },
  TRIM: { badge:'badge-TRIM',  label:'TRIM'  },
  SELL: { badge:'badge-SELL',  label:'SELL'  },
  PASS: { badge:'badge-PASS',  label:'PASS'  },
  UNDETERMINED: { badge:'badge-UNDETERMINED', label:'判定不能' },
};

// ── Main data loader ──
async function loadData() {
  const [pfRes, discRes, univRes, histPreRes] = await Promise.allSettled([
    fetch(PF_PATH   + TS).then(r => r.ok ? r.json() : null),
    fetch(DISC_PATH + TS).then(r => r.ok ? r.json() : null),
    fetch(T_BASE + 'tickers.json' + TS).then(r => r.ok ? r.json() : null),
    fetch(HIST_PATH + TS).then(r => r.ok ? r.json() : null),
  ]);

  const pf     = pfRes.status  === 'fulfilled' ? pfRes.value   : null;
  const disc   = discRes.status === 'fulfilled' ? discRes.value : null;
  // PORT-LOGIC-1: HYPEMIX仕込み候補抽出用にTANUKI VALUATION全銘柄ロスターを取得
  const universeTickers = univRes.status === 'fulfilled' ? (univRes.value?.tickers ?? []) : [];
  const _histPre = histPreRes.status === 'fulfilled' ? histPreRes.value : null;
  _histData = _histPre ?? { snapshots: [] };
  const _latestSnap = _histData.snapshots?.at?.(-1) ?? null;
  if (_latestSnap?.usdjpy) _usdJpy = _latestSnap.usdjpy;

  if (!pf) {
    document.getElementById('summary-section').innerHTML =
      '<p style="color:var(--mut);font-family:var(--mono);font-size:13px;padding:40px">portfolio.json を取得できませんでした。</p>';
    return;
  }

  const lu = document.getElementById('last-updated');
  if (lu && pf.last_updated) lu.textContent = toJST(pf.last_updated + 'T00:00:00+09:00');

  // 保有中 tickers from discover_config
  const discTickers = disc?.tickers ?? {};
  const holdingTickers = Object.entries(discTickers)
    .filter(([, info]) => info.category === '保有中')
    .map(([t]) => t)
    .sort();

  // Brokers
  const brokers = pf.brokers ?? {};

  // Aggregate positions across brokers (weighted avg cost)
  // posAgg[ticker] = { totalShares, totalCost, memos[] }
  const posAgg = {};
  let totalCashAll = 0;
  const brokerSummaries = [];

  for (const [brokerName, brokerData] of Object.entries(brokers)) {
    const bCash = brokerData.cash ?? 0;
    totalCashAll += bCash;
    let bValue = 0; // filled after price fetch

    const bPositions = brokerData.positions ?? {};
    for (const [ticker, pos] of Object.entries(bPositions)) {
      const shares   = pos.shares   ?? 0;
      const avg_cost = pos.avg_cost ?? 0;
      if (shares <= 0) continue;
      if (!posAgg[ticker]) posAgg[ticker] = { totalShares: 0, totalCost: 0, memos: [] };
      posAgg[ticker].totalShares += shares;
      posAgg[ticker].totalCost   += shares * avg_cost;
      if (pos.memo) posAgg[ticker].memos.push(pos.memo);
    }
    brokerSummaries.push({ name: brokerName, cash: bCash, positions: bPositions });
  }

  // Tickers to display: 保有中 from discover_config (for table)
  // Also include any tickers that are in posAgg but not in holdingTickers (warn them)
  const displayTickers = holdingTickers.length > 0 ? holdingTickers
    : Object.keys(posAgg).sort();

  if (displayTickers.length === 0 && Object.keys(posAgg).length === 0) {
    document.getElementById('summary-section').innerHTML =
      '<p style="color:var(--mut);font-family:var(--mono);font-size:13px;padding:40px">保有銘柄がありません。ADMIN からポートフォリオを設定してください。</p>';
    return;
  }

  // Fetch tanuki + hypecore data for all tickers in posAgg
  // PORT-LOGIC-1: HYPEMIX仕込み候補抽出のためuniverseTickers（全銘柄ロスター）も含める
  const allTickers = [...new Set([...displayTickers, ...Object.keys(posAgg), ...universeTickers])];

  const [tanukiMap, hypeMap] = await Promise.all([
    Promise.allSettled(allTickers.map(async tk => {
      try {
        const r = await fetch(`${T_BASE}${tk}/latest.json${TS}`);
        if (r.ok) return [tk, await r.json()];
      } catch(_) {}
      return [tk, null];
    })).then(rs => Object.fromEntries(rs.map(r => r.value ?? [null,null]).filter(([k])=>k))),

    Promise.allSettled(allTickers.map(async tk => {
      try {
        const r = await fetch(`${H_BASE}${tk}_poc.json${TS}`);
        if (r.ok) return [tk, await r.json()];
      } catch(_) {}
      return [tk, null];
    })).then(rs => Object.fromEntries(rs.map(r => r.value ?? [null,null]).filter(([k])=>k))),
  ]);

  // Build aggregated rows for display
  let totalCost  = 0;
  let totalValue = 0;
  let totalPnl   = 0;
  const phaseCount = {};

  const rows = displayTickers.map(ticker => {
    const agg = posAgg[ticker] ?? { totalShares: 0, totalCost: 0, memos: [] };
    const totalShares = agg.totalShares;
    const totalPosCost = agg.totalCost;
    const weightedAvgCost = totalShares > 0 ? totalPosCost / totalShares : 0;

    const tk = tanukiMap[ticker];
    const hc = hypeMap[ticker];
    const lastMo        = hc?.monthly?.[hc.monthly.length - 1] ?? null;
    const currentPrice  = tk?.components?.current_price ?? null;
    const ivps          = tk?.scenario_valuations?.base?.intrinsic_value_per_share
                        ?? tk?.intrinsic_value_per_share ?? null;
    const upside        = tk?.upside_percent ?? null;
    const stageLabel    = lastMo?.stage_label    ?? '—';
    const substageLabel = lastMo?.substage_label ?? '';

    const posValue = currentPrice != null && totalShares > 0 ? totalShares * currentPrice : null;
    const posPnl   = posValue != null ? posValue - totalPosCost : null;
    const pnlPct   = weightedAvgCost > 0 && currentPrice != null
                   ? (currentPrice - weightedAvgCost) / weightedAvgCost * 100 : null;

    if (posValue != null) totalValue += posValue;
    if (totalShares > 0)  totalCost  += totalPosCost;
    if (posPnl != null)   totalPnl   += posPnl;

    if (stageLabel && stageLabel !== '—' && totalShares > 0) {
      phaseCount[stageLabel] = (phaseCount[stageLabel] || 0) + 1;
    }

    // ARCH-PORTFOLIO-DUP-1: pipeline.pyが計算済みの値をそのまま参照（再計算しない）
    const cat    = tk?.tanuki_score ?? null;
    const funda  = tk?.funda_score  ?? 0;
    const timing = tk?.timing_score ?? 0;

    // Warn if in posAgg but not in discover 保有中
    const inDiscover   = discTickers[ticker];
    const notHolding   = inDiscover ? inDiscover.category !== '保有中' : false;
    const notInDisc    = !inDiscover && totalShares > 0;

    const memo = [...new Set(agg.memos)].join(' / ');

    return { ticker, totalShares, weightedAvgCost, totalPosCost, currentPrice, posValue,
             posPnl, pnlPct, ivps, upside, stageLabel, substageLabel,
             cat, funda, timing, notHolding, notInDisc, memo };
  });

  const totalAssets = totalValue + totalCashAll;
  const totalPnlPct = totalCost > 0 ? (totalPnl / totalCost) * 100 : 0;
  const cashRatio   = totalAssets > 0 ? (totalCashAll / totalAssets) * 100 : 0;

  // ①②③ Summary / Broker / Table — 通貨再描画対応のため関数に委譲
  // PORT-LAYOUT-1: 残高$0のブローカー（「その他」等）は末尾に表示する（他は元の順序を維持）
  const brokerData = brokerSummaries
    .map(b => {
      const bTotalCost = Object.values(b.positions).reduce((s, p) => s + (p.shares||0)*(p.avg_cost||0), 0);
      const bTotalValue = Object.entries(b.positions).reduce((s, [tk, p]) => {
        const price = tanukiMap[tk]?.components?.current_price ?? null;
        return s + (price != null ? (p.shares||0) * price : 0);
      }, 0);
      const bPnl = bTotalValue - bTotalCost;
      const bAssets = bTotalValue + b.cash;
      return { name: b.name, cash: b.cash, bTotalValue, bPnl, bAssets };
    })
    .sort((x, y) => (x.bAssets === 0 ? 1 : 0) - (y.bAssets === 0 ? 1 : 0));

  _pfState = { totalAssets, totalValue, totalPnl, totalCashAll, totalCost, totalPnlPct, cashRatio, rows, brokerData };
  _renderSummary();
  _renderBrokers();
  _renderTable();

  // HYPEMIX
  renderHypemix(posAgg, hypeMap, tanukiMap, universeTickers);

  // ④ Phase distribution
  const distItems = Object.entries(phaseCount)
    .sort((a,b) => b[1]-a[1])
    .map(([label,cnt]) => `<div class="dist-item"><span class="dist-label">${label}</span>${cnt}銘柄</div>`)
    .join('');

  document.getElementById('dist-section').innerHTML = `
    <div class="sec">④ フェーズ分布</div>
    <div class="dist-bar">${distItems || '<span style="color:var(--mut)">データなし</span>'}</div>`;

  // ⑤ History chart
  loadHistoryChart();
}

// ── HYPEMIX ──
// PORT-LOGIC-1: HYPEMIXの「仕込みゾーン」と同一の早期フェーズ定義
const EARLY_STAGE_LABELS = ['失望/蓄積期', '期待覚醒期', '期待拡大期'];

// PORT-LOGIC-1: TANUKI SCORE BUY × 早期フェーズ × 未保有 の仕込み候補を抽出
// 並び順はdaily_pick.pyのstocks.sort（-funda, -timing）に揃える
function findHypemixCandidates(tanukiMap, hypeMap, posAgg, universeTickers) {
  const heldTickers = new Set(
    Object.keys(posAgg).filter(t => (posAgg[t]?.totalShares ?? 0) > 0)
  );
  const candidates = [];
  for (const ticker of universeTickers) {
    if (heldTickers.has(ticker)) continue;
    const tk = tanukiMap[ticker];
    if (!tk || tk.tanuki_score !== 'BUY') continue;
    const hc = hypeMap[ticker];
    const lastMo = hc?.monthly?.[hc.monthly.length - 1] ?? null;
    const stageLabel = lastMo?.stage_label ?? null;
    if (!EARLY_STAGE_LABELS.includes(stageLabel)) continue;
    candidates.push({
      ticker,
      upside: tk.upside_percent ?? null,
      funda:  tk.funda_score   ?? 0,
      timing: tk.timing_score  ?? 0,
      stageLabel,
    });
  }
  candidates.sort((a, b) => (b.funda - a.funda) || (b.timing - a.timing));
  return candidates.slice(0, 5);
}

function renderHypemix(posAgg, hypeMap, tanukiMap, universeTickers) {
  const PHASE_CFG = [
    { label: '失望/蓄積期', color: '#64748b', target: 10 },
    { label: '期待覚醒期',  color: '#10b981', target: 20 },
    { label: '期待拡大期',  color: '#3b82f6', target: 30 },
    { label: '陶酔期',      color: '#f59e0b', target: 30 },
    { label: '期待剥落期',  color: '#f43f5e', target: 10 },
  ];

  const phaseMap = {};
  PHASE_CFG.forEach(p => { phaseMap[p.label] = []; });

  const holdings = Object.keys(posAgg);
  const total = holdings.length;

  holdings.forEach(ticker => {
    const hc = hypeMap[ticker];
    const lastMo = hc?.monthly?.[hc.monthly.length - 1] ?? null;
    const sl = lastMo?.stage_label ?? null;
    const key = PHASE_CFG.find(p => p.label === sl)?.label ?? null;
    if (key) phaseMap[key].push(ticker);
  });

  const phaseData = PHASE_CFG.map(p => ({
    ...p,
    count:   phaseMap[p.label].length,
    tickers: phaseMap[p.label],
    pct:     total > 0 ? phaseMap[p.label].length / total * 100 : 0,
  }));

  const s3s4pct = total > 0
    ? (phaseMap['陶酔期'].length + phaseMap['期待剥落期'].length) / total * 100
    : 0;
  const [badgeCls, badgeTxt] =
    s3s4pct <= 40 ? ['hbadge-good',    '良好']   :
    s3s4pct <= 60 ? ['hbadge-caution', '要注意'] :
                    ['hbadge-danger',   '危険'];

  const devHtml = phaseData.map(d => {
    const diff = d.pct - d.target;
    const col  = diff >= 6 ? 'var(--red)' : diff <= -6 ? 'var(--grn)' : 'var(--txt)';
    const sign = diff >= 0 ? '+' : '';
    return `<div class="hypemix-dev-row">
      <span style="color:${d.color}">■</span>
      <span style="flex:1">${d.label}</span>
      <span style="color:${col}">${d.pct.toFixed(1)}% → ${d.target}%（${sign}${diff.toFixed(1)}%）</span>
    </div>`;
  }).join('');

  const s3pct    = phaseData.find(d => d.label === '陶酔期')?.pct ?? 0;
  const s4pct    = phaseData.find(d => d.label === '期待剥落期')?.pct ?? 0;
  const earlyPct = EARLY_STAGE_LABELS
    .reduce((s, l) => s + (phaseData.find(d => d.label === l)?.pct ?? 0), 0);

  const proposals = [];
  if (s3pct > 40)
    proposals.push(`陶酔期の銘柄（${phaseMap['陶酔期'].join(', ')}）が過多です。一部利確を検討してください。`);
  if (s4pct > 40)
    proposals.push(`期待剥落期の銘柄（${phaseMap['期待剥落期'].join(', ')}）が多い状態です。底打ちシグナルを確認してください。`);

  // PORT-LOGIC-1: 早期フェーズ不足時はDiscoverへの誘導ではなく、
  // 登録済み・分析済み銘柄からTANUKI SCORE BUY×早期フェーズの候補を直接提案する
  const showCandidates = earlyPct < 30;
  const buyCandidates  = showCandidates
    ? findHypemixCandidates(tanukiMap, hypeMap, posAgg, universeTickers)
    : [];

  if (!proposals.length && !showCandidates)
    proposals.push('フェーズ分布はバランス良好です。');

  const candidatesHtml = !showCandidates ? '' : buyCandidates.length > 0 ? `
    <div class="hypemix-cand-hdr">仕込みゾーン候補（TANUKI SCORE BUY判定 × 早期フェーズ・未保有）</div>
    <div class="hypemix-cand-list">${buyCandidates.map(c => `
      <a class="hypemix-cand-chip" href="../value-monitor/tanuki_valuation/stock.html?ticker=${c.ticker}">
        <span class="cat-badge badge-BUY">${c.ticker}</span>
        <span class="hcc-meta">乖離${c.upside!=null?(c.upside>=0?'+':'')+c.upside.toFixed(0)+'%':'—'} · F:${c.funda} T:${c.timing} · ${c.stageLabel}</span>
      </a>`).join('')}</div>` : `
    <div class="hypemix-cand-hdr">仕込みゾーン候補（TANUKI SCORE BUY判定 × 早期フェーズ・未保有）</div>
    <div class="hypemix-cand-empty">BUY判定×仕込みゾーンの新規候補銘柄は現在ありません。</div>`;

  const sec = document.getElementById('hypemix-section');
  if (!sec) return;
  sec.innerHTML = `
    <div class="sec">HYPEMIX</div>
    <div class="hypemix-wrap">
      <div class="hypemix-hdr">
        <span style="font-family:var(--mono);font-size:11px;color:var(--mut)">保有${total}銘柄のフェーズ分布</span>
        <span class="hypemix-badge ${badgeCls}" data-info="port_hypemix_badge">${badgeTxt}</span>
      </div>
      <div class="hypemix-charts">
        <div class="hypemix-chart-card">
          <div class="hypemix-chart-title">現状</div>
          <canvas id="hm-current" style="max-height:240px"></canvas>
        </div>
        <div class="hypemix-chart-card">
          <div class="hypemix-chart-title">目標</div>
          <canvas id="hm-target" style="max-height:240px"></canvas>
        </div>
      </div>
      <div class="hypemix-dev">${devHtml}</div>
      ${proposals.length ? `<div class="hypemix-proposal">${proposals.join('<br>')}</div>` : ''}
      ${candidatesHtml}
    </div>`;

  const mkChart = (id, data, isActual) => {
    const el = document.getElementById(id);
    if (!el) return;
    new Chart(el, {
      type: 'doughnut',
      data: {
        labels: PHASE_CFG.map(p => p.label),
        datasets: [{
          data,
          backgroundColor: PHASE_CFG.map(p => p.color + 'cc'),
          borderColor: '#0a0d14',
          borderWidth: 2,
          hoverBackgroundColor: PHASE_CFG.map(p => p.color),
        }],
      },
      options: {
        responsive: true,
        cutout: '60%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => items[0]?.label ?? '',
              label: (ctx) => {
                if (isActual) {
                  const pct  = total > 0 ? (ctx.parsed / total * 100).toFixed(1) : '0.0';
                  const tks  = phaseMap[ctx.label] ?? [];
                  const lines = [`${pct}% (${ctx.parsed}銘柄)`];
                  if (tks.length) lines.push(tks.join(', '));
                  return lines;
                }
                return `${ctx.parsed}%`;
              },
            },
            backgroundColor: 'rgba(17,21,32,.95)',
            borderColor: '#1e2840',
            borderWidth: 1,
            titleFont: { family: 'Space Mono, monospace', size: 11 },
            bodyFont:  { family: 'Space Mono, monospace', size: 11 },
            padding: 10,
          },
        },
      },
    });
  };

  mkChart('hm-current', phaseData.map(d => d.count), true);
  mkChart('hm-target',  PHASE_CFG.map(p => p.target), false);
}

// ── History chart ──
let _histData  = null;
let _chartMode = 'usd'; // 'usd' | 'jpy' | 'both'

async function loadHistoryChart() {
  const sec = document.getElementById('chart-section');
  if (!sec) return;

  if (!_histData) {
    try {
      const r = await fetch(HIST_PATH + TS);
      _histData = r.ok ? await r.json() : { snapshots: [] };
    } catch(_) {
      _histData = { snapshots: [] };
    }
  }

  sec.innerHTML = `
    <div class="sec">⑤ 資産推移</div>
    <div class="chart-wrap">
      <div class="chart-ctrl">
        <button class="chart-btn active" id="btn-usd"  onclick="switchChart('usd')">USD表示</button>
        <button class="chart-btn"        id="btn-jpy"  onclick="switchChart('jpy')">JPY表示</button>
        <button class="chart-btn"        id="btn-both" onclick="switchChart('both')">両方</button>
      </div>
      <div id="history-plotly" style="width:100%;height:360px"></div>
    </div>`;

  renderHistoryChart();
}

function switchChart(mode) {
  _chartMode = mode;
  ['usd','jpy','both'].forEach(m => {
    const b = document.getElementById('btn-' + m);
    if (b) b.classList.toggle('active', m === mode);
  });
  renderHistoryChart();
}

function renderHistoryChart() {
  const snaps = (_histData?.snapshots ?? []);
  const el = document.getElementById('history-plotly');
  if (!el) return;

  if (snaps.length <= 1) {
    el.innerHTML = '<div class="chart-empty">データ蓄積中（初回実行後に表示されます）</div>';
    return;
  }

  const dates    = snaps.map(s => s.date);
  const assetsUsd = snaps.map(s => s.total_assets_usd);
  const assetsJpy = snaps.map(s => s.total_assets_jpy);
  const pnlUsd   = snaps.map(s => s.total_pnl_usd);

  const LAYOUT_BASE = {
    paper_bgcolor: '#0d1117',
    plot_bgcolor:  '#0d1117',
    font:          { family: 'Space Mono, monospace', color: '#64748b', size: 11 },
    margin:        { t: 16, r: 60, b: 48, l: 70 },
    legend:        { orientation: 'h', x: 0, y: 1.08, font: { size: 10 } },
    xaxis: {
      gridcolor: '#1e2840', zerolinecolor: '#1e2840',
      tickfont:  { size: 10 },
    },
    yaxis: {
      gridcolor: '#1e2840', zerolinecolor: '#1e2840',
      tickfont:  { size: 10 },
      tickprefix: '$',
    },
    yaxis2: {
      gridcolor: '#1e2840', zerolinecolor: '#1e2840',
      tickfont:  { size: 10 }, tickprefix: '¥',
      overlaying: 'y', side: 'right', showgrid: false,
    },
    hovermode: 'x unified',
  };

  const AXIS_COMMON = { gridcolor: '#1e2840', zerolinecolor: '#1e2840', tickfont: { size: 10 } };

  let traces, layout;
  if (_chartMode === 'usd') {
    traces = [
      { x: dates, y: assetsUsd, name: '総資産(USD)',   type:'scatter', mode:'lines+markers', line:{color:'#f97316',width:2}, marker:{size:4} },
      { x: dates, y: pnlUsd,   name: '評価損益(USD)', type:'scatter', mode:'lines',          line:{color:'#10b981',width:1.5,dash:'dash'} },
    ];
    layout = { ...LAYOUT_BASE, yaxis: { ...AXIS_COMMON, tickprefix:'$' }, yaxis2: { visible: false } };

  } else if (_chartMode === 'jpy') {
    traces = [
      { x: dates, y: assetsJpy, name: '総資産(JPY)', type:'scatter', mode:'lines+markers', line:{color:'#3b82f6',width:2}, marker:{size:4} },
    ];
    layout = { ...LAYOUT_BASE, yaxis: { ...AXIS_COMMON, tickprefix:'¥' }, yaxis2: { visible: false } };

  } else {
    traces = [
      { x: dates, y: assetsUsd, name: '総資産(USD)',   type:'scatter', mode:'lines+markers', line:{color:'#f97316',width:2}, marker:{size:4}, yaxis:'y' },
      { x: dates, y: pnlUsd,   name: '評価損益(USD)', type:'scatter', mode:'lines',          line:{color:'#10b981',width:1.5,dash:'dash'},    yaxis:'y' },
      { x: dates, y: assetsJpy, name: '総資産(JPY)',  type:'scatter', mode:'lines+markers', line:{color:'#3b82f6',width:2}, marker:{size:4}, yaxis:'y2' },
    ];
    layout = LAYOUT_BASE;
  }

  Plotly.react(el, traces, layout, { responsive: true, displayModeBar: false });
}
