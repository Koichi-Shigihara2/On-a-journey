<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/On-a-journey/favicon.ico">
<link rel="stylesheet" href="/On-a-journey/common/site-theme.css">
<title>HypeCore — 銘柄一覧</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{
  --bg:#0a0d14;--sur:#111520;--sur2:#161c2d;--bdr:#1e2840;
  --txt:#e2e8f0;--mut:#b0bec5;
  --mono:"Space Mono",monospace;--sans:"Noto Sans JP",sans-serif;
  --grn:#10b981;--red:#f43f5e;--amb:#f59e0b;--blu:#3b82f6;--pur:#a855f7;--cyn:#06b6d4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh}
header{position:sticky;top:0;z-index:100;background:rgba(10,13,20,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bdr);padding:6px 24px;min-height:48px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.logo-name{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mut)}
.nav-back{font-family:var(--mono);font-size:11px;color:var(--mut);text-decoration:none}
.shell{max-width:1400px;margin:0 auto;padding:20px 20px 60px}

/* ── PAGE TITLE ── */
.page-title{display:flex;align-items:baseline;gap:16px;padding:20px 0 16px;border-bottom:1px solid var(--bdr);margin-bottom:20px}
.page-title-main{font-family:var(--mono);font-size:32px;font-weight:700}
.page-title-main span{color:var(--acc)}
.page-title-sub{font-size:13px;color:var(--mut)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{font-family:var(--mono);font-size:11px;padding:4px 12px;border:1px solid var(--bdr);
  background:transparent;color:var(--mut);cursor:pointer;transition:all .15s;border-radius:2px}
.filter-btn:hover{border-color:var(--blu);color:var(--blu)}
.filter-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(236,72,153,.10)}
.filter-lbl{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.1em}
.search-input{font-family:var(--mono);font-size:12px;padding:4px 10px;background:var(--sur);
  border:1px solid var(--bdr);color:var(--txt);width:120px;outline:none}
.search-input:focus{border-color:var(--blu)}
.count-badge{font-family:var(--mono);font-size:11px;color:var(--mut);margin-left:auto}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mut);
  padding:8px 12px;border-bottom:1px solid var(--bdr);text-align:left;white-space:nowrap;
  cursor:pointer;user-select:none}
thead th:hover{color:var(--txt)}
thead th.sort-asc::after{content:' ▲';color:var(--acc)}
thead th.sort-desc::after{content:' ▼';color:var(--acc)}
tbody tr{border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--sur)}
tbody td{padding:5px 10px;vertical-align:middle}

/* ── BADGES ── */
.badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:2px}
.badge-lc{background:rgba(59,130,246,.15);color:#93c5fd}
.badge-s0{background:rgba(100,116,139,.15);color:#94a3b8}
.badge-s1{background:rgba(6,182,212,.15);color:#67e8f9}
.badge-s2{background:rgba(59,130,246,.15);color:#93c5fd}
.badge-s3{background:rgba(245,158,11,.15);color:#fcd34d}
.badge-s4{background:rgba(168,85,247,.15);color:#d8b4fe}
.rec-buy{color:#10b981;font-weight:700;white-space:nowrap}
.rec-hold{color:#f59e0b;font-weight:700;white-space:nowrap}
.rec-sell{color:#f43f5e;font-weight:700;white-space:nowrap}
.rec-watch{color:#94a3b8;font-weight:700;white-space:nowrap}
/* HYPE-DISP-1: 「様子見（底打ち）」（実測幅約89px）が折り返されないよう
   td padding(左右計20px)を加味した最小幅を確保する */
.rec-cell{min-width:120px}
.ticker-link{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--acc);text-decoration:none}
.ticker-link:hover{text-decoration:underline}
.loading{text-align:center;padding:60px;color:var(--mut);font-family:var(--mono)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bdr);
  border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.phase-tag{font-size:11px;color:var(--mut);display:inline-block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.num-pos{color:#10b981}
.num-neg{color:#f43f5e}
.num-neu{color:var(--mut)}
</style>
</head>
<body data-tool="hype">
<header>
  <a class="logo" href="/On-a-journey/">
    <img src="/On-a-journey/common/images/logo.png" alt="TANUKI" style="height:22px;width:auto;object-fit:contain;vertical-align:middle">
    <span class="logo-dot"></span>
    <span class="logo-name">ON A JOURNEY</span>
  </a>
  <nav class="nav-links"></nav>
</header>
<div class="last-updated" id="last-updated"></div>

<div class="shell">
  <div class="page-title">
    <div class="page-title-main">HYPE<span>CORE</span></div>
    <div class="page-title-sub">期待と実体の関係性からハイプサイクル上の現在位置を判定する</div>
  </div>

  <div class="filter-bar">
    <span class="filter-lbl">STAGE</span>
    <button class="filter-btn active" data-filter="stage" data-val="all">ALL</button>
    <button class="filter-btn" data-filter="stage" data-val="0">S0 失望</button>
    <button class="filter-btn" data-filter="stage" data-val="1">S1 覚醒</button>
    <button class="filter-btn" data-filter="stage" data-val="2">S2 拡大</button>
    <button class="filter-btn" data-filter="stage" data-val="3">S3 陶酔</button>
    <button class="filter-btn" data-filter="stage" data-val="4">S4 剥落</button>
    <span class="filter-lbl" style="margin-left:8px">推奨</span>
    <button class="filter-btn active" data-filter="rec" data-val="all">ALL</button>
    <button class="filter-btn" data-filter="rec" data-val="buy">買い</button>
    <button class="filter-btn" data-filter="rec" data-val="hold">保有</button>
    <button class="filter-btn" data-filter="rec" data-val="sell">売り</button>
    <input class="search-input" id="searchInput" placeholder="TICKER検索" autocomplete="off">
    <span class="count-badge" id="countBadge">— 銘柄</span>
  </div>

  <div class="table-wrap">
    <table id="mainTable">
      <thead>
        <tr>
          <th data-col="ticker">TICKER</th>
          <th data-col="lc" data-priority="low">ライフサイクル</th>
          <th data-col="stage" data-info="hype_stage_color">ステージ</th>
          <th data-col="phase">フェーズ</th>
          <th data-col="rec">推奨</th>
          <th data-col="price">株価</th>
          <th data-col="piv">株価÷IV</th>
          <th data-col="revyoy">売上YoY</th>
          <th data-col="rule40" data-priority="low">Rule of 40</th>
          <th data-col="ma200">MA200乖離</th>
          <th data-col="peak" data-priority="low">高値比</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="11" class="loading"><span class="spinner"></span>データを読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const STAGE_LABEL={0:'S0 失望',1:'S1 覚醒',2:'S2 拡大',3:'S3 陶酔',4:'S4 剥落'};
const STAGE_CLASS={0:'badge-s0',1:'badge-s1',2:'badge-s2',3:'badge-s3',4:'badge-s4'};
const LC_LABEL={dawn:'黎明期',growth:'成長期',expand:'拡大期',mature:'成熟期'};

function detectLifecycle(data){
  // [[HYPECORE-MISC-NAMING-GAPS-1]]⑥（2026-08-29）: revenue_growth_yf
  // （yfinance）が取得できない場合のみrev_yoy（SEC EDGAR TTM%）へ暗黙
  // フォールバックする。どちらが実際に使われたかをsourceとして返し、
  // 呼び出し側でツールチップ表示に使う（事後検証できるようにする）。
  const lat=data.monthly[data.monthly.length-1];
  const usedYf=lat.revenue_growth_yf!=null;
  const g=usedYf?lat.revenue_growth_yf*100:(lat.rev_yoy??0);
  const stage=g>40?'growth':g>15?'expand':g>0?'mature':'dawn';
  return{stage,g,source:usedYf?'yf':'sec'};
}

function getRec(d,prev){
  const ma=d.ma200_dev_local??0,fp=d.from_peak??0,s=d.stage,ps=prev?.stage??s;
  // [[HYPECORE-REALSTRONG-DUAL-IMPL-1]]: サーバー側detect_substage()の
  // real_strong判定結果をそのまま使う（独自の簡略版ANDのみ再実装は廃止）
  const real_strong=d.real_strong??false;
  const ma200_shrinking=(d.ma200_mom??0)>-5;
  if(s===0&&ps===4)return{cat:'buy',text:'強い買い推奨'};
  if(s===1)return{cat:'buy',text:'買い推奨'};
  if(s===2)return{cat:'hold',text:'保有継続'};
  if(s===3&&ma<50)return{cat:'hold',text:'保有・要注意'};
  if(s===3&&ma>=50)return{cat:'sell',text:'売り準備'};
  if(s===4&&ps===3)return{cat:'sell',text:'売り推奨'};
  if(s===4&&real_strong&&ma200_shrinking)return{cat:'watch',text:'様子見（底打ち）'};
  if(s===4&&real_strong)return{cat:'hold',text:'底は近い'};
  if(s===4)return{cat:'sell',text:'売り継続'};
  return{cat:'watch',text:'様子見'};
}

function recClass(cat){
  return{buy:'rec-buy',hold:'rec-hold',sell:'rec-sell',watch:'rec-watch'}[cat]||'rec-watch';
}

// HYPE-BUG-3: 推奨列ソート用の投資判断優先順位（強い推奨が上位）
const REC_ORDER={buy:0,hold:1,watch:2,sell:3};

function fmt(v,dec=1,plus=false,unit='%'){
  if(v==null)return'—';
  return(plus&&v>0?'+':'')+v.toFixed(dec)+unit;
}
function numColor(v,pos=true){
  if(v==null)return'num-neu';
  return v>0?(pos?'num-pos':'num-neg'):(pos?'num-neg':'num-pos');
}

// データ取得
let allRows=[];
let sortCol=null, sortDir=1;
let filterStage='all', filterRec='all', searchQ='';

function toJST(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return '—';
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }) + ' JST';
}

async function loadAll(){
  let ALL_TICKERS=[];
  try{
    const idxRes=await fetch('data/tickers.json',{cache:'no-cache'});
    if(idxRes.ok){
      const idx=await idxRes.json();
      ALL_TICKERS=idx.tickers||[];
    }
  }catch(e){}

  const results=await Promise.allSettled(
    ALL_TICKERS.map(t=>fetch(`data/${t}_poc.json`).then(r=>r.ok?r.json():null).catch(()=>null))
  );
  allRows=[];
  let latestGeneratedAt='';
  for(let i=0;i<ALL_TICKERS.length;i++){
    const t=ALL_TICKERS[i];
    const data=results[i].status==='fulfilled'?results[i].value:null;
    if(!data||!data.monthly||data.monthly.length===0)continue;
    const m=data.monthly, lat=m[m.length-1], prev=m[m.length-2];
    const lcInfo=detectLifecycle(data);
    const lc=lcInfo.stage;
    const rec=getRec(lat,prev);
    if(data.generated_at&&data.generated_at>latestGeneratedAt) latestGeneratedAt=data.generated_at;
    allRows.push({
      ticker:t,
      lc, lcLabel:LC_LABEL[lc]||lc,
      lcSource:lcInfo.source, lcGrowth:lcInfo.g,
      stage:lat.stage??0,
      phase:lat.substage_phase||'—',
      phaseLabel:lat.substage_label||'',
      rec,
      price:lat.price??null,
      piv:lat.price_iv_ratio??null,
      revyoy:lat.rev_yoy??null,
      rule40:lat.rule40_yoy_netmargin??null,
      ma200:lat.ma200_dev_local??null,
      peak:lat.from_peak??null,
    });
  }
  if(latestGeneratedAt){
    const el=document.getElementById('last-updated');
    if(el) el.textContent=toJST(latestGeneratedAt);
  }
  renderTable();
}

function renderTable(){
  let rows=[...allRows];

  // フィルター
  if(filterStage!=='all') rows=rows.filter(r=>r.stage===parseInt(filterStage));
  if(filterRec!=='all')   rows=rows.filter(r=>r.rec.cat===filterRec);
  if(searchQ)             rows=rows.filter(r=>r.ticker.includes(searchQ.toUpperCase()));

  // ソート
  if(sortCol){
    rows.sort((a,b)=>{
      let av=a[sortCol], bv=b[sortCol];
      if(av==null&&bv==null)return 0;
      if(av==null)return 1; if(bv==null)return -1;
      // HYPE-BUG-3: recは{cat,text}オブジェクトのためav-bvがNaNになりソート不能だった。
      // 投資判断の優先順位（強い推奨が上）でcatを比較する
      if(sortCol==='rec') return (REC_ORDER[av.cat]-REC_ORDER[bv.cat])*sortDir;
      if(typeof av==='string') return av.localeCompare(bv)*sortDir;
      return(av-bv)*sortDir;
    });
  }

  document.getElementById('countBadge').textContent=`${rows.length} 銘柄`;

  const tbody=document.getElementById('tableBody');
  if(rows.length===0){
    tbody.innerHTML=`<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--mut);font-family:var(--mono)">該当銘柄なし</td></tr>`;
    return;
  }

  tbody.innerHTML=rows.map(r=>{
    const pivColor=r.piv!=null?(r.piv>2?'num-neg':r.piv<0.7?'num-pos':'num-neu'):'num-neu';
    return `<tr onclick="location.href='detail.html?ticker=${r.ticker}'">
      <td><a class="ticker-link" href="detail.html?ticker=${r.ticker}" onclick="event.stopPropagation()">${r.ticker}</a></td>
      <td data-priority="low"><span class="badge badge-lc" style="font-size:10px" title="成長率${r.lcGrowth!=null?(r.lcGrowth>=0?'+':'')+r.lcGrowth.toFixed(1)+'%':'—'}（${r.lcSource==='yf'?'yfinance revenue_growth_yf':'SEC EDGAR rev_yoy（yf欠測時フォールバック）'}）">${r.lcLabel}</span></td>
      <td><span class="badge ${STAGE_CLASS[r.stage]}">${STAGE_LABEL[r.stage]}</span></td>
      <td><span class="phase-tag" title="${r.phase}${r.phaseLabel?' · '+r.phaseLabel:''}">${r.phase}${r.phaseLabel?' · '+r.phaseLabel:''}</span></td>
      <td class="rec-cell"><span class="${recClass(r.rec.cat)}">${r.rec.text}</span></td>
      <td class="num-neu" style="font-family:var(--mono)">${r.price!=null?'$'+r.price.toFixed(2):'—'}</td>
      <td class="num-neu ${pivColor}" style="font-family:var(--mono)">${r.piv!=null?r.piv.toFixed(2)+'x':'—'}</td>
      <td class="${numColor(r.revyoy)}" style="font-family:var(--mono)">${fmt(r.revyoy,1,true,'%')}</td>
      <td class="${numColor(r.rule40)}" data-priority="low" style="font-family:var(--mono)">${fmt(r.rule40,0,true,'%')}</td>
      <td class="${numColor(r.ma200)}" style="font-family:var(--mono)">${fmt(r.ma200,1,true,'%')}</td>
      <td class="${numColor(r.peak)}" data-priority="low" style="font-family:var(--mono)">${fmt(r.peak,1,true,'%')}</td>
    </tr>`;
  }).join('');
}

// フィルターボタン
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.filter, v=btn.dataset.val;
    document.querySelectorAll(`.filter-btn[data-filter="${f}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(f==='stage') filterStage=v;
    if(f==='rec')   filterRec=v;
    renderTable();
  });
});

// 検索
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value.trim();
  renderTable();
});

// ソート
document.querySelectorAll('thead th[data-col]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(sortCol===col){ sortDir*=-1; }
    else{ sortCol=col; sortDir=1; }
    document.querySelectorAll('thead th').forEach(t=>{t.classList.remove('sort-asc','sort-desc')});
    th.classList.add(sortDir===1?'sort-asc':'sort-desc');
    renderTable();
  });
});

loadAll();
</script>
<script src="/On-a-journey/common/site-nav.js"></script>
<script src="/On-a-journey/common/info-tooltip.js"></script>
</body>
</html>
