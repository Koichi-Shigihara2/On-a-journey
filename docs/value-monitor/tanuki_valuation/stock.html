function toJST(dateStr) {
  if (!dateStr || dateStr === '—') return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return '—';
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }) + ' JST';
}

function buildScatterSVG(points, opts) {
  const W = 400, H = opts.svgH || 300;
  const PL = 48, PR = 12, PT = 12, PB = 36;
  const IW = W - PL - PR, IH = H - PT - PB;
  // yScale='log' + yThresh2: RICE投資効率系パネル専用（外れ値による圧縮を解消する対数軸・3分類表示）
  // 他パネル（ROE/成長性/FCF）は従来通り線形2分類のまま
  // xClip: ARCH-MATRIX-DUP-1。設定時のみ、上限超の点を右端に折りたたみ表示し、
  // ラベル重なり回避ロジックを使う（①投資効率系のみ使用。他パネルは未設定のため従来通り動作）
  const { xMin, xMax, xThresh, yMin, yMax, yThresh, yThresh2, yScale, yFloor, xLabel, yLabel, currentTicker, xClip } = opts;

  function sx(v) { return PL + (v - xMin) / (xMax - xMin) * IW; }
  function sy(v) {
    if (yScale === 'log') {
      const floor = yFloor || 0.1;
      const vv = Math.max(v, floor);
      const logMin = Math.log10(floor), logMax = Math.log10(yMax);
      return PT + (1 - (Math.log10(vv) - logMin) / (logMax - logMin)) * IH;
    }
    return PT + (1 - (v - yMin) / (yMax - yMin)) * IH;
  }

  const inPoints   = xClip != null ? points.filter(p => p.x <= xClip) : points;
  const overPoints = xClip != null ? points.filter(p => p.x > xClip)  : [];

  const xZ = sx(xThresh);
  const yT = sy(yThresh);
  const yT2 = yThresh2 != null ? sy(yThresh2) : null;

  let out = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="background:#0d1117;border:1px solid #1e2840;border-radius:6px;width:100%;max-width:500px;">';

  if (yT2 != null) {
    // 3バンド（高効率/中効率/低効率）× 割安/割高
    out += '<rect x="' + xZ + '" y="' + PT + '" width="' + (PL + IW - xZ) + '" height="' + (yT2 - PT) + '" fill="rgba(74,222,128,0.05)"/>';
    out += '<rect x="' + PL + '" y="' + PT + '" width="' + (xZ - PL) + '" height="' + (yT2 - PT) + '" fill="rgba(251,191,36,0.05)"/>';
    out += '<rect x="' + PL + '" y="' + yT2 + '" width="' + IW + '" height="' + (yT - yT2) + '" fill="rgba(148,163,184,0.04)"/>';
    out += '<rect x="' + xZ + '" y="' + yT + '" width="' + (PL + IW - xZ) + '" height="' + (PT + IH - yT) + '" fill="rgba(148,163,184,0.05)"/>';
    out += '<rect x="' + PL + '" y="' + yT + '" width="' + (xZ - PL) + '" height="' + (PT + IH - yT) + '" fill="rgba(248,113,113,0.05)"/>';
  } else {
    // quadrant fills
    out += '<rect x="' + xZ + '" y="' + PT + '" width="' + (PL + IW - xZ) + '" height="' + (yT - PT) + '" fill="rgba(74,222,128,0.05)"/>';
    out += '<rect x="' + PL + '" y="' + PT + '" width="' + (xZ - PL) + '" height="' + (yT - PT) + '" fill="rgba(251,191,36,0.05)"/>';
    out += '<rect x="' + xZ + '" y="' + yT + '" width="' + (PL + IW - xZ) + '" height="' + (PT + IH - yT) + '" fill="rgba(148,163,184,0.05)"/>';
    out += '<rect x="' + PL + '" y="' + yT + '" width="' + (xZ - PL) + '" height="' + (PT + IH - yT) + '" fill="rgba(248,113,113,0.05)"/>';
  }

  // axis threshold lines
  out += '<line x1="' + xZ + '" y1="' + PT + '" x2="' + xZ + '" y2="' + (PT + IH) + '" stroke="#1e2840" stroke-width="1"/>';
  out += '<line x1="' + PL + '" y1="' + yT + '" x2="' + (PL + IW) + '" y2="' + yT + '" stroke="#1e2840" stroke-width="1"/>';
  if (yT2 != null) {
    out += '<line x1="' + PL + '" y1="' + yT2 + '" x2="' + (PL + IW) + '" y2="' + yT2 + '" stroke="#1e2840" stroke-width="1"/>';
  }

  // axis labels (white)
  out += '<text x="' + (W / 2) + '" y="' + (H - 4) + '" font-size="9" fill="#e8edf5" text-anchor="middle" font-family="monospace">' + xLabel + '</text>';
  out += '<text x="10" y="' + (PT + IH / 2) + '" font-size="9" fill="#e8edf5" text-anchor="middle" font-family="monospace" transform="rotate(-90,10,' + (PT + IH / 2) + ')">' + yLabel + '</text>';

  // x-axis tick labels
  out += '<text x="' + PL + '" y="' + (PT + IH + 12) + '" font-size="8" fill="#64748b" text-anchor="middle" font-family="monospace">' + xMin + '</text>';
  out += '<text x="' + xZ + '" y="' + (PT + IH + 12) + '" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="monospace">' + xThresh + '</text>';
  out += '<text x="' + (PL + IW) + '" y="' + (PT + IH + 12) + '" font-size="8" fill="#64748b" text-anchor="middle" font-family="monospace">' + (xClip != null ? '+' + xMax + '%' : xMax) + '</text>';

  // y-axis tick labels
  out += '<text x="' + (PL - 4) + '" y="' + (PT + 4) + '" font-size="8" fill="#64748b" text-anchor="end" font-family="monospace">' + yMax + '</text>';
  out += '<text x="' + (PL - 4) + '" y="' + (yT + 4) + '" font-size="8" fill="#94a3b8" text-anchor="end" font-family="monospace">' + yThresh + '</text>';
  if (yT2 != null) {
    out += '<text x="' + (PL - 4) + '" y="' + (yT2 + 4) + '" font-size="8" fill="#94a3b8" text-anchor="end" font-family="monospace">' + yThresh2 + '</text>';
  }
  out += '<text x="' + (PL - 4) + '" y="' + (PT + IH + 4) + '" font-size="8" fill="#64748b" text-anchor="end" font-family="monospace">' + (yScale === 'log' ? (yFloor || 0.1) : yMin) + '</text>';

  // points — compute screen coords, preserve original values for tooltip/label logic
  const plotted = inPoints.map(p => {
    const cx = Math.max(PL + 3, Math.min(PL + IW - 3, sx(p.x)));
    const cy = Math.max(PT + 3, Math.min(PT + IH - 3, sy(p.y)));
    const isCurrent = p.ticker === currentTicker;
    const qx = p.x >= xThresh;
    let col;
    if (isCurrent) {
      col = '#c4d0ff';
    } else if (yT2 != null) {
      const qHigh = p.y >= yThresh2, qMid = p.y >= yThresh && p.y < yThresh2;
      col = qx
        ? (qHigh ? '#4ade80' : qMid ? '#94a3b8' : '#f87171')
        : (qHigh ? '#facc15' : qMid ? '#64748b' : '#fb923c');
    } else {
      const qy = p.y >= yThresh;
      col = qx && qy ? '#4ade80' : (!qx && qy ? '#facc15' : (qx && !qy ? '#94a3b8' : '#f87171'));
    }
    return { ticker: p.ticker, x: p.x, y: p.y, cx, cy, isCurrent, qx, col, type: p.type };
  }).sort((a, b) => a.cx - b.cx);

  // ARCH-MATRIX-DUP-1: ラベル重なり回避（xClip指定時のみ）。tanuki_score側のドット直上
  // 固定配置を基準に、近接するラベルは衝突しなくなるまで上方向にずらして重なりを解消する
  const fs = opts.fontSize || 8;
  if (xClip != null) {
    const charW = fs * 0.62;
    const placedBoxes = [];
    for (const p of plotted) {
      const w = Math.max(p.ticker.length * charW, charW);
      let ly = p.cy - 7.5;
      let guard = 0;
      while (guard < 10) {
        const x0 = p.cx - w / 2, x1 = p.cx + w / 2;
        const hit = placedBoxes.some(b => x0 < b.x1 && x1 > b.x0 && Math.abs(ly - b.y) < fs + 3);
        if (!hit) break;
        ly -= (fs + 3);
        guard++;
      }
      placedBoxes.push({ x0: p.cx - w / 2, x1: p.cx + w / 2, y: ly });
      p.lx = p.cx; p.ly = ly;
    }
  }

  // draw dots + labels together per ticker: non-current first so current renders on top
  const sortedAll = [...plotted.filter(p => !p.isCurrent), ...plotted.filter(p => p.isCurrent)];
  for (const p of sortedAll) {
    const tip = p.ticker + '\n' + yLabel.replace(' →', '') + ': ' + p.y.toFixed(2) + '\n' + xLabel.replace(' →', '') + ': ' + p.x.toFixed(1);
    const anchor = xClip != null ? 'middle' : (p.cx > W / 2 ? 'end' : 'start');
    const lx = xClip != null ? p.lx : (anchor === 'end' ? p.cx - 6 : p.cx + 6);
    const ly = xClip != null ? p.ly : (p.cy + 3);
    const r = p.isCurrent ? 6 : 4;
    // q_anomaly（Q>5の黒字株）は白ストロークで通常の赤字株と区別
    const strokeAttr = p.type === 'q_anomaly' ? ' stroke="white" stroke-width="1.5"' : '';
    if (!p.isCurrent) out += '<a href="stock.html?ticker=' + p.ticker + '" style="cursor:pointer;">';
    out += '<g><title>' + tip + '</title>';
    out += '<circle cx="' + p.cx + '" cy="' + p.cy + '" r="' + r + '" fill="' + p.col + '" opacity="0.9"' + strokeAttr + '/>';
    if (p.isCurrent) out += '<circle cx="' + p.cx + '" cy="' + p.cy + '" r="8" fill="none" stroke="' + p.col + '" stroke-width="1.5" opacity="0.5"/>';
    out += '</g>';
    if (p.isCurrent) {
      const tw = p.ticker.length * 5 + 4;
      const rx = anchor === 'end' ? lx - tw : (anchor === 'middle' ? lx - tw / 2 : lx - 2);
      out += '<rect x="' + rx + '" y="' + (ly - 10) + '" width="' + tw + '" height="13" fill="rgba(0,0,0,0.7)" rx="2"/>';
    }
    out += '<text x="' + lx + '" y="' + ly + '" font-size="' + fs + '" fill="' + p.col + '" text-anchor="' + anchor + '" font-family="monospace">' + p.ticker + '</text>';
    if (!p.isCurrent) out += '</a>';
  }

  // ARCH-MATRIX-DUP-1: xClip超の点は右端に縦積みで折りたたみ表示（tanuki_score側のoverDotsと同方式）
  let overflowNote = '';
  if (xClip != null && overPoints.length) {
    const bx = PL + IW;
    out += '<line x1="' + bx + '" y1="' + PT + '" x2="' + bx + '" y2="' + (PT + IH) + '" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>';
    const sortedOver = [...overPoints].sort((a, b) => a.y - b.y);
    sortedOver.forEach((p, i) => {
      const cy = Math.max(PT + 3, Math.min(PT + IH - 3, sy(p.y)));
      const oy = cy + (i - (sortedOver.length - 1) / 2) * 12;
      const isCurrent = p.ticker === currentTicker;
      const col = isCurrent ? '#c4d0ff' : '#94a3b8';
      const triFs = isCurrent ? 13 : 10;
      const tip = p.ticker + '\n' + yLabel.replace(' →', '') + ': ' + p.y.toFixed(2) + '\n' + xLabel.replace(' →', '') + ': ' + p.x.toFixed(1) + '（+' + xClip + '%超）';
      if (!isCurrent) out += '<a href="stock.html?ticker=' + p.ticker + '" style="cursor:pointer;">';
      out += '<g><title>' + tip + '</title>';
      out += '<text x="' + (bx - 2) + '" y="' + (oy + 3).toFixed(1) + '" text-anchor="end" font-size="' + triFs + '" fill="' + col + '" opacity="0.9">▶</text>';
      if (isCurrent) {
        const tw = p.ticker.length * 5 + 4;
        out += '<rect x="' + (bx - 14 - tw) + '" y="' + (oy - 15) + '" width="' + tw + '" height="13" fill="rgba(0,0,0,0.7)" rx="2"/>';
      }
      out += '<text x="' + (bx - 12) + '" y="' + (oy - 5).toFixed(1) + '" text-anchor="end" font-size="' + fs + '" fill="' + col + '" font-family="monospace">' + p.ticker + '</text>';
      out += '</g>';
      if (!isCurrent) out += '</a>';
    });
    overflowNote = '<div style="font-size:9px;color:#64748b;padding:2px 4px 0">▶ ' + xLabel.replace(' →', '') + '+' + xClip + '%超（右端に折りたたみ表示）: '
      + sortedOver.map(p => p.ticker + '(+' + p.x.toFixed(0) + '%)').join(', ') + '</div>';
  }

  out += '</svg>';
  return out + overflowNote;
}

async function loadAndRenderMatrices() {
  try {
    const tickersRes = await fetch('data/tickers.json', { cache: 'no-cache' });
    if (!tickersRes.ok) return;
    const tickersJson = await tickersRes.json();
    const tickers = tickersJson.tickers || [];

    const latestResults = await Promise.allSettled(
      tickers.map(t => fetch('data/' + t + '/latest.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null))
    );

    let stonksData = {};
    try {
      const sr = await fetch('../stonks-silo/data/results.json', { cache: 'no-cache' });
      if (sr.ok) { const sj = await sr.json(); stonksData = sj.tickers || {}; }
    } catch (e) { console.error('[matrices] stonks fetch failed:', e); }

    const m1 = [], m2 = [], m3 = [], m4 = [];

    tickers.forEach((t, i) => {
      const d = latestResults[i].status === 'fulfilled' ? latestResults[i].value : null;
      if (!d) return;
      const upside = d.upside_percent ?? null;
      const rice = d.rice || {};
      const note = rice.note || '';
      const riceVal = rice.base?.rice ?? null;

      if (upside === null) return;

      if (rice.available && riceVal !== null && riceVal >= 0) {
        // RICE<0（計算不能・マイナス）は対数軸でプロット不可なため除外（RICE×乖離率マトリクスと同一基準）
        m1.push({ ticker: t, x: upside, y: riceVal });
      } else if (note.includes('セクター除外')) {
        const roe = d.components?.roe_10yr_avg ?? null;
        if (roe !== null) m2.push({ ticker: t, x: upside, y: roe * 100 });
      } else if (note.includes('Q異常値') || note.includes('Q計算不可')) {
        const pointType = note.includes('Q異常値') ? 'q_anomaly' : 'q_unavail';
        const sd = stonksData[t];
        const rm = sd?.runway?.runway_months ?? null;
        // runway未取得の場合は3yr（上限）をデフォルトとし、大型・資金十分扱いにする
        const runway = rm !== null ? Math.min(3, rm / 12) : 3;
        const rgObj = sd?.deficit_quality?.revenue_growth_pct || {};
        const rgKeys = Object.keys(rgObj).map(Number).sort((a, b) => b - a);
        let revGrowth = null;
        for (const k of rgKeys) { if (rgObj[k] !== null) { revGrowth = rgObj[k]; break; } }
        if (revGrowth !== null) {
          m3.push({ ticker: t, x: runway, y: Math.min(150, Math.max(-50, revGrowth)), type: pointType });
        }
      }

      // m4: FCFマージン（FCFデータがある全銘柄対象）
      // 優先順位: 1) fcf_estimation.fcf_margin, 2) components.fcf_base_used/latest_revenue
      {
        let fcfMgn = d.fcf_estimation?.fcf_margin ?? null;
        if (fcfMgn === null) {
          const fcf = d.components?.fcf_base_used ?? null;
          const rev = d.components?.latest_revenue ?? null;
          if (fcf !== null && rev !== null && rev !== 0) fcfMgn = fcf / rev * 100;
        }
        if (fcfMgn !== null && upside !== null) {
          m4.push({ ticker: t, x: upside, y: Math.min(50, fcfMgn) });
        }
      }
    });

    const grid = document.getElementById('all-matrices-grid');
    if (!grid) return;

    const panels = [
      {
        id: 1, title: '① 投資効率系（RICE算出可）',
        note: 'Y軸: RICE (base, 対数軸) | X軸: 乖離率%（+300%超は右端に折りたたみ表示）\nYThresh=1.0/3.0（低効率<1.0 / 中効率1.0-3.0 / 高効率≥3.0） XThresh=0%',
        points: m1,
        // ARCH-MATRIX-DUP-1: tanuki_score側のRICE×乖離率マトリクスと同じX_MAX_CLIP=300方式に統一
        opts: { xMin: -80, xMax: 300, xClip: 300, xThresh: 0, yMin: 0, yMax: 10, yThresh: 1, yThresh2: 3, yScale: 'log', yFloor: 0.1, xLabel: '乖離率 →', yLabel: 'RICE(log) →', fontSize: 8 },
      },
      {
        id: 2, title: '② 収益性系（セクター除外）',
        note: 'Y軸: ROE 10yr avg% | X軸: 乖離率%\nYThresh=15%（高ROE基準） XThresh=0%',
        points: m2,
        opts: { xMin: -80, xMax: 100, xThresh: 0, yMin: -20, yMax: 60, yThresh: 15, xLabel: '乖離率 →', yLabel: 'ROE% →', fontSize: 9 },
      },
      {
        id: 3, title: '③ 成長性系（赤字・Q異常）',
        note: 'Y軸: 売上成長率%(stonks-silo, cap 150%) | X軸: Runway(年,上限3)\nYThresh=20% XThresh=1年 | ●Q計算不可(赤字) ◎Q異常値(Q>5)',
        points: m3,
        opts: { xMin: 0, xMax: 3, xThresh: 1, yMin: -50, yMax: 150, yThresh: 20, xLabel: 'Runway(年) →', yLabel: '成長率% →', fontSize: 8 },
      },
      {
        id: 4, title: '④ キャッシュ創出力系（FCFマージン）',
        note: 'Y軸: FCFマージン% | X軸: 乖離率%\nYThresh=15% XThresh=0%（cap 50%）',
        points: m4,
        opts: { xMin: -80, xMax: 100, xThresh: 0, yMin: -5, yMax: 50, yThresh: 15, xLabel: '乖離率 →', yLabel: 'FCFマージン% →', svgH: 340, fontSize: 7 },
      },
    ];

    grid.innerHTML = panels.map(panel => {
      const svg = buildScatterSVG(panel.points, { ...panel.opts, currentTicker: ticker });
      const count = panel.points.length;
      return '<div class="matrix-panel">'
        + '<div class="matrix-panel-title">' + panel.title + ' <span style="font-weight:400;color:var(--mut)">(' + count + '銘柄)</span></div>'
        + '<div class="matrix-panel-note">' + panel.note.replace(/\n/g, '<br>') + '</div>'
        + svg
        + '</div>';
    }).join('');
  } catch (e) {
    console.error('[matrices] loadAndRenderMatrices failed:', e);
  }
}

async function openReportModal() {
  const ticker = new URLSearchParams(location.search).get('ticker') || '';
  if (!ticker) return;
  const overlay = document.getElementById('report-modal-overlay');
  const pre = document.getElementById('report-modal-pre');
  overlay.style.display = 'flex';
  pre.textContent = 'Loading...';
  try {
    const r = await fetch(`data/${ticker}/report.txt?t=${Date.now()}`);
    if (!r.ok) throw new Error('not found');
    pre.textContent = await r.text();
  } catch (_) {
    pre.textContent = 'レポートは次回パイプライン実行後に生成されます';
  }
}

function closeReportModal() {
  document.getElementById('report-modal-overlay').style.display = 'none';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeReportModal();
});
