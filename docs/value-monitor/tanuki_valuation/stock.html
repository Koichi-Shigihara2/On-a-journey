<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANUKI VALUATION - Stock Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg: #0a0d14;
      --sur: #111520;
      --sur2: #161c2d;
      --sur3: #1a2035;
      --bdr: #1e2840;
      --acc: #c4d0ff;
      --acc2: #8b9dff;
      --green: #4ade80;
      --grn: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --orange: #fb923c;
      --purple: #a78bfa;
      --txt: #e2e8f0;
      --mut: #94a3b8;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--txt);
      font-family: var(--sans);
      font-size: 14px;
      min-height: 100vh;
      line-height: 1.6;
    }
    .shell { max-width: 1000px; margin: 0 auto; padding: 0 24px 80px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 1px solid var(--bdr);
      position: sticky; top: 0; background: var(--bg); z-index: 100;
    }
    /* ロゴ（index.html統一） */
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--txt); }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); animation: pdot 2s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pdot { 0%,100%{box-shadow:0 0 0 0 rgba(196,208,255,.5)} 50%{box-shadow:0 0 0 6px rgba(196,208,255,0)} }
    .logo-text { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--txt); letter-spacing: .12em; display: flex; gap: 4px; }
    .logo-accent { color: var(--acc); }
    .hdr-l { display: flex; align-items: center; gap: 20px; }

    .back-link {
      font-family: var(--mono); font-size: 12px; color: var(--mut);
      text-decoration: none; display: flex; align-items: center; gap: 6px;
      border-left: 1px solid var(--bdr); padding-left: 20px;
    }
    .back-link:hover { color: var(--acc); }
    .version-tag { font-family: var(--mono); font-size: 10px; color: var(--mut); background: var(--sur); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--bdr); }
    .nav-links { display: flex; gap: 14px; flex-wrap: wrap; }
    .nav-links a { font-family: var(--mono); font-size: 11px; color: var(--mut); text-decoration: none; letter-spacing: .06em; padding: 4px 0; border-bottom: 1px solid transparent; transition: all .2s; }
    .nav-links a:hover { color: var(--acc); border-bottom-color: var(--acc); }
    .nav-links a.active { color: var(--acc); border-bottom-color: var(--acc); }

    .hero { padding: 40px 0 32px; border-bottom: 1px solid var(--bdr); }
    .ticker-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
    .ticker-symbol { font-family: var(--mono); font-size: 36px; font-weight: 700; color: var(--txt); }
    .ticker-tags { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
    .tag { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing:.05em; }
    .tag.dcf { background: rgba(196,208,255,.12); color: var(--acc); }
    .tag.fcf { background: rgba(251,191,36,.12); color: var(--yellow); }
    .tag.go { background: rgba(74,222,128,.12); color: var(--green); }
    .tag.seg { background: rgba(148,163,184,.12); color: var(--mut); }
    /* [[STOCK-HTML-CLASSIFICATION-MISSING-1]]対応（2026-08-30）: tanuki_score/index.htmlの
       badge-*配色を踏襲し、Classification（BUY/WATCH/HOLD/GROWTH_PREMIUM/TRIM/SELL/PASS）を
       stock.htmlにも表示する */
    .tag.cls-BUY  { background: rgba(34,197,94,.12);  color: #22c55e; }
    .tag.cls-WATCH{ background: rgba(234,179,8,.12);  color: #eab308; }
    .tag.cls-HOLD { background: rgba(59,130,246,.12); color: #3b82f6; }
    .tag.cls-GROWTH_PREMIUM { background: rgba(20,184,166,.12); color: #14b8a6; }
    .tag.cls-TRIM { background: rgba(249,115,22,.12); color: #f97316; }
    .tag.cls-SELL { background: rgba(239,68,68,.10);  color: #ef4444; }
    .tag.cls-PASS { background: rgba(71,85,105,.10);  color: #475569; }

    .value-display { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .value-box {
      background: var(--sur); border: 1px solid var(--bdr);
      border-radius: 12px; padding: 24px;
    }
    .value-box.primary {
      border-color: var(--acc);
      background: linear-gradient(135deg, var(--sur) 0%, var(--sur2) 100%);
    }
    .value-label { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .value-main { font-family: var(--mono); font-size: 42px; font-weight: 700; color: var(--acc); text-shadow: 0 0 30px rgba(196,208,255,.3); }
    .value-sub { font-family: var(--mono); font-size: 14px; color: var(--mut); margin-top: 8px; }
    .upside-badge {
      display: inline-block; font-family: var(--mono); font-size: 14px; font-weight: 700;
      padding: 6px 12px; border-radius: 6px; margin-top: 12px;
    }
    .upside-badge.positive { background: rgba(74, 222, 128, 0.15); color: var(--green); }
    .upside-badge.negative { background: rgba(248, 113, 113, 0.15); color: var(--red); }

    .wacc-badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 12px; color: var(--acc2);
      background: var(--sur2); padding: 6px 12px; border-radius: 6px; margin-top: 12px;
    }
    .wacc-badge .beta { color: var(--mut); font-size: 11px; }

    .sensitivity-section {
      margin-top: 32px; background: var(--sur); border: 1px solid var(--bdr);
      border-radius: 12px; padding: 24px;
    }
    .sensitivity-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
    .sensitivity-title { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--acc); letter-spacing: .05em; }

    .wacc-slider-container { display: flex; align-items: center; gap: 12px; }
    .wacc-slider-label { font-size: 12px; color: var(--mut); }
    .wacc-slider {
      width: 180px; height: 6px; -webkit-appearance: none; appearance: none;
      background: var(--sur2); border-radius: 3px; outline: none;
    }
    .wacc-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; background: var(--acc);
      border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(196,208,255,.4);
    }
    .wacc-slider-value { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--acc); min-width: 50px; }

    .sensitivity-matrix { margin-top: 16px; overflow-x: auto; }
    .matrix-table { width: 100%; border-collapse: collapse; min-width: 400px; }
    .matrix-table th, .matrix-table td {
      padding: 12px 16px; text-align: center; font-family: var(--mono); font-size: 13px;
    }
    .matrix-table th {
      background: var(--sur2); color: var(--mut); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .matrix-table th.corner { background: var(--sur); }
    .matrix-table td { background: var(--sur2); color: var(--txt); border: 1px solid var(--sur); transition: all .2s; }
    .matrix-table td.base-cell { background: var(--acc); color: var(--bg); font-weight: 700; box-shadow: 0 0 15px rgba(196,208,255,.3); }
    .matrix-table td.cheap { background: rgba(74, 222, 128, 0.2); color: var(--green); }
    .matrix-table td.expensive { background: rgba(248, 113, 113, 0.2); color: var(--red); }
    .matrix-table .row-label { text-align: right; background: var(--sur); color: var(--mut); font-size: 11px; }

    .matrix-legend { display: flex; justify-content: center; gap: 24px; margin-top: 16px; font-size: 12px; color: var(--mut); flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-color { width: 16px; height: 16px; border-radius: 4px; }
    .legend-color.cheap { background: rgba(74, 222, 128, 0.3); }
    .legend-color.base { background: var(--acc); }
    .legend-color.expensive { background: rgba(248, 113, 113, 0.3); }

    /* 将来価値予測テーブル（シナリオ統合版） */
    .future-section { margin-top: 24px; }
    .future-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .future-table th { background: var(--sur2); color: var(--mut); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px; text-align: center; border: 1px solid var(--bdr); }
    .future-table th.scenario-header { text-align: left; min-width: 130px; }
    .future-table td { padding: 12px 14px; text-align: center; border: 1px solid var(--bdr);
      font-family: var(--mono); font-size: 14px; color: var(--txt); background: var(--sur); }
    .future-table td.scenario-name { text-align: left; font-size: 11px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; background: var(--sur2); }
    .future-table td.scenario-name.bear { color: var(--red); }
    .future-table td.scenario-name.base { color: var(--acc); }
    .future-table td.scenario-name.bull { color: var(--green); }
    .future-table td.current-val { font-weight: 700; color: var(--txt); background: var(--sur2); }
    .future-table tr.base-row td { background: rgba(196,208,255,0.06); }

    .calc-section { margin-top: 40px; }
    .section-title {
      font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--acc);
      letter-spacing: .1em; margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--bdr); }

    .calc-flow { display: flex; flex-direction: column; gap: 16px; }
    .calc-step { background: var(--sur); border: 1px solid var(--bdr); border-radius: 8px; overflow: hidden; }
    .calc-step-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; cursor: pointer; transition: background .2s; }
    .calc-step-header:hover { background: var(--sur2); }
    .calc-step-title { display: flex; align-items: center; gap: 12px; }
    .step-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--acc); background: var(--sur2); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .step-name { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--txt); }
    .step-result { font-family: var(--mono); font-size: 14px; color: var(--acc); }
    .calc-step-body { padding: 0 20px 20px; display: none; }

    /* Layer headers */
    .layer-header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; margin: 24px 0 8px;
      border-radius: 6px; border-left: 3px solid;
    }
    .layer-fact { background: rgba(99,179,237,0.08); border-color: var(--acc); }
    .layer-expect { background: rgba(246,173,85,0.08); border-color: var(--yellow); }
    .layer-ref { background: rgba(113,128,150,0.08); border-color: var(--mut); }
    .layer-label {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 3px; background: rgba(255,255,255,0.1);
      color: var(--mut);
    }
    .layer-title { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--txt); }
    .layer-desc { font-size: 11px; color: var(--mut); }

    .calc-step.open .calc-step-body { display: block; }
    .calc-step.open .calc-step-header { border-bottom: 1px solid var(--bdr); }

    .formula-box { background: var(--sur2); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .formula-box code { font-family: var(--mono); font-size: 12px; color: var(--acc); display: block; margin-bottom: 12px; }
    .formula-desc { font-size: 13px; color: var(--mut); line-height: 1.7; }

    .inputs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    .input-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--sur2); border-radius: 6px; }
    .input-label { font-size: 12px; color: var(--mut); }
    .input-value { font-family: var(--mono); font-size: 13px; color: var(--txt); }
    .input-value.highlight { color: var(--acc); font-weight: 700; }

    /* v6.2: 成長オプション表示 */
    .go-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .go-item { background: var(--sur2); border-radius: 6px; padding: 12px 14px; border-left: 3px solid var(--green); }
    .go-item-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .go-item-name { font-family: var(--mono); font-size: 13px; color: var(--txt); font-weight: 700; }
    .go-item-pv { font-family: var(--mono); font-size: 13px; color: var(--green); }
    .go-item-params { font-size: 11px; color: var(--mut); font-family: var(--mono); }
    .go-item-note { font-size: 11px; color: var(--mut); margin-top: 4px; line-height: 1.5; }

    /* v6.2: 3段階DCF Phase表示 */
    .phase-row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
    .phase-card { flex:1; min-width:140px; background:var(--sur2); border-radius:6px; padding:12px 14px; border-top: 3px solid var(--acc); }
    .phase-card.p1 { border-top-color: var(--green); }
    .phase-card.p2 { border-top-color: var(--yellow); }
    .phase-card.tv { border-top-color: var(--purple); }
    .phase-label { font-family: var(--mono); font-size: 10px; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
    .phase-detail { font-family: var(--mono); font-size: 11px; color: var(--mut); margin-top: 2px; }
    .phase-value { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--txt); margin-top: 6px; }

    .chart-container { margin-top: 40px; }
    #valuation-chart { width: 100%; height: 320px; background: var(--sur); border: 1px solid var(--bdr); border-radius: 8px; }

    footer { margin-top: 60px; padding: 24px 0; border-top: 1px solid var(--bdr); font-size: 12px; color: var(--mut); text-align: center; }

    .toggle-arrow { font-size: 10px; color: var(--mut); transition: transform .2s; }

    /* Layer2 ON/OFFトグル */
    .layer2-controls {
      display: flex; gap: 16px; align-items: center;
      padding: 10px 16px; margin: 0 0 8px;
      background: rgba(246,173,85,0.05); border-radius: 6px;
    }
    .layer2-controls label { font-size: 12px; color: var(--mut); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .layer2-controls input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--yellow); cursor: pointer; }
    .layer2-controls span.ctl-label { font-family: var(--mono); font-size: 11px; color: var(--txt); }
    .toggle-arrow { transform: rotate(180deg); }
    .calc-step.open .toggle-arrow { transform: rotate(0deg); }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 16px; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--sur2); border-top-color: var(--acc); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box { background: rgba(248, 113, 113, 0.1); border: 1px solid var(--red); border-radius: 8px; padding: 24px; text-align: center; }
    .error-title { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--red); margin-bottom: 8px; }

    @media (max-width: 768px) {
      .value-display, .inputs-grid { grid-template-columns: 1fr; }
      .future-table { font-size: 12px; }
      .wacc-slider-container { flex-direction: column; align-items: flex-start; }
      .wacc-slider { width: 100%; }
      #valMetricsRow { grid-template-columns: 1fr !important; }
    }

    /* ── 3マトリクス並列表示 ── */
    .matrix-panel-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 900px) {
      .matrix-panel-row { grid-template-columns: 1fr; }
    }
    .matrix-panel {
      background: var(--card, #0d1117);
      border: 1px solid #1e2840;
      border-radius: 8px;
      padding: 16px;
    }
    .matrix-panel-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--txt, #e8edf5);
      margin-bottom: 6px;
    }
    .matrix-panel-note {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--mut);
      margin-bottom: 10px;
      line-height: 1.5;
    }
  </style>
  <link rel="stylesheet" href="../../common/site-theme.css">
</head>
<body data-tool="tanuki">
<div class="shell" id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <span style="color:var(--mut)">Loading valuation data...</span>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const ticker = params.get('ticker') || 'NVDA';

let globalData = null;
let companyNames = {};

const fmt = (n) => n?.toFixed(2) ?? '—';
const fmtInt = (n) => n?.toLocaleString() ?? '—';
const fmtPct = (n) => n != null ? (n * 100).toFixed(1) + '%' : '—';
const fmtPct2 = (n) => n != null ? (n * 100).toFixed(2) + '%' : '—';

function translateAiConcerns(text) {
  if (!text) return text;
  return text
    .replace(/\bdisproportionately small\b/gi, '相対的に過小')
    .replace(/\bexplained by design differences\b/gi, '設計上の差異による')
    .replace(/\bmismatch(?:es)?\b/gi, '不一致')
    .replace(/\banomal(?:y|ies)\b/gi, '異常値')
    .replace(/\bpotential\b/gi, '可能性あり')
    .replace(/\bindicates?\b/gi, '示唆')
    .replace(/\boverall\b/gi, '全体的に')
    .replace(/\bvalues? like\b/gi, '値（例:')
    .replace(/\bcompared to\b/gi, 'と比較して')
    .replace(/\bthough\b/gi, 'ただし')
    .replace(/\bseems?\b/gi, 'と見られる');
}
const fmtB = (n) => {
  if (n == null) return '—';
  if (n < 0) return '-' + fmtB(-n);   // マイナス対応
  if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(2) + 'K';
  return '$' + fmtInt(Math.round(n));
};

async function loadCfData(d) {
  try {
    const url = `/On-a-journey/common/sec_data/normalized/${ticker}_quarterly_normalized.json`;
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error('quarterly not found');
    const json = await res.json();
    const fields = json.fields;
    if (!fields) throw new Error('no fields');

    function getQ(key) {
      return (fields[key] || [])
        .filter(e => e.is_annual === false)
        .sort((a, b) => a.end.localeCompare(b.end))
        .slice(-8);
    }

    const ocfArr   = getQ('OCF');
    const capexArr = getQ('CapEx');
    const revArr   = getQ('Revenue');
    const sbcArr   = getQ('SBC');
    const daArr    = getQ('DA');

    if (ocfArr.length === 0) throw new Error('no quarterly OCF data');

    const endSet = [...new Set(ocfArr.map(e => e.end))];

    function valByEnd(arr, end) {
      const e = arr.find(x => x.end === end);
      return e ? e.val : null;
    }

    const records = endSet.map(end => ({
      end,
      label:   end.slice(0, 7),
      OCF:     valByEnd(ocfArr,   end),
      CapEx:   valByEnd(capexArr, end),
      Revenue: valByEnd(revArr,   end),
      SBC:     valByEnd(sbcArr,   end),
      DA:      valByEnd(daArr,    end),
    }));

    renderCfCharts(records);
  } catch (e) {
    renderCfFallback(d);
  }
}

function renderCfCharts(records) {
  const section = document.getElementById('cf-waterfall-section');
  if (!section) return;

  const labels = records.map(r => r.label);
  const toB = v => v != null ? v / 1e9 : null;

  const ocf      = records.map(r => toB(r.OCF));
  const capexNeg = records.map(r => r.CapEx != null ? -toB(r.CapEx) : null);
  const fcf      = records.map(r => {
    const o = r.OCF, c = r.CapEx;
    return (o != null && c != null) ? toB(o - c) : null;
  });
  const fcfMargin = records.map(r => {
    const o = r.OCF, c = r.CapEx, rv = r.Revenue;
    return (rv > 0 && o != null && c != null) ? ((o - c) / rv * 100) : null;
  });
  const sbcPct = records.map(r => {
    const s = r.SBC, rv = r.Revenue;
    return (rv > 0 && s != null) ? (s / rv * 100) : null;
  });
  const daPct = records.map(r => {
    const da = r.DA, rv = r.Revenue;
    return (rv > 0 && da != null) ? (da / rv * 100) : null;
  });

  // TTM FCF（直近4四半期合計）でFCF赤字判定
  const ttmFcf = fcf.slice(-4).reduce((sum, v) => sum + (v ?? 0), 0);
  const fcfNegative = ttmFcf < 0;

  // SBC比率が100%超の四半期があるか判定

  const darkBase = {
    paper_bgcolor: '#111520',
    plot_bgcolor: '#111520',
    font: { family: 'Space Mono', color: '#94a3b8', size: 11 },
    margin: { t: 48, b: 64, l: 70, r: 24 },
    showlegend: true,
    xaxis: { gridcolor: '#1e2840', tickangle: -30 },
    yaxis: { gridcolor: '#1e2840' },
    legend: { orientation: 'h', y: -0.35, font: { size: 10 } },
  };
  const cfg = { displayModeBar: false, responsive: true };

  // チャート①: CF推移
  Plotly.newPlot('cf-waterfall-chart', [
    { name: 'OCF',   type: 'bar', x: labels, y: ocf,      marker: { color: '#4ade80' } },
    { name: 'CapEx', type: 'bar', x: labels, y: capexNeg, marker: { color: '#f87171' } },
    { name: 'FCF',   type: 'bar', x: labels, y: fcf,      marker: { color: '#c4d0ff' } },
  ], {
    paper_bgcolor: darkBase.paper_bgcolor,
    plot_bgcolor:  darkBase.plot_bgcolor,
    font: darkBase.font,
    margin: darkBase.margin,
    showlegend: darkBase.showlegend,
    xaxis: darkBase.xaxis,
    yaxis: { gridcolor: '#1e2840', ticksuffix: 'B' },
    legend: darkBase.legend,
    barmode: 'group',
    title: { text: 'キャッシュフロー推移（四半期）- ' + ticker, font: { color: '#94a3b8', size: 13 } },
  }, cfg);

  // チャート②: FCFマージン（FCF赤字バナー付き）
  const marginEl = document.getElementById('cf-margin-chart');
  if (fcfNegative) {
    const banner = document.createElement('div');
    banner.style.cssText = 'padding:8px 14px;background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.5);border-radius:6px;color:#f87171;font-size:12px;margin-bottom:8px';
    banner.textContent = '⚠️ FCF赤字 — 現在FCFはマイナス。CapExが営業CFを上回っています';
    marginEl.parentNode.insertBefore(banner, marginEl);
  }
  Plotly.newPlot('cf-margin-chart', [{
    name: 'FCFマージン',
    type: 'scatter',
    mode: 'lines+markers',
    x: labels,
    y: fcfMargin,
    line: { color: '#c4d0ff', width: 2 },
    marker: { size: 6, color: '#c4d0ff' },
  }], {
    paper_bgcolor: darkBase.paper_bgcolor,
    plot_bgcolor:  darkBase.plot_bgcolor,
    font: darkBase.font,
    margin: darkBase.margin,
    showlegend: darkBase.showlegend,
    xaxis: darkBase.xaxis,
    yaxis: {
      gridcolor: '#1e2840',
      ticksuffix: '%',
      title: fcfNegative ? { text: 'マイナス = FCF赤字', font: { color: '#f87171', size: 10 } } : {},
    },
    legend: darkBase.legend,
    title: { text: 'FCFマージン推移（%）- ' + ticker, font: { color: '#94a3b8', size: 13 } },
  }, cfg);

  // チャート③: SBC・D&A比率（上限キャップ・注記付き）
  const qualityEl = document.getElementById('cf-quality-chart');
  if (sbcOver100) {
    const note = document.createElement('div');
    note.style.cssText = 'padding:4px 14px 8px;color:#94a3b8;font-size:11px';
    note.textContent = '※ 売上規模に対してSBCが極めて大きい（成長初期企業）';
    qualityEl.parentNode.insertBefore(note, qualityEl);
  }
  Plotly.newPlot('cf-quality-chart', [
    { name: 'SBC比率', type: 'bar', x: labels, y: sbcPct, marker: { color: '#a78bfa' } },
    { name: 'D&A比率', type: 'bar', x: labels, y: daPct,  marker: { color: '#fb923c' } },
  ], {
    paper_bgcolor: darkBase.paper_bgcolor,
    plot_bgcolor:  darkBase.plot_bgcolor,
    font: darkBase.font,
    margin: darkBase.margin,
    showlegend: darkBase.showlegend,
    xaxis: darkBase.xaxis,

      ? { gridcolor: '#1e2840', ticksuffix: '%', range: [0, 200] }
      : { gridcolor: '#1e2840', ticksuffix: '%' },

    entries = await res.json();
  } catch (e) { return; }
  if (!entries || entries.length === 0) return;

  const section = document.getElementById('hype-history-section');
  if (section) section.style.display = '';

  const recent = entries.slice(-5).reverse();
  const fmtV = (v, suffix = '') => v == null ? '—' : `${v}${suffix}`;
  const fmtPctV = (v) => v == null ? '—' : `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`;
  const fmtPriceV = (v) => v == null ? '—' : `$${v.toFixed(2)}`;
  const fmtRatioV = (v) => v == null ? '—' : `${v.toFixed(3)}x`;

  const rows = recent.map(e => `<tr>
    <td style="font-family:var(--mono);color:var(--mut);font-size:11px">${e.date}</td>
    <td>${fmtV(e.lifecycle)}</td>
    <td style="font-family:var(--mono)">${fmtV(e.stage)}</td>
    <td>${fmtV(e.phase)}</td>
    <td>${fmtV(e.recommendation)}</td>
    <td style="font-family:var(--mono)">${fmtPriceV(e.price)}</td>
    <td style="font-family:var(--mono)">${fmtRatioV(e.price_iv_ratio)}</td>
    <td style="font-family:var(--mono)">${fmtPctV(e.rev_yoy)}</td>
    <td style="font-family:var(--mono)">${fmtV(e.rule40)}</td>
    <td style="font-family:var(--mono)">${fmtPctV(e.ma200_dev)}</td>
    <td style="font-family:var(--mono)">${fmtPctV(e.from_peak)}</td>
  </tr>`).join('');

  const body = document.getElementById('hype-history-body');
  if (body) body.innerHTML =
    `<div style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:8px">直近${recent.length}件（新しい順）</div>`
    + `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">`
    + `<thead><tr style="color:var(--mut);border-bottom:1px solid var(--bdr);text-align:left">`
    + `<th style="padding:4px 6px">日付</th><th>ライフサイクル</th><th>ステージ</th><th>フェーズ</th>`
    + `<th>推奨</th><th>株価</th><th>株価÷IV</th><th>売上YoY</th><th>Rule40</th><th>MA200乖離</th><th>高値比</th>`
    + `</tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function loadAndRenderHypeSignal() {
  const el = document.getElementById('hype-signal-row');
  if (!el) return;
  const d = globalData;
  const rv = d.rice?.base?.rice;
  const uv = d.upside_percent;
  if (rv == null || uv == null) return;
  const isH = rv >= 2.0, isU = uv >= 0;
  const quadrant = isU && isH ? 1 : !isU && isH ? 2 : isU && !isH ? 3 : 4;
  let stage = null, stageLabel = '';
  let expScoreCurrent = null, expPercentile = null, expScoreCount = 0;
  try {
    const pocRes = await fetch(`../../value-monitor/hypecore/data/${ticker}_poc.json`, { cache: 'no-cache' });
    if (pocRes.ok) {
      const poc = await pocRes.json();
      const monthly = poc.monthly || [];
      const last = monthly[monthly.length - 1];
      if (last) {
        stage = last.stage;
        stageLabel = last.stage_label || '';
        expScoreCurrent = last.expectation_score ?? null;
      }
      if (expScoreCurrent != null && monthly.length > 0) {
        const allScores = monthly.map(m => m.expectation_score).filter(s => s != null);
        expScoreCount = allScores.length;
        const below = allScores.filter(s => s <= expScoreCurrent).length;
        expPercentile = Math.round(below / allScores.length * 100);
      }
    }
  } catch(e) {}
  let signalEmoji, signalText, signalColor;
  if      (quadrant === 1 && stage === 2) { signalEmoji = '🟢'; signalText = '最優先候補（高効率×割安×成長期）';    signalColor = 'var(--green)'; }
  else if (quadrant === 1 && stage === 1) { signalEmoji = '🟡'; signalText = '高リスク高リターン（高効率×割安×黎明期）'; signalColor = 'var(--yellow)'; }
  else if (quadrant === 1 && stage === 3) { signalEmoji = '🟡'; signalText = '成熟優良株（高効率×割安×成熟期）';    signalColor = 'var(--yellow)'; }
  else if (quadrant === 2 && stage === 2) { signalEmoji = '🟠'; signalText = '押し目待ち（高効率×割高×成長期）';    signalColor = '#fb923c'; }
  else if (quadrant === 3 && stage === 2) { signalEmoji = '🔵'; signalText = '割安成長（低効率×割安×成長期）';     signalColor = '#60a5fa'; }
  else                                    { signalEmoji = '⚪'; signalText = '様子見';                       signalColor = 'var(--mut)'; }
  const stageDisp = stage ? ` <span style="font-size:10px;color:var(--mut);font-family:var(--mono)">[Phase${stage}: ${stageLabel}]</span>` : '';
  const expColor = expPercentile == null ? 'var(--mut)'
    : expPercentile >= 80 ? 'var(--red)'
    : expPercentile >= 50 ? '#fb923c'
    : expPercentile >= 20 ? 'var(--mut)'
    : 'var(--green)';
  const expSign = (expScoreCurrent != null && expScoreCurrent >= 0) ? '+' : '';
  const expLine = (expScoreCurrent != null && expPercentile != null)
    ? '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;margin-top:4px;background:rgba(255,255,255,0.02);border:1px solid var(--bdr);border-radius:6px;">'
    + '<span style="font-size:11px;color:var(--mut);font-family:var(--mono);letter-spacing:.04em">期待プレミアム</span>'
    + '<span style="font-size:12px;color:var(--txt)">現在: <span style="font-family:var(--mono);color:' + expColor + '">' + expSign + expScoreCurrent.toFixed(3) + '</span>'
    + '<span style="font-size:10px;color:var(--mut)"> | 過去' + expScoreCount + 'ヶ月中 </span>'
    + '<span style="font-family:var(--mono);font-weight:700;color:' + expColor + '">' + expPercentile + '%ile</span>'
    + '</span></div>'
    : '';
  el.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--bdr);border-radius:6px;">' +
    '<span style="font-size:11px;color:var(--mut);font-family:var(--mono);letter-spacing:.04em">MATRIX×HYPE</span>' +
    '<span style="font-size:12px;font-weight:700;color:' + signalColor + '">' + signalEmoji + '&nbsp;' + signalText + stageDisp + '</span>' +
    '</div>' + expLine;
}

function render(d) {
  const ivps = d.intrinsic_value_per_share || 0;
  // v7.3: 3種類の割引率による理論株価
  // メイン: ivps = Rmβなし（10%）← intrinsic_value_per_share
  const ivpsBeta = d.intrinsic_value_beta || 0;  // 参考①: β込みWACC
  const ivpsRf = d.intrinsic_value_rf || 0;      // 参考②: Rf理論上限
  const upsideRf = d.upside_percent_rf || 0;
  const upsieBeta = d.upside_percent_beta || 0;
  const currentPrice = d.components?.current_price || 0;
  const upside = d.upside_percent || 0;
  const calcDate = d.calculation_date || '—';
  const formula = d.formula || 'Koichi式 v6.2';

  // STEP11表示用V0はRM基準（WACC=Rm=10%）のV0を使用（メイン理論株価と整合）
  const v0 = d.dcf_components?.v0_rm || d.v0 || 0;
  const alpha = d.alpha || 0;
  const alphaWasCapped = d.alpha_was_capped || false;
  const alphaUncapped = d.components?.alpha_uncapped || alpha;

  // v6.2: DCFタイプに応じたPV取得
  const dcfType = d.dcf_type || 'two_stage';
  const dcfC = d.dcf_components || {};
  const pvHigh = d.components?.pv_high || 0;
  const pvTerminal = d.components?.pv_terminal || 0;
  const pvPhase1 = dcfC.pv_phase1 || 0;
  const pvPhase2 = dcfC.pv_phase2 || 0;

  // v6.2: FCFベース判定
  const fcfBase = d.fcf_base || {};
  const fcfBaseMethod = fcfBase.method || d.components?.fcf_base_method || 'avg_5yr';
  const fcfBaseUsed = fcfBase.base_fcf || d.components?.fcf_base_used || 0;
  const fcf5yr = fcfBase.fcf_5yr_avg ?? d.components?.fcf_5yr_avg ?? 0;
  const fcf2yr = fcfBase.fcf_2yr_avg ?? d.components?.fcf_2yr_avg ?? 0;
  const fcfRatio = fcfBase.ratio || 0;   // 後方互換（旧ratio）
  const fcfCv    = fcfBase.cv    ?? fcfBase.ratio ?? 0;  // v6.3: CV値

  // v6.2: 成長オプション
  const growthOptions = d.growth_options || { total_pv: 0, count: 0, options: [] };
  const goPv = growthOptions.total_pv || 0;
  const goCount = growthOptions.count || 0;

  // v7.1: FCF外れ値分析
  const fcfOutlier = d.fcf_outlier || {};

  // v7.2: FCF実力推定
  const fcfEstimation = d.fcf_estimation || {};
  const fcfEstApplied = fcfEstimation.applied || false;
  const fcfEstRawFcf = fcfEstimation.raw_fcf || 0;
  const fcfEstEstimated = fcfEstimation.estimated_fcf || 0;
  const fcfEstAdjNi = fcfEstimation.adj_net_income || 0;
  const fcfEstConvRate = fcfEstimation.conversion_rate || 0;
  const fcfEstRatio = fcfEstimation.divergence_ratio || 1.0;
  const fcfEstWarning = fcfEstimation.divergence_warning || "";
  const fcfEstNote = fcfEstimation.note || "";
  // FCF-EST-NOTE-DISPLAY-1: 「買収・統合関連」加算の控除・検出額
  // （CWAN-SNPS-MA-DISTORTION-1・FCF-EST-DIRECTION-GUARD-1・
  // FCF-EST-NET-BASIS-FIX-1で計算済み。固定リスト方式は使わず、
  // latest.jsonの既存フィールドを直接参照する）
  const fcfEstMaExcluded = fcfEstimation.ma_addback_excluded || 0;
  const fcfEstMaSkipped = fcfEstimation.ma_addback_detected_but_not_applied || 0;
  const fcfOutlierDetected = fcfOutlier.detected || false;
  const fcfOutlierRule = fcfOutlier.rule || "none";
  const fcfOutlierNote = fcfOutlier.note || "";
  const fcfOutlierAction = fcfOutlier.action || "none";
  const fcfOutlierTransientFound = (fcfOutlier.transient_evidence || {}).found || false;
  const fcfOutlierTransientTotal = (fcfOutlier.transient_evidence || {}).total_transient_amount || 0;
  const fcfOutlierItems = (fcfOutlier.transient_evidence || {}).items || [];
  const fcfOutlierFY = fcfOutlier.fiscal_year || "";
  const fcfOutlierValue = fcfOutlier.fcf_value || 0;

  // v7.0: BS評価補正
  const bsAdj = d.bs_adjustment || {};
  const bsNetCash = bsAdj.net_cash || 0;
  const bsNetCashPerShare = bsAdj.net_cash_per_share || 0;
  const bsApplied = bsAdj.applied || false;
  const bsCash = bsAdj.cash || 0;
  const bsStInv = bsAdj.short_term_investments || 0;
  const bsLtDebt = bsAdj.long_term_debt || 0;
  const bsStDebt = bsAdj.short_term_debt || 0;
  const bsFY = bsAdj.fiscal_year || '';

  // RICE（投資効率指標）
  const rice = d.rice || {};
  const riceAvailable = rice.available || false;
  const riceBase = rice.base || {};
  const riceBear = rice.bear || {};
  const riceBull = rice.bull || {};
  const riceNote = rice.note || '';
  const riceWarnings = rice.warnings || false;

  // validation
  const validation = d.validation || {};
  const aiConcerns = validation.ai_concerns || '';
  const validationOverall = validation.overall || '';
  const validationModel = validation.model || '';
  const showAiConcerns = aiConcerns && validationModel !== 'basic_checks_only';

  // v6.2: 成熟プロファイル
  const maturity = d.maturity_profile;

  const highGrowthRate = d.components?.high_growth_rate_used || 0;
  // 高成長期間: 3段階DCFはPhase1の実際年数、2段階DCFはhigh_growth_years
  const highGrowthYears = (d.maturity_profile?.phase1?.years) || d.components?.high_growth_years || 5;
  const terminalGrowth = d.components?.terminal_growth_used || 0.03;
  const roeAvg = d.components?.roe_used || 0;
  const dilutedShares = d.components?.diluted_shares || 0;
  const sectorName   = d.components?.sector   || '';
  const industryName = d.components?.industry  || '';

  // FCF信頼性が低い業種の判定
  const FCF_LOW_RELIABILITY_SECTORS   = ['Financial Services', 'Utilities'];
  const FCF_LOW_RELIABILITY_INDUSTRIES= ['Healthcare Plans'];
  const fcfLowReliability = FCF_LOW_RELIABILITY_SECTORS.includes(sectorName)
    || FCF_LOW_RELIABILITY_INDUSTRIES.includes(industryName);
  const fcfLowReliabilityMsg = fcfLowReliability ? (() => {
    if (industryName === 'Healthcare Plans')
      return '保険会社のOCFには将来の保険金支払義務（負債増加）が含まれるため、FCFが実態より大きく見えます。理論株価の信頼性が低い可能性があります。';
    if (sectorName === 'Financial Services')
      return '金融・Fintechのキャッシュフローは貸付金の増減がOCFに影響するため、FCFベースのDCFが実態を反映しにくい場合があります。';
    if (sectorName === 'Utilities')
      return '公益事業は設備投資が巨大でFCFが慢性的にマイナスになりやすく、DCFの前提が成立しにくい場合があります。';
    return '';
  })() : '';

  // FCF-CONVRATE②（TRUST-SUMMARY-EPIC-1）: 業種平均比率による固定比率設計は
  // サイクル変動銘柄（年度ごとにFCF実力推定と生FCFの乖離倍率が大きく振れる銘柄）を
  // 表現できない構造的限界がある。閾値（cv・divergence_ratio）による自動判定は、
  // 事前調査でLLYがDOCNを両軸で上回るなど数学的に分離不可能と判明したため、
  // 個別ティッカーの手動リストとする（自動化しない）。将来3件目以降を追加する場合も、
  // 業界サイクル起因かどうかの個別原因分析を経てから手動追加すること。
  const FCF_CYCLICAL_VOLATILITY_TICKERS = new Set(['SITM', 'LITE']);
  // TRUST-SUMMARY-EPIC-1②表示不一致バグ修正（2026-09-02）: 警告文言は
  // 「業種平均比率による推定値と実際の乖離」というFCF_Conversion_Rate方式
  // 固有の説明であり、fcf_estimation.applied=False（生FCFフォールバック
  // 採用でconversion_rate方式自体が使われていない）の間は警告内容が実態と
  // 一致しなくなる。report.txt側（pipeline.py）と同じ条件
  // （`not fcf_est.get("applied", True)`の否定＝appliedが明示的にFalseで
  // ない場合のみ表示）に統一する。
  const fcfCyclicalVolatility = FCF_CYCLICAL_VOLATILITY_TICKERS.has(ticker) && fcfEstimation.applied !== false;
  const fcfCyclicalDivergenceRatio = fcfEstimation.divergence_ratio;

  // FCF-CONVRATE①（TRUST-SUMMARY-EPIC-1）: セクターがsector_conversion_rates
  // に未収録のため、業種別の較正済みレートではなく汎用デフォルト値（0.70）が

                   <p class="formula-desc">β込みWACC基準のDCF（参考値）。高成長期→移行期→永続成長の3段階で鈍化カーブを表現。<br><span style="color:var(--yellow);font-size:11px">※ STEP9のV₀はRM基準（βなし10%）で再計算した値を使用。</span></p>`

                   <p class="formula-desc">β込みWACC基準のDCF（参考値）。<br><span style="color:var(--yellow);font-size:11px">※ STEP9のV₀はRM基準（βなし10%）で再計算した値を使用。</span></p>`}
            </div>

            ${dcfType === 'three_stage' && maturity ? `
            <div class="phase-row">
              <div class="phase-card p1">
                <div class="phase-label">Phase 1（高成長）</div>
                <div style="font-size:9px;color:var(--mut);margin-top:1px">β込みWACC基準（参考）</div>
                <div class="phase-detail">${maturity.phase1?.years || 0}年 @ ${fmtPct(maturity.phase1?.growth ?? growthRate)}</div>
                <div class="phase-value">${fmtB(pvPhase1)}</div>
              </div>
              <div class="phase-card p2">
                <div class="phase-label">Phase 2（移行期）</div>
                <div style="font-size:9px;color:var(--mut);margin-top:1px">β込みWACC基準（参考）</div>
                <div class="phase-detail">${maturity.phase2?.years || 0}年 @ ${fmtPct(maturity.phase2?.growth)}</div>
                <div class="phase-value">${fmtB(pvPhase2)}</div>
              </div>
              <div class="phase-card tv">
                <div class="phase-label">Terminal（永続）</div>
                <div style="font-size:9px;color:var(--mut);margin-top:1px">β込みWACC基準（参考）</div>
                <div class="phase-detail">@ ${fmtPct(terminalGrowth)}</div>
                <div class="phase-value">${fmtB(pvTerminal)}</div>
              </div>
            </div>
            ` : `
            <div class="inputs-grid">
              <div class="input-item"><span class="input-label">FCFベース</span><span class="input-value">${fmtB(fcfBaseUsed)}</span></div>
              <div class="input-item"><span class="input-label">高成長期PV</span><span class="input-value">${fmtB(pvHigh)}</span></div>
              <div class="input-item"><span class="input-label">ターミナルPV</span><span class="input-value">${fmtB(pvTerminal)}</span></div>
              <div class="input-item"><span class="input-label">V₀（β込みWACC基準）</span><span class="input-value highlight">${fmtB(dcfC.v0 || 0)}</span></div>
            </div>
            `}
          </div>
        </div>

        <!-- Step 5: RPO補正（条件付き） -->
        ${rpo > 0 ? `
        <div class="calc-step">
          <div class="calc-step-header" onclick="toggleStep(this)">
            <div class="calc-step-title">
              <span class="step-num">${nextStep()}</span>
              <span class="step-name">RPO補正（残存履行義務）</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px">
              <span class="step-result">+${fmtB(rpoPV)}</span>
              <span class="toggle-arrow">▼</span>
            </div>
          </div>
          <div class="calc-step-body">
            <div class="formula-box">
              <code>RPO_incremental = max(0, RPO - RPO_前年 × (1 + Revenue_YoY))</code>
              <code>RPO_PV = RPO_incremental × application_rate × op_margin / (1 + 15%)^1.5</code>
              <p class="formula-desc">前年比を超えた非連続需要分のみを利益率で補正してPV化。赤字企業（op_margin≤0）はゼロ。</p>
            </div>
            <div class="inputs-grid">
              <div class="input-item"><span class="input-label">RPO（生値）</span><span class="input-value">${fmtB(rpo)}</span></div>
              <div class="input-item"><span class="input-label">非連続RPO</span><span class="input-value">${fmtB(d.rpo_adjustment?.rpo_incremental)}</span></div>
              <div class="input-item"><span class="input-label">営業利益率</span><span class="input-value">${fmtPct(d.rpo_adjustment?.op_margin)}</span></div>
              <div class="input-item"><span class="input-label">RPO現在価値</span><span class="input-value highlight">${fmtB(rpoPV)}</span></div>
            </div>
          </div>
        </div>
        ` : ''}

        <!-- Step 7: α -->
        <div class="calc-step">
          <div class="calc-step-header" onclick="toggleStep(this)">
            <div class="calc-step-title">
              <span class="step-num">${nextStep()}</span>
              <span class="step-name">α（成長期待プレミアム）${alphaWasCapped ? ' <span style="color:var(--yellow);font-size:10px">CAPPED</span>' : ''}</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px">
              <span class="step-result" style="color:var(--mut);font-size:11px" data-info="stock_moat_phase1">Phase1: ${d.components?.moat_phase1_years ?? '—'}年（Moat Score由来${d.components?.moat_score_source === 'neutral_fallback' ? '、<span style="color:var(--yellow)" title="有効指標が2未満のため中立フォールバック値（実測ではない）">※中立フォールバック</span>' : ''}）</span>
              <span class="toggle-arrow">▼</span>
            </div>
          </div>
          <div class="calc-step-body">
            <div class="formula-box">
              <code>α = min(cap, max(0, (ROE × 0.6 / Rm) × 0.7))</code>
              <p class="formula-desc">競争優位性（Moat Score）によりPhase1成長期間を自動算出。αは参照値として保持されるが、DCF計算への乗算は廃止済み（ALPHA-REDESIGN-1）。セクター別上限（Technology:0.8、mega_tech/Communication Services:1.0、Healthcare:0.7等）はMoat Score計算に使用。</p>
            </div>
            <div class="inputs-grid">
              <div class="input-item"><span class="input-label">ROE（平均）</span><span class="input-value">${fmtPct(roeAvg)}</span></div>
              <div class="input-item"><span class="input-label">Rm（市場期待リターン）</span><span class="input-value">${fmtPct2(d.wacc?.market_return || 0.10)}</span></div>
              <div class="input-item"><span class="input-label">α（cap前）</span><span class="input-value">${alphaUncapped.toFixed(4)}</span></div>
              <div class="input-item"><span class="input-label">α（cap後）</span><span class="input-value highlight">${alpha.toFixed(4)}</span></div>
            </div>
          </div>
        </div>

        <!-- Step 6: 成長オプション（条件付き） -->
        ${goCount > 0 ? `
        <div class="calc-step">
          <div class="calc-step-header" onclick="toggleStep(this)">
            <div class="calc-step-title">
              <span class="step-num">${nextStep()}</span>
              <span class="step-name">成長オプション（仮説セグメント）</span>

            <div style="display:flex;align-items:center;gap:16px">
              <span class="step-result">+${fmtB(goPv)}</span>
              <span class="toggle-arrow">▼</span>
            </div>
          </div>
          <div class="calc-step-body">
            <div class="formula-box">
              <code>期待FCF = TAM × 侵入率 × FCFマージン × 確率</code>
              <code>仮説PV = 期待FCF / (1 + 15%)^遅延年数</code>
              <p class="formula-desc">未実現の成長機会を「仮説セグメント」として定量化。TAM × 侵入率で期待売上、マージン × 確率で期待FCFを算出し、実現遅延を考慮して現在価値化。</p>

                  </div>
                  ${opt.note ? `<div class="go-item-note">${opt.note}</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
        ` : ''}

        <!-- Step: BS評価補正（条件付き） -->
        ${bsApplied ? `
        <div class="calc-step">
          <div class="calc-step-header" onclick="toggleStep(this)">
            <div class="calc-step-title">
              <span class="step-num">${nextStep()}</span>
              <span class="step-name">BS評価補正（ネットキャッシュ）</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px">
              <span class="step-result" style="color:${bsNetCashPerShare >= 0 ? 'var(--grn)' : 'var(--red)'}">
                ${bsNetCashPerShare >= 0 ? '+' : ''}${fmtB(bsNetCashPerShare)}/株
              </span>
              <span class="toggle-arrow">▼</span>
            </div>
          </div>
          <div class="calc-step-body">
            <div class="formula-box">
              <code>PT = DCF理論株価 + ネットキャッシュ/株</code>
              <code>ネットキャッシュ = (現金 + 短期投資) - (長期負債 + 短期負債)</code>
              <p class="formula-desc">
                DCFが捉えきれないバランスシート価値を反映。<br>
                純キャッシュ企業（NVDA等）はプラス補正、純負債企業はマイナス補正。
                FY${bsFY}実績ベース。
              </p>
            </div>
            <div class="inputs-grid">
              <div class="input-item"><span class="input-label">現金・現金同等物</span><span class="input-value">${fmtB(bsCash)}</span></div>
              <div class="input-item"><span class="input-label">短期投資</span><span class="input-value">${fmtB(bsStInv)}</span></div>
              <div class="input-item"><span class="input-label">長期有利子負債</span><span class="input-value">${fmtB(bsLtDebt)}</span></div>
              <div class="input-item"><span class="input-label">短期有利子負債</span><span class="input-value">${fmtB(bsStDebt)}</span></div>
              <div class="input-item"><span class="input-label">ネットキャッシュ合計</span>
                <span class="input-value highlight" style="color:${bsNetCash >= 0 ? 'var(--grn)' : 'var(--red)'}">
                  ${bsNetCash >= 0 ? '+' : ''}${fmtB(bsNetCash)}
                </span>
              </div>
              <div class="input-item"><span class="input-label">1株あたり</span>
                <span class="input-value highlight" style="color:${bsNetCashPerShare >= 0 ? 'var(--grn)' : 'var(--red)'}">
                  ${bsNetCashPerShare >= 0 ? '+' : ''}$${bsNetCashPerShare.toFixed(2)}
                </span>
              </div>
            </div>
          </div>
        </div>
        ` : ''}

        <!-- Step 8: P_t -->
        <div class="calc-step">
          <div class="calc-step-header" onclick="toggleStep(this)">
            <div class="calc-step-title">
              <span class="step-num">${nextStep()}</span>
              <span class="step-name">本質的価値（P_t）算出</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px">
              <span class="step-result">$${fmt(ivps)}</span>
              <span class="toggle-arrow">▼</span>
            </div>
          </div>
          <div class="calc-step-body">
            <div class="formula-box">
              <code>P_t = V₀ / 株式数 + RPO_PV / 株式数 + GrowthOption_PV / 株式数 + BS補正/株</code>
              <p class="formula-desc">RPO_PVは確定受注として加算。競争優位性はMoat Score経由でPhase1成長期間（N年）に反映済み。α乗算は廃止（ALPHA-REDESIGN-1）。</p>
            </div>
            <div class="inputs-grid">
              <div class="input-item"><span class="input-label">V₀</span><span class="input-value">${fmtB(v0)}</span></div>
              <div class="input-item"><span class="input-label">RPO_PV</span><span class="input-value">${fmtB(rpoPV)}</span></div>
              <div class="input-item"><span class="input-label">GrowthOption_PV</span><span class="input-value">${fmtB(goPv)}</span></div>
              <div class="input-item"><span class="input-label">希薄化後株式数</span><span class="input-value">${fmtInt(dilutedShares)}</span></div>
              <div class="input-item"><span class="input-label">P_t（企業価値）</span><span class="input-value">${fmtB(v0 + rpoPV + goPv)}</span></div>
              <div class="input-item"><span class="input-label">BS補正/株</span><span class="input-value">${bsNetCashPerShare >= 0 ? '+' : ''}$${fmt(bsNetCashPerShare)}</span></div>
              <div class="input-item"><span class="input-label">1株当り</span><span class="input-value highlight">$${fmt(ivps)}</span></div>
            </div>
          </div>
        </div>

        <!-- ═══ Layer 2: 市場心理・行動経済学的要因 ═══ -->
        <div class="layer-header layer-expect">
          <span class="layer-label">Layer 2</span>
          <span class="layer-title">市場心理・行動経済学的要因</span>
          <span class="layer-desc">モメンタム・センチメント等の非合理的価格要因（将来実装予定）</span>
        </div>
        <div style="padding:10px 16px;color:var(--mut);font-size:12px;font-family:var(--mono);">
          ── 現時点では未実装 ──
        </div>
        <!-- ═══ 参考: 市場リスク調整 ═══ -->
        <div class="layer-header layer-ref">
          <span class="layer-label">参考</span>
          <span class="layer-title">市場リスク調整（β込み）</span>
          <span class="layer-desc">β込みWACCによる市場評価との対比（参考値）</span>
        </div>
        <!-- Step 1: WACC -->
        <div class="calc-step">
          <div class="calc-step-header" onclick="toggleStep(this)">
            <div class="calc-step-title">
              <span class="step-num">${nextStep()}</span>
              <span class="step-name">動的WACC計算（CAPM）</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px">
              <span class="step-result">${fmtPct2(waccValue)}</span>
              <span class="toggle-arrow">▼</span>
            </div>
          </div>
          <div class="calc-step-body">
            <div class="formula-box">
              <code>WACC = Rf + β × (Rm - Rf)</code>
              <p class="formula-desc">CAPMで銘柄固有のリスク（β）を反映した割引率を計算。</p>
            </div>
            <div class="inputs-grid">
              <div class="input-item"><span class="input-label">Rf（リスクフリー）</span><span class="input-value">${fmtPct(riskFreeRate)}</span></div>
              <div class="input-item"><span class="input-label">Rm（市場期待）</span><span class="input-value">${fmtPct(marketReturn)}</span></div>
              <div class="input-item"><span class="input-label">β</span><span class="input-value">${beta.toFixed(2)}</span></div>
              <div class="input-item"><span class="input-label">WACC</span><span class="input-value highlight">${fmtPct2(waccValue)}</span></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="chart-container" id="history-chart-section" style="display:none">
      <h2 class="section-title">理論株価 時系列</h2>
      <div id="history-chart" style="width:100%;height:340px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;"></div>
    </div>

    <div class="chart-container">
      <h2 class="section-title">VALUATION COMPONENTS</h2>
      <div id="valuation-chart"></div>
    </div>

    <!-- FCF過去5年バーチャート -->
    ${(() => {
      const hist = d.fcf_history;
      if (!hist || hist.length === 0) return '';
      const vals = hist.map(h => h.fcf);
      const allNull = vals.every(v => v == null);
      if (allNull) return '';
      const maxAbs = Math.max(...vals.filter(v=>v!=null).map(v=>Math.abs(v)), 1);
      const W = 520, H = 120, PAD = 10, BAR_AREA_H = 80, LABEL_H = 16;
      const n = hist.length;
      const barW = Math.floor((W - PAD * 2) / n) - 4;
      const zeroY = PAD + BAR_AREA_H * 0.7;
      let bars = '';
      hist.forEach((h, i) => {
        const fcf = h.fcf;
        const x = PAD + i * ((W - PAD * 2) / n) + 2;
        const col = fcf == null ? '#334155' : fcf >= 0 ? '#4ade80' : '#f87171';
        const barH = fcf != null ? Math.max(2, Math.abs(fcf) / maxAbs * (BAR_AREA_H * 0.65)) : 4;
        const barY = fcf != null ? (fcf >= 0 ? zeroY - barH : zeroY) : zeroY - 2;
        const valStr = fcf == null ? 'N/A' : Math.abs(fcf) >= 1e9 ? `${fcf>=0?'':'-'}$${(Math.abs(fcf)/1e9).toFixed(0)}B` : `${fcf>=0?'':'-'}$${(Math.abs(fcf)/1e6).toFixed(0)}M`;
        bars += `<rect x="${x}" y="${barY}" width="${barW}" height="${barH}" fill="${col}" opacity="0.85" rx="2"/>`;
        bars += `<text x="${x+barW/2}" y="${fcf!=null&&fcf>=0?barY-3:barY+barH+10}" font-size="8" fill="${col}" text-anchor="middle" font-family="monospace">${valStr}</text>`;
        bars += `<text x="${x+barW/2}" y="${H-2}" font-size="8" fill="#475569" text-anchor="middle" font-family="monospace">${h.year}</text>`;
      });
      // FCF CAGR（経過年数は実測。[[FCF-CAGR-YEARS-MISMATCH-1]]対応:
      // validはゼロ/マイナスFCF年を除外したフィルタ後配列のため、
      // valid[-4]〜valid[-1]間に除外年が挟まると実経過年数は3年より
      // 多くなりうる。固定`1/3`ではなく年ラベルの差分から実測する）
      const valid = hist.filter(h=>h.fcf!=null&&h.fcf>0);
      let cagrStr = '';
      if (valid.length >= 4) {
        const oldEntry = valid[valid.length-4], nwEntry = valid[valid.length-1];
        const years = nwEntry.year - oldEntry.year;
        if (years > 0) {
          const cagr = ((nwEntry.fcf/oldEntry.fcf)**(1/years)-1)*100;
          cagrStr = `FCF CAGR(${years}yr): ${cagr>=0?'+':''}${cagr.toFixed(1)}%`;
        }
      }
      return `<div class="chart-container" style="margin-top:24px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h2 class="section-title" style="margin:0">FCF 推移（過去5年）</h2>
          ${cagrStr ? `<span style="font-family:var(--mono);font-size:11px;color:var(--acc)">${cagrStr}</span>` : ''}
        </div>
        <svg width="100%" viewBox="0 0 ${W} ${H}" style="background:var(--sur);border:1px solid var(--bdr);border-radius:6px;display:block">
          <line x1="${PAD}" y1="${zeroY}" x2="${W-PAD}" y2="${zeroY}" stroke="#1e2840" stroke-width="1"/>
          ${bars}
        </svg>
      </div>`;
    })()}

    <section id="cf-waterfall-section" class="chart-container" style="display:none">
      <h2 class="section-title">キャッシュフロー分析</h2>
      <div id="cf-waterfall-chart" style="width:100%;min-height:300px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px"></div>
      <div id="cf-margin-chart" style="width:100%;min-height:240px;margin-top:16px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px"></div>
      <div id="cf-quality-chart" style="width:100%;min-height:240px;margin-top:16px;background:var(--sur);border:1px solid var(--bdr);border-radius:8px"></div>
    </section>

    <footer>
      <p>計算日: ${toJST(calcDate)} | ${formula}</p>
      <p style="margin-top:6px;font-size:11px;color:var(--mut)">財務基準 ${d.fcf_ttm_end || '—'} ｜ 生成 ${calcDate !== '—' ? calcDate.slice(0,10) : '—'} ｜ 次回決算 ${d.next_earnings_date || '—'} ｜ インサイダー ${d.components?.insider_latest_date || '—'}</p>
      <p style="margin-top:8px"><a href="index.html" style="color:var(--acc);text-decoration:none">銘柄一覧に戻る</a></p>
    </footer>
  `;

  renderChart(dcfType, pvPhase1, pvPhase2, pvHigh, pvTerminal, rpoPV, goPv, alpha, v0);

  // ---- Growth Sanity ----
  if (sanity) {
    const verdictColor = {
      'PLAUSIBLE':  '#22c55e',
      'REVIEW':     '#eab308',
      'AGGRESSIVE': '#f97316',
    }[sanity.verdict] || '#6b7280';
    const signalItems = (sanity.signals || [])
      .map(s => `<li style="margin:2px 0;font-size:12px;">${s}</li>`).join('');
    const warnItems = (sanity.warnings || [])
      .map(w => `<li style="margin:2px 0;font-size:12px;color:#f97316;">${w}</li>`).join('');

    const autoAdjusted = d.phase1_growth_auto_adjusted || false;
    const recG  = sanity.recommended_g;
    const recM  = sanity.recommended_g_median;
    const recH  = sanity.recommended_g_hypecore;
    const hStage = sanity.hypecore_stage_used;
    const STAGE_LABELS = {0:'失望/蓄積期', 1:'黎明期', 2:'期待拡大期', 3:'陶酔期', 4:'期待剥落期'};

    let recBlock = '';
    if (recG != null) {
      let rows = '';
      if (recM != null) rows += `<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0"><span style="color:#64748b">中央値ベース</span><span style="font-family:var(--mono);color:#94a3b8">${(recM*100).toFixed(1)}%</span></div>`;
      if (recH != null) {
        const sl = hStage != null ? `Phase${hStage}・${STAGE_LABELS[hStage]||''}` : '';
        rows += `<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0"><span style="color:#64748b">HypeCoreフェーズ補正${sl?' ('+sl+')':''}</span><span style="font-family:var(--mono);color:#94a3b8">${(recH*100).toFixed(1)}%</span></div>`;
      }
      rows += `<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-top:1px solid #1e2a3a;margin-top:3px"><span style="color:#94a3b8;font-weight:600">最終推奨値</span><span style="font-family:var(--mono);color:#c4d0ff;font-weight:700">${(recG*100).toFixed(1)}%</span></div>`;
      const adjBanner = autoAdjusted
        ? `<div style="margin-top:6px;padding:4px 8px;background:rgba(196,208,255,0.1);border:1px solid rgba(196,208,255,0.3);border-radius:4px;font-size:11px;color:#c4d0ff">✓ DCFに自動適用済（推奨値・中央値ベース）</div>`
        : '';
      recBlock = `<div style="margin-top:8px;padding:8px 10px;background:#0a0f1a;border:1px solid #1e2a3a;border-radius:4px"><div style="font-size:10px;color:#475569;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">推奨成長率内訳</div>${rows}${adjBanner}</div>`;
    }

    const growthMismatchNote = growthStructuralMismatch
      ? (ticker === 'TER'
          ? `<div style="margin-top:8px;padding:8px 10px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.4);border-radius:4px;font-size:12px;color:var(--yellow);line-height:1.5">⚠️ 成長率警告は業界平均比ではなく自社の直近実績成長率比によるもの（半導体設備業界のサイクル的な低迷が実績CAGRを一時的に押し下げている可能性。Classificationには影響なし）</div>`
          : `<div style="margin-top:8px;padding:8px 10px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.4);border-radius:4px;font-size:12px;color:var(--yellow);line-height:1.5">⚠️ ハイパーグロース事業と成熟業種平均（Damodaran業種分類）との構造的ミスマッチ（Classificationには影響なし）</div>`)
      : '';

    const sanityHTML = `
      <div style="margin-top:12px;padding:10px 14px;background:#0f1623;border:1px solid #1e2a3a;border-radius:6px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span style="color:${verdictColor};font-weight:bold;font-size:13px;">● ${sanity.verdict}</span>
          <span style="color:#94a3b8;font-size:12px;">
            成長率根拠 (Phase1: ${(sanity.phase1_growth * 100).toFixed(1)}%)
            ${sanity.damodaran_industry ? ` — ${sanity.damodaran_industry}` : ''}
            ${sanity.damodaran_year ? ` [Damodaran ${sanity.damodaran_year}]` : ''}
          </span>
        </div>
        <ul style="margin:0;padding-left:16px;list-style:disc;">
          ${signalItems}${warnItems}
        </ul>
        ${recBlock}
        ${growthMismatchNote}
      </div>`;
    const el = document.getElementById('growth-sanity-container');
    if (el) el.innerHTML = sanityHTML;
  }

  // 割引率別理論株価の表示（テンプレートリテラル外で安全に処理）
  // メイン: ivps = Rmβなし（10%）
  // 参考①: ivpsBeta = β込みWACC
  // 参考②: ivpsRf = Rf理論上限
  const boxStyle = 'margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.04);border-radius:6px;border:1px solid var(--bdr)';
  const lblStyle = 'font-size:10px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px';
  const subStyle = 'font-size:10px;color:var(--mut);margin-top:2px';
  const valStyle = 'font-family:var(--mono);font-size:16px;font-weight:700;color:var(--txt)';
  const rmPct = ((d.wacc?.market_return || 0.10) * 100).toFixed(1);
  const rfPct = ((d.wacc?.risk_free_rate || 0.043) * 100).toFixed(1);
  const waccPct = ((d.wacc?.value || 0) * 100).toFixed(2);

  // 左カード: 参考①β込みWACC・参考②Rfを表示
  const rfBlock = document.getElementById('rfValueBlock');
  if (rfBlock) {
    let html = '';
    if (ivpsBeta > 0) {
      const diffBeta = ivps - ivpsBeta;
      const diffBetaSign = diffBeta >= 0 ? '+' : '';
      html +=
        '<div style="' + boxStyle + '">' +
        '<div style="' + lblStyle + '">参考① β込みWACC（' + waccPct + '%）</div>' +
        '<div style="' + valStyle + '">$' + fmt(ivpsBeta) + '</div>' +
        '<div style="' + subStyle + '">メインとの差 ' + diffBetaSign + '$' + fmt(diffBeta) + ' = βによる効果</div>' +
        '</div>';
    }
    if (ivpsRf > 0) {
      html +=
        '<div style="' + boxStyle + '">' +
        '<div style="' + lblStyle + '">参考② Rf理論上限（' + rfPct + '%）</div>' +
        '<div style="' + valStyle + '">$' + fmt(ivpsRf) + '</div>' +
        '<div style="' + subStyle + '">メインとの差 $' + fmt(ivpsRf - ivps) + ' = リスクプレミアム全体</div>' +
        '</div>';
    }
    rfBlock.innerHTML = html;
  }

  // 右カード: 市場価格との差額分析
  const rmBlock = document.getElementById('rfMarketBlock');
  if (rmBlock) {
    const diff = currentPrice - ivps;
    const diffColor = diff >= 0 ? 'var(--red)' : 'var(--grn)';
    const diffSign = diff >= 0 ? '+' : '';
    let html =
      '<div style="' + boxStyle + '">' +
      '<div style="' + lblStyle + '">差額分析（市場価格 - メイン理論株価）</div>' +
      '<div style="font-family:var(--mono);font-size:20px;font-weight:700;color:' + diffColor + ';margin:4px 0">' +
      diffSign + '$' + fmt(Math.abs(diff)) +
      '</div>' +
      '<div style="' + subStyle + '">FCFで説明できない市場の評価</div>';
    if (ivpsBeta > 0) {
      const diffB = currentPrice - ivpsBeta;
      const diffBColor = diffB >= 0 ? 'var(--red)' : 'var(--grn)';
      html +=
        '<div style="border-top:1px solid var(--bdr);margin-top:6px;padding-top:6px;font-size:11px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:2px">' +
        '<span style="color:var(--mut)">vs β込みWACC</span>' +
        '<span style="font-family:var(--mono);color:' + diffBColor + '">' + (diffB >= 0 ? '+' : '') + '$' + fmt(Math.abs(diffB)) + '</span>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between">' +
        '<span style="color:var(--mut)">βの効果（メイン - β込み）</span>' +
        '<span style="font-family:var(--mono);color:var(--mut)">' + (ivps - ivpsBeta >= 0 ? '+' : '') + '$' + fmt(ivps - ivpsBeta) + '</span>' +
        '</div></div>';
    }
    html += '</div>';
    rmBlock.innerHTML = html;
  }
}


function fmtBaseLabel(method) {
  if (method === 'recent_2yr') return '直近2年平均';
  if (method === 'avg_5yr') return '5年平均';
  return method;
}

function renderMatrixRows(matrix, waccValues, growthYears, currentPrice, baseRowIdx) {
  // 基準値（中央行・中央列）を取得
  const basePrice = matrix[baseRowIdx]?.[1] || 0;
  return matrix.map((row, i) => `
    <tr>
      <td class="row-label">${fmtPct(waccValues[i])}</td>
      ${row.map((price, j) => {
        const isBase = i === baseRowIdx && j === 1;
        // 基準値との相対差で色分け（±10%）
        const diffFromBase = basePrice > 0 ? (price - basePrice) / basePrice : 0;
        const cls = isBase ? 'base-cell'
          : diffFromBase > 0.10 ? 'cheap'
          : diffFromBase < -0.10 ? 'expensive'
          : '';
        return `<td class="${cls}">$${fmt(price)}</td>`;
      }).join('')}
    </tr>
  `).join('');
}

function updateWacc(delta) {
  const d = parseFloat(delta);
  document.getElementById('waccDeltaDisplay').textContent = d >= 0 ? `+${d}%` : `${d}%`;

  if (!globalData) return;

  const baseWacc = globalData.wacc?.value || 0.085;
  const newWacc = baseWacc + (d / 100);
  const sensitivity = globalData.sensitivity || {};
  const matrix = sensitivity.matrix || [];
  const waccValues = sensitivity.wacc_values || [];
  const growthYears = sensitivity.growth_years || [3, 5, 7];
  const currentPrice = globalData.components?.current_price || 0;

  const adjustedWaccValues = waccValues.map(w => w + (d / 100));
  const adjustFactor = baseWacc / newWacc;
  const adjustedMatrix = matrix.map(row => row.map(p => p * adjustFactor));

  document.getElementById('matrixBody').innerHTML = renderMatrixRows(adjustedMatrix, adjustedWaccValues, growthYears, currentPrice, 1);
  document.getElementById('displayWacc').textContent = fmtPct2(newWacc);

  // β込みWACC感度表示を更新（displayIvps）
  const baseIvpsBeta = globalData.intrinsic_value_beta || globalData.intrinsic_value_per_share || 0;
  const newIvps = baseIvpsBeta * adjustFactor;
  document.getElementById('displayIvps').textContent = '$' + fmt(newIvps);

  // メイン理論株価（Rmβなし固定）のupside更新
  const mainIvps = globalData.intrinsic_value_per_share || 0;
  const newUpside = ((mainIvps / currentPrice) - 1) * 100;
  const badge = document.getElementById('displayUpside');
  badge.className = 'upside-badge ' + (newUpside >= 0 ? 'positive' : 'negative');
  badge.textContent = (newUpside >= 0 ? '▲' : '▼') + ' ' + Math.abs(newUpside).toFixed(1) + '%';
}

function applyLayer2Toggle() {
  if (!globalData) return;
  const d = globalData;
  const useGO    = document.getElementById('toggleGO')?.checked ?? true;
  const useAlpha = document.getElementById('toggleAlpha')?.checked ?? true;

  // 元の値を取得
  const v0        = d.dcf_components?.v0_rm || d.v0 || 0;
  const rpoPV     = d.components?.rpo_pv || 0;
  const goPv      = useGO ? (d.growth_options?.total_pv || 0) : 0;
  const alpha     = useAlpha ? (d.alpha || 0) : 0;
  const shares    = d.components?.diluted_shares || 1;
  const bs        = d.bs_adjustment?.net_cash_per_share || 0;

  const pt = v0 + rpoPV + goPv;
  const adjIvps = pt / shares + bs;

  const el = document.getElementById('layer2AdjustedIvps');
  if (el) {

    el.textContent = label;
  }
}
