<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>TANUKI SCORE — 統合投資判断</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:  #0a0d14; --sur: #0f1425; --sur2: #141a2e; --bdr: #1b2540;
      --acc: #3b82f6; --grn: #10b981; --red: #f43f5e; --amb: #f59e0b;
      --cyn: #06b6d4; --pur: #8b5cf6;
      --txt: #e2e8f0; --sub: #7a92b0; --mut: #3d5070;
      --sans: 'DM Sans', 'Noto Sans JP', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--txt); font-family: var(--sans); font-size: 15px; min-height: 100vh; }
    .shell { max-width: 980px; margin: 0 auto; padding: 0 24px 60px; }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--bdr); padding: 14px 0;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px; flex-wrap: wrap; gap: 10px;
      position: sticky; top: 0; background: var(--bg); z-index: 100;
    }
    .nav-links { display: flex; flex-wrap: wrap; gap: 14px; }
    .nav-links a { font-family: var(--mono); font-size: 11px; color: var(--mut); text-decoration: none; letter-spacing: .06em; padding: 4px 0; border-bottom: 1px solid transparent; transition: all .2s; }
    .nav-links a:hover { color: var(--acc); border-bottom-color: var(--acc); }
    .nav-links a.active { color: var(--acc); border-bottom-color: var(--acc); }

    /* ── Section title ── */
    .sec { font-family: var(--mono); font-size: 11px; color: var(--mut); letter-spacing: .1em; margin: 28px 0 12px; display: flex; align-items: center; gap: 10px; }
    .sec::after { content: ''; flex: 1; height: 1px; background: var(--bdr); }

    /* ── ① Market summary bar ── */
    .mkt-bar { background: var(--sur); border: 1px solid var(--bdr); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .mkt-phase { font-size: 15px; font-weight: 500; flex: 1; min-width: 200px; }
    .mkt-stats { display: flex; gap: 0; }
    .mkt-stat { font-family: var(--mono); font-size: 12px; color: var(--sub); padding: 4px 14px; border-left: 1px solid var(--bdr); }
    .mkt-stat strong { color: var(--txt); font-size: 14px; }
    .mkt-stat:first-child { border-left: none; }

    /* ── ② Category board ── */
    .cat-row { display: grid; gap: 8px; margin-bottom: 8px; }
    .cat-row.top3 { grid-template-columns: repeat(3, 1fr); }
    .cat-row.bot2 { grid-template-columns: 2fr 1fr; }

    .cat-card { background: var(--sur); border: 1px solid var(--bdr); padding: 8px 10px; }
    .cat-card.shikomi { border-color: rgba(16,185,129,.35); }
    .cat-card.wait    { border-color: rgba(245,158,11,.35); }
    .cat-card.profit  { border-color: rgba(59,130,246,.35); }
    .cat-card.watch   { border-color: var(--bdr); }
    .cat-card.ronogai { border-color: rgba(244,63,94,.25); }

    .cat-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .cat-label { font-family: var(--mono); font-size: 12px; font-weight: 500; }
    .shikomi .cat-label { color: var(--grn); }
    .wait    .cat-label { color: var(--amb); }
    .profit  .cat-label { color: var(--acc); }
    .watch   .cat-label { color: var(--sub); }
    .ronogai .cat-label { color: var(--red); }
    .cat-count { font-family: var(--mono); font-size: 11px; color: var(--mut); }
    .cat-desc  { font-size: 10px; color: var(--mut); margin-bottom: 4px; font-family: var(--mono); letter-spacing: .03em; }

    .cat-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .cat-chip { display: inline-flex; flex-direction: column; padding: 3px 7px; border: 1px solid var(--bdr); background: var(--sur2); text-decoration: none; transition: border-color .12s; }
    .cat-chip:hover { border-color: var(--sub); }
    .cat-chip .ckr { font-family: var(--mono); font-size: 12px; font-weight: 500; }
    .cat-chip .csc { font-family: var(--mono); font-size: 9px; color: var(--mut); margin-top: 1px; }
    .shikomi .cat-chip .ckr { color: var(--grn); }
    .wait    .cat-chip .ckr { color: var(--amb); }
    .profit  .cat-chip .ckr { color: var(--acc); }
    .watch   .cat-chip .ckr { color: var(--sub); }
    .ronogai .cat-chip .ckr { color: var(--red); }

    /* ── 今日の特選銘柄 ── */
    .pick-card { background: var(--sur); border: 1px solid rgba(20,184,166,.35); }
    .pick-header { padding: 14px 20px; border-bottom: 1px solid var(--bdr); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .pick-pin { font-family: var(--mono); font-size: 13px; font-weight: 500; color: #14b8a6; }
    .pick-ts  { font-family: var(--mono); font-size: 11px; color: var(--mut); }
    .pick-meta { padding: 14px 20px 10px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .pick-ticker { font-family: var(--mono); font-size: 26px; font-weight: 500; color: #14b8a6; text-decoration: none; }
    .pick-ticker:hover { text-decoration: underline; }
    .pick-company { font-size: 14px; color: var(--sub); flex: 1; }
    .pick-reason { font-family: var(--mono); font-size: 12px; color: var(--mut); padding: 0 20px 8px; }
    .pick-scores { display: flex; gap: 10px; padding: 0 20px 14px; }
    .pick-sc { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 1px; }
    .pick-sc.shikomi { background: rgba(16,185,129,.12); color: var(--grn); }
    .pick-sc.wait    { background: rgba(245,158,11,.12);  color: var(--amb); }
    .pick-sc.profit  { background: rgba(59,130,246,.12);  color: var(--acc); }
    .pick-sc.watch   { background: rgba(100,116,139,.12); color: var(--sub); }
    .pick-sc.ronogai { background: rgba(244,63,94,.10);   color: var(--red); }
    .pick-report { border-top: 1px solid var(--bdr); }
    .pick-section { padding: 14px 20px; border-bottom: 1px solid rgba(27,37,64,.5); }
    .pick-section:last-child { border-bottom: none; }
    .pick-sec-title { font-family: var(--mono); font-size: 11px; color: #14b8a6; letter-spacing: .08em; margin-bottom: 8px; }
    .pick-sec-body { font-size: 14px; color: var(--txt); line-height: 1.75; white-space: pre-wrap; }
    .pick-stale { padding: 20px; font-family: var(--mono); font-size: 12px; color: var(--mut); text-align: center; }

    /* 論外 toggle */
    .ronogai-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .ronogai-toggle .tog-arrow { font-size: 10px; color: var(--mut); transition: transform .2s; }
    .ronogai-toggle.open .tog-arrow { transform: rotate(180deg); }
    #ronogai-body { display: none; }
    .cat-empty { font-family: var(--mono); font-size: 12px; color: var(--mut); padding: 4px 0; }

    /* ── ③ Detail table ── */
    .tbl-wrap { background: var(--sur); border: 1px solid var(--bdr); overflow-x: auto; }
    .dtbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dtbl th {
      font-family: var(--mono); font-size: 11px; color: var(--mut); text-align: left;
      padding: 10px 14px; border-bottom: 1px solid var(--bdr); white-space: nowrap;
      background: var(--sur); cursor: pointer; user-select: none; position: relative;
    }
    .dtbl th:hover { color: var(--sub); }
    .dtbl th.sorted { color: var(--acc); }
    .sort-arr { margin-left: 4px; font-size: 9px; opacity: .7; }
    .dtbl td { padding: 10px 14px; border-bottom: 1px solid rgba(27,37,64,.5); white-space: nowrap; vertical-align: middle; }
    .dtbl tr:last-child td { border-bottom: none; }
    .dtbl tr:hover td { background: rgba(255,255,255,.013); }

    .tkr-a { color: var(--acc); font-family: var(--mono); font-weight: 500; font-size: 13px; text-decoration: none; }
    .tkr-a:hover { text-decoration: underline; }
    .cat-badge { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 1px; white-space: nowrap; }
    .badge-shikomi { background: rgba(16,185,129,.12); color: var(--grn); }
    .badge-wait    { background: rgba(245,158,11,.12);  color: var(--amb); }
    .badge-profit  { background: rgba(59,130,246,.12);  color: var(--acc); }
    .badge-watch   { background: rgba(100,116,139,.12); color: var(--sub); }
    .badge-ronogai { background: rgba(244,63,94,.10);   color: var(--red); }

    .sc-num { font-family: var(--mono); font-size: 13px; text-align: right; }
    .sc-hi  { color: var(--grn); } .sc-mid { color: var(--amb); } .sc-lo { color: var(--sub); } .sc-no { color: var(--mut); }
    .num { font-family: var(--mono); font-size: 13px; text-align: right; }
    .pos { color: var(--grn); } .neg { color: var(--red); } .neu { color: var(--sub); }
    .s1 { color: var(--grn); } .s2 { color: var(--cyn); } .s3 { color: var(--amb); } .s4 { color: var(--red); }
    .fcf-ok { color: var(--grn); } .fcf-ng { color: var(--mut); }
    .tbl-note { font-family: var(--mono); font-size: 10px; color: var(--mut); margin-top: 8px; letter-spacing: .04em; }

    /* Loading */
    .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--bdr); border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { color: var(--mut); font-family: var(--mono); font-size: 12px; padding: 40px; text-align: center; }

    @media (max-width: 640px) {
      .cat-row.top3 { grid-template-columns: 1fr; }
      .cat-row.top4 { grid-template-columns: 1fr; }
      .cat-row.bot2 { grid-template-columns: 1fr; }
      .mkt-stats { flex-wrap: wrap; }
    }

    /* ── 7-cat cards & badges ── */
    .cat-row.top4 { grid-template-columns: repeat(4, 1fr); }
    .cat-card.buy      { border-color: rgba(34,197,94,.35); }
    .cat-card.watch-cat{ border-color: rgba(234,179,8,.35); }
    .cat-card.hold     { border-color: rgba(59,130,246,.35); }
    .cat-card.growth-premium { border-color: rgba(20,184,166,.35); }
    .cat-card.trim     { border-color: rgba(249,115,22,.35); }
    .cat-card.sell     { border-color: rgba(239,68,68,.35); }
    .cat-card.pass     { border-color: rgba(71,85,105,.25); }
    .buy       .cat-label { color: #22c55e; }
    .watch-cat .cat-label { color: #eab308; }
    .hold      .cat-label { color: #3b82f6; }
    .growth-premium .cat-label { color: #14b8a6; }
    .trim      .cat-label { color: #f97316; }
    .sell      .cat-label { color: #ef4444; }
    .pass      .cat-label { color: #475569; }
    .buy       .cat-chip .ckr { color: #22c55e; }
    .watch-cat .cat-chip .ckr { color: #eab308; }
    .hold      .cat-chip .ckr { color: #3b82f6; }
    .growth-premium .cat-chip .ckr { color: #14b8a6; }
    .trim      .cat-chip .ckr { color: #f97316; }
    .sell      .cat-chip .ckr { color: #ef4444; }
    .pass      .cat-chip .ckr { color: #475569; }
    .badge-BUY  { background: rgba(34,197,94,.12);  color: #22c55e; }
    .badge-WATCH{ background: rgba(234,179,8,.12);  color: #eab308; }
    .badge-HOLD { background: rgba(59,130,246,.12); color: #3b82f6; }
    .badge-GROWTH_PREMIUM { background: rgba(20,184,166,.12); color: #14b8a6; }
    .badge-TRIM { background: rgba(249,115,22,.12); color: #f97316; }
    .badge-SELL { background: rgba(239,68,68,.10);  color: #ef4444; }
    .badge-PASS { background: rgba(71,85,105,.10);  color: #475569; }
    .chip-tags {
      font-size: 9px; color: #94a3b8; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;
    }

    /* ── ④ 判定実績バックテスト ── */
    .sv-wrap { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--bdr); }
    .section-title { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--acc); letter-spacing: .15em; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--bdr); }
    .sv-card { background: var(--sur); border: 1px solid var(--bdr); border-radius: 8px; padding: 24px; margin-top: 0; }
    .sv-subtitle { color: var(--sub); font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
    .sv-sec-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--acc); text-transform: uppercase; margin: 14px 0 8px; border-left: 2px solid var(--acc); padding-left: 8px; }
    .sv-table-wrap { overflow-x: auto; border: 1px solid var(--bdr); border-radius: 4px; max-height: 300px; overflow-y: auto; }
    .sv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .sv-table thead th { background: var(--sur2); padding: 7px 12px; text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--sub); position: sticky; top: 0; border-bottom: 1px solid var(--bdr); }
    .sv-table tbody tr { border-bottom: 1px solid rgba(27,37,64,.5); }
    .sv-table tbody tr:last-child { border-bottom: none; }
    .sv-table tbody tr:hover { background: var(--sur2); }
    .sv-table td { padding: 6px 12px; }
    .sv-badge { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
    .sv-badge.sv-buy            { background: rgba(16,185,129,.15); color: #10b981; border-color: rgba(16,185,129,.3); }
    .sv-badge.sv-growth-premium { background: rgba(16,185,129,.1);  color: #10b981; border-color: rgba(16,185,129,.2); }
    .sv-badge.sv-watch          { background: rgba(59,130,246,.15); color: #3b82f6; border-color: rgba(59,130,246,.3); }
    .sv-badge.sv-hold           { background: rgba(100,116,139,.15);color: #94a3b8; border-color: rgba(100,116,139,.3); }
    .sv-badge.sv-trim           { background: rgba(245,158,11,.15); color: #f59e0b; border-color: rgba(245,158,11,.3); }
    .sv-badge.sv-sell           { background: rgba(244,63,94,.15);  color: #f43f5e; border-color: rgba(244,63,94,.3); }
    .sv-badge.sv-pass           { background: rgba(100,116,139,.1); color: var(--sub); border-color: rgba(100,116,139,.2); }
    .sv-lowsample               { color: var(--mut); font-style: italic; }

    /* accordion */
    .sec-accordion { cursor: pointer; user-select: none; }
    .sec-accordion:hover { color: var(--acc); }
    .board-desc { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 6px 0 14px; padding: 0 2px; }
    .sv-note { font-size: 11px; color: var(--mut); margin-top: 10px; padding: 8px 10px; background: var(--sur2); border-radius: 4px; border-left: 3px solid var(--bdr); }
    .sv-section-toggle { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; }
    .sv-section-toggle:hover { opacity: .8; }
    .sv-toggle-hint { font-size: 11px; color: var(--mut); }

    footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--bdr); text-align: center; font-size: 11px; color: var(--mut); }
    footer a { color: var(--acc); text-decoration: none; }
    .last-updated { font-family: var(--mono); font-size: 11px; color: var(--mut); text-align: right; padding: 6px 0 0; }
  </style>
  <link rel="stylesheet" href="../../common/site-theme.css">
</head>
<body data-tool="tanuki-score">
<div class="shell">
  <header>
    <a class="logo"></a>
    <nav class="nav-links"></nav>
  </header>
  <div class="last-updated" id="last-updated"></div>

  <div id="mkt-summary"><div class="loading"><span class="spin"></span>市場データを取得中...</div></div>
  <div id="daily-pick"></div>
  <div id="cat-board"></div>
  <div id="rice-matrix"></div>
  <div id="dupont-panel"></div>
  <div id="trap-panel"></div>
  <div id="detail-tbl"></div>

  <!-- ④ 判定実績バックテスト -->
  <div class="sv-wrap">
    <div id="score-verify-section"></div>
  </div>

  <footer>
    <p>TANUKI SCORE | Part of <a href="/On-a-journey/">ON A JOURNEY</a> Investment Suite</p>
    <p style="margin-top:8px">データソース: SEC EDGAR + yfinance + Market Pulse</p>
  </footer>
</div>

<script>
// ─── Paths ───────────────────────────────────────────────────
const TS     = '?t=' + Date.now();
const T_BASE = '../tanuki_valuation/';
const H_BASE = '../hypecore/data/';
const E_PATH = '../adjusted_eps_analyzer/data/summary.json';
const M_PATH = '../../market-monitor/market-pulse/data/market_data.json';
const S_PATH = '../stonks-silo/data/results.json';

// ─── Display helpers ─────────────────────────────────────────
// ARCH-SCORE-SYNC-1: funda/timing/分類はすべてpipeline.py(latest.json)が
// 計算済みの値をそのまま表示する。JS側での独自再計算は行わない。
function scClass(v) {
  return v >= 75 ? 'sc-hi' : v >= 50 ? 'sc-mid' : v >= 25 ? 'sc-lo' : 'sc-no';
}
function pct(v, dec = 1) {
  if (v == null || typeof v !== 'number' || !isFinite(v)) return '<span class="neu">—</span>';
  const s = (v >= 0 ? '+' : '') + v.toFixed(dec) + '%';
  return `<span class="${v >= 0 ? 'pos' : 'neg'}">${s}</span>`;
}
function mktMessage(fg) {
  if (fg < 30) return '🔴 極度の恐怖 — 歴史的な仕込み場。全ての仕込み時銘柄を検討';
  if (fg < 50) return '🟠 恐怖 — 仕込み時銘柄への打診買いチャンス';
  if (fg < 70) return '🟡 中立 — 仕込み待ち銘柄の監視継続。急がない';
  return '🟢 強欲 — 利確検討銘柄の整理タイミング';
}

const CAT_META = {
  BUY:  { label:'BUY',  icon:'🟢', color:'#22c55e', cls:'buy',       badge:'badge-BUY',   desc:'ファンダ≥50 · 割安(>20%) · タイミング≥50 — 今仕込んでもよい' },
  WATCH:{ label:'WATCH',icon:'🟡', color:'#eab308', cls:'watch-cat', badge:'badge-WATCH',  desc:'ファンダ≥50 · 割安(0-20%) — 購入候補ウォッチリスト' },
  HOLD: { label:'HOLD', icon:'🔵', color:'#3b82f6', cls:'hold',      badge:'badge-HOLD',   desc:'ファンダ良好 · 許容範囲内 — 保有継続・新規不要' },
  GROWTH_PREMIUM: { label:'GROWTH_PREMIUM', icon:'🟩', color:'#14b8a6', cls:'growth-premium', badge:'badge-GROWTH_PREMIUM', desc:'割高判定だが現在成長率が逆算必要成長率を上回る — TRIMの例外' },
  TRIM: { label:'TRIM', icon:'🟠', color:'#f97316', cls:'trim',      badge:'badge-TRIM',   desc:'ファンダ良好 · 割高(-30%超) · 陶酔期以降 — 一部利確検討' },
  SELL: { label:'SELL', icon:'🔴', color:'#ef4444', cls:'sell',      badge:'badge-SELL',   desc:'ファンダ劣化 または 長期下落トレンド — 保有再考' },
  PASS: { label:'PASS', icon:'⬛', color:'#475569', cls:'pass',      badge:'badge-PASS',   desc:'ファンダ<25 — 対象外' },
};

// ─── Sortable table state ─────────────────────────────────────
let _stocks  = [];
let _sortCol = 'funda';
let _sortDir = -1;

function sortAndRender(col) {
  if (_sortCol === col) _sortDir = -_sortDir;
  else { _sortCol = col; _sortDir = -1; }
  renderDetailTable();
}

// DuPont panel sort state
let _dpSortCol = 'roe_decomposed';
let _dpSortDir = -1;

function sortDuPont(col) {
  if (_dpSortCol === col) _dpSortDir = -_dpSortDir;
  else { _dpSortCol = col; _dpSortDir = -1; }
  renderDuPontPanel();
}

// Trap panel sort state
let _trapSortCol = 'trapCount';
let _trapSortDir = -1;
let _trapShowAll = false;

function sortTrap(col) {
  if (_trapSortCol === col) _trapSortDir = -_trapSortDir;
  else { _trapSortCol = col; _trapSortDir = -1; }
  renderTrapPanel();
}

function toggleTrapAll() {
  _trapShowAll = !_trapShowAll;
  renderTrapPanel();
}

const COL_KEYS = ['ticker','cat','funda','timing','revYoy','rule40','epsYoy','fcf','upside','per','maxEpsPer','perGap','stage'];

// ─── Render ③ Detail table ───────────────────────────────────
function renderDetailTable() {
  const sorted = [..._stocks].sort((a, b) => {
    const av = a[_sortCol], bv = b[_sortCol];
    if (av == null && bv == null) return 0;
    if (av == null) return 1; if (bv == null) return -1;
    return _sortDir * (typeof av === 'string' ? av.localeCompare(bv) : av - bv);
  });

  const stageLabel = (s, lbl) => {
    if (s == null || s === 0 || s < 1 || s > 4) return '<span class="neu">—</span>';
    const text = lbl || ['', '蓄積期', '上昇期', '陶酔期', '崩壊期'][s] || '—';
    return `<span class="s${s}" style="font-family:var(--mono);font-size:12px">${text}</span>`;
  };

  const thArr = (col, label) => {
    const isSorted = _sortCol === col;
    const arr = isSorted ? (_sortDir === -1 ? '▼' : '▲') : '';
    return `<th class="${isSorted ? 'sorted' : ''}" onclick="sortAndRender('${col}')">${label}${arr ? `<span class="sort-arr">${arr}</span>` : ''}</th>`;
  };

  const tbody = sorted.map(s => {

      <td class="num">${pct(s.epsYoy)}</td>

      <td class="num" style="font-family:var(--mono);${s.perGap != null && s.perGap > 0 ? 'color:#f97316' : ''}">${s.perGap != null ? (s.perGap > 0 ? '+' : '') + s.perGap.toFixed(1) : '<span class="neu">—</span>'}</td>
      <td>${stageLabel(s.stage, s.stageL)}</td>
    </tr>`;
  }).join('');

  document.getElementById('detail-tbl').innerHTML = `
    <div class="sec">③ 全銘柄詳細 — ヘッダークリックでソート</div>
    <div class="tbl-wrap">
      <table class="dtbl">
        <thead><tr>
          ${thArr('ticker','銘柄')}
          ${thArr('cat','分類')}
          ${thArr('funda','ファンダ')}
          ${thArr('timing','タイミング')}
          ${thArr('revYoy','売上成長')}
          ${thArr('rule40','Rule40')}
          ${thArr('epsYoy','EPS成長')}
          <th>FCF</th>
          ${thArr('upside','TANUKI乖離')}
          ${thArr('per','GAAP PER')}
          ${thArr('maxEpsPer','最大EPS PER')}
          ${thArr('perGap','乖離')}
          ${thArr('stage','フェーズ')}
        </tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
    <div class="tbl-note">
      ファンダ/タイミング: 0–100pt · 🟢75+ 🟡50+ ⚪25+ · 売上成長/EPS成長/TANUKI乖離は最新期
    </div>`;
}

  // 3. Per-ticker data (parallel)

    fetch(E_PATH + TS)
      .then(r => r.ok ? r.json() : {tickers:[]})
      .then(d => Object.fromEntries((d.tickers||[]).map(t=>[t.ticker,t])))
      .catch(()=>({})),

    fetch(S_PATH + TS)
      .then(r => r.ok ? r.json() : {tickers:{}})
      .then(d => d.tickers || {})
      .catch(()=>({}))

  // 4. Build stocks array
  _stocks = tickers.map(ticker => {
    const tk = tanukiMap[ticker];
    const hc = hypeMap[ticker];
    const ep = epsMap[ticker];

    const lastMo  = hc?.monthly?.[hc.monthly.length - 1] ?? null;
    const revYoy  = lastMo?.rev_yoy    ?? null;
    const rule40  = lastMo?.rule40_yoy_netmargin ?? null;

    const rawUp   = tk?.upside_percent ?? null;
    const fcfBase = tk?.fcf_base?.base_fcf ?? null;
    const epsYoyDec = ep?.yoy_growth ?? null;
    const epsYoy  = epsYoyDec != null ? epsYoyDec * 100 : null;

    const substage   = lastMo?.substage_label ?? '';
    const stageLabel = lastMo?.stage_label ?? '';

    // ARCH-SCORE-SYNC-1: funda/timing/分類/sell理由/matrix位置はすべてpipeline.py(latest.json)が

    return { ticker, cat, funda, timing, revYoy, rule40, epsYoy, fcf: fcfBase,
             upside: rawUp, stage, stageL: stageLabel, substage, stageLabel, sellReason,
             matrixInfo, riceVal, riceAvailable, roe, per, peg, ps, maxEpsPer, maxEpsRel, perGap, dupont,
             growthRate, dilutionPct, roicWacc, industry, fcfHistory, fcfOutlier,
             dividendYield, payoutRatio, netCurrentAssetsRatio, buybackTtm, netDebt };
  });

  // 5. Categorize
  const cats = { BUY:[], WATCH:[], HOLD:[], GROWTH_PREMIUM:[], TRIM:[], SELL:[], PASS:[] };
  _stocks.forEach(s => { (cats[s.cat] ??= []).push(s); });

  Object.keys(cats).forEach(k => {

  // ARCH-SCORE-SYNC-1: MATRIX象限はpipeline.py(_compute_matrix_position)が

  const MATRIX_PREFIX = { '①投資効率系':'①', '②収益性系':'②', '③成長性系':'③', '④キャッシュ創出力系':'④' };
  function matrixBadge(s) {
    const m = s.matrixInfo;
    if (!m) return '';
    const prefix = MATRIX_PREFIX[m.matrix] || '';
    let bg, col;

      const pegCol = s.peg < 1 ? '#4ade80' : s.peg > 2 ? '#f87171' : '#94a3b8';
      parts.push(`<span style="color:${pegCol}">PEG ${s.peg.toFixed(2)}</span>`);

    if (s.ps != null) {
      const psCol = s.ps > 20 ? '#f87171' : '#94a3b8';

    if (!parts.length) return '';

  }

  function chipTag(key, s) {

      return `<span class="chip-tags">割高${s.upside.toFixed(0)}% · ${s.stageLabel || ''}</span>`;

  function catCard(key, stocks) {

  function collapsedCard(key, stocks) {

        <span class="cat-count">${stocks.length}銘柄 <span class="tog-arrow">▼</span></span>
      </div>
      <div class="cat-desc">${m.desc}</div>
      <div id="${id}-body" class="cat-chips" style="display:none">${chips}</div>
    </div>`;
  }

  document.getElementById('cat-board').innerHTML = `
    <div class="sec sec-accordion" onclick="toggleCatBoard()">
      投資アクション早見表
      <span id="cat-board-arrow" style="font-size:11px;color:var(--mut);margin-left:8px">▶ 展開して見る</span>
    </div>
    <div id="cat-board-body" style="display:none">
      <div class="board-desc">ファンダメンタル評価（ファンダスコア）× 市場タイミング（乖離率・フェーズ）の2軸でアクションを分類。自分の銘柄がどのセルにいるかを確認する。</div>
      <div class="cat-row top4">
        ${catCard('BUY',   cats.BUY)}
        ${catCard('WATCH', cats.WATCH)}
        ${catCard('GROWTH_PREMIUM', cats.GROWTH_PREMIUM)}
        ${catCard('HOLD',  cats.HOLD)}
      </div>
      <div class="cat-row top3">
        ${catCard('TRIM', cats.TRIM)}
        ${catCard('SELL', cats.SELL)}
        ${catCard('PASS', cats.PASS)}
      </div>
    </div>`;

  // ③ Detail table
  renderDetailTable();

  // ⑤ RICE × 乖離率マトリクス
  renderRiceMatrix();

  // ⑥ DuPont分解パネル
  renderDuPontPanel();

  // ⑦ 投資トラップ検出パネル

function toJST(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr.slice(0, 10);
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

// ─── ④ 判定実績バックテスト ──────────────────────────────────
async function loadScoreHistory(tickers) {
  const all = await Promise.all(
    tickers.map(async ticker => {
      try {
        const res = await fetch(`${T_BASE}data/${ticker}/score_history.json`, { cache: 'no-cache' });
        if (!res.ok) return [];
        const entries = await res.json();
        return entries.map(e => ({ ...e, ticker }));
      } catch { return []; }
    })
  );
  return all.flat();
}

function renderScoreVerify(allEntries) {
  const el = document.getElementById('score-verify-section');
  if (!el) return;
  if (!allEntries.length) {
    el.innerHTML = '<p style="color:var(--mut);text-align:center;padding:40px">データなし（pipeline.py 実行後に表示）</p>';
    return;
  }

  const SCORE_TYPES = ['BUY', 'GROWTH_PREMIUM', 'WATCH', 'HOLD', 'TRIM', 'SELL', 'PASS'];
  const byScore = {};
  const tickersByScore = {};
  for (const e of allEntries) {
    const s = e.tanuki_score;
    if (!s) continue;
    if (!byScore[s]) byScore[s] = { total: 0, win30: 0, n30: 0, ret30s: [], win60: 0, n60: 0, ret60s: [], win90: 0, n90: 0, ret90s: [] };
    const b = byScore[s];
    b.total++;
    if (e.return_30d != null) { b.n30++; if (e.return_30d > 0) b.win30++; b.ret30s.push(e.return_30d); }
    if (e.return_60d != null) { b.n60++; if (e.return_60d > 0) b.win60++; b.ret60s.push(e.return_60d); }
    if (e.return_90d != null) {
      b.n90++; if (e.return_90d > 0) b.win90++; b.ret90s.push(e.return_90d);
      (tickersByScore[s] = tickersByScore[s] || new Set()).add(e.ticker);
    }
  }

  const badgeCls = s => `sv-badge sv-${(s||'').toLowerCase().replace('_premium','-premium').replace('_','-')}`;
  const avgOf = arr => arr.length > 0 ? arr.reduce((a,c) => a+c, 0) / arr.length : null;
  const fmtPct = v => v != null
    ? `<span style="color:${v>=0?'var(--grn)':'var(--red)'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`
    : '<span style="color:var(--mut)">—</span>';
  const fmtWin = (win, n) => n > 0
    ? `${(win/n*100).toFixed(0)}% <span style="color:var(--mut)">(${n}件)</span>`
    : '<span style="color:var(--mut)">—</span>';

  // [[BACKTEST-SCORE-1]] 2026-09-10: n<10・対象銘柄数が極端に少ない区分は
  // 参考値扱いとする旨をバッジで明示（サンプルサイズ不足の透明化。
  // 単純なn<10だけでなく「ごく少数の銘柄に集中」しているケースも
  // 別途注記する——GROWTH_PREMIUM 90日実績はALAB/SITMの2銘柄のみに由来）。
  const lowSampleNote = (s, n90) => {
    if (n90 === 0) return '<span class="sv-lowsample">90日実績なし</span>';
    const nTickers = (tickersByScore[s] || new Set()).size;
    if (nTickers > 0 && nTickers <= 2) return `<span class="sv-lowsample">${nTickers}銘柄のみに由来</span>`;
    if (n90 < 10) return '<span class="sv-lowsample">n&lt;10</span>';
    return '';
  };

  const winRows = SCORE_TYPES.filter(s => byScore[s]).map(s => {
    const b = byScore[s];
    return `<tr>
      <td><span class="${badgeCls(s)}">${s}</span></td>
      <td style="font-family:var(--mono)">${b.total}</td>
      <td style="font-family:var(--mono)">${fmtWin(b.win30, b.n30)}</td>
      <td style="font-family:var(--mono)">${fmtPct(avgOf(b.ret30s))}</td>
      <td style="font-family:var(--mono)">${fmtWin(b.win60, b.n60)}</td>
      <td style="font-family:var(--mono)">${fmtPct(avgOf(b.ret60s))}</td>
      <td style="font-family:var(--mono)">${fmtWin(b.win90, b.n90)}</td>
      <td style="font-family:var(--mono)">${fmtPct(avgOf(b.ret90s))}</td>
      <td style="font-size:10px">${lowSampleNote(s, b.n90)}</td>
    </tr>`;
  }).join('');

  const recentArr = [...allEntries]
    .filter(e => e.date && e.tanuki_score)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 20);
  const recentRows = recentArr
    .map(e => `<tr>
      <td style="font-family:var(--mono);font-weight:700"><a href="${T_BASE}stock.html?ticker=${e.ticker}" style="color:var(--txt);text-decoration:none">${e.ticker}</a></td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--mut)">${e.date}</td>
      <td><span class="${badgeCls(e.tanuki_score)}">${e.tanuki_score}</span></td>
      <td style="font-family:var(--mono);font-size:12px">${e.price_at_judgment != null ? '$'+e.price_at_judgment.toFixed(2) : '—'}</td>
      <td style="font-family:var(--mono);font-size:12px">${fmtPct(e.return_30d)}</td>
      <td style="font-family:var(--mono);font-size:12px">${fmtPct(e.return_60d)}</td>
      <td style="font-family:var(--mono);font-size:12px">${fmtPct(e.return_90d)}</td>
    </tr>`)
    .join('');

  const noData = `<tr><td colspan="99" style="text-align:center;color:var(--mut);padding:16px">データなし（pipeline.py 実行後に表示）</td></tr>`;

  el.innerHTML = `
    <h2 class="section-title sv-section-toggle" onclick="toggleScoreVerify()">
      ④ 判定実績 — TANUKI SCORE バックテスト
      <span class="sv-toggle-hint" id="sv-arrow">▲ 折りたたむ</span>
    </h2>
    <div id="sv-body">
    <div class="sv-card">
      <div class="sv-subtitle">
        TANUKI SCOREが BUY / WATCH / HOLD 等と判定した銘柄を、判定日から30日後・60日後・90日後に保有した場合のリターン実績。
        90日実績は2026-06-03以降の判定分から蓄積中のため、現時点では判定日が2026年6月前半のものに限られ母数が少ない（下表「補足」列を参照）。過去実績は将来を保証しない。
        <br><code style="font-size:11px">score_verifier.py</code>が<code style="font-size:11px">common.market_data.reader</code>経由で日次に自動更新する。
      </div>
      <div class="sv-sec-lbl">判定別勝率・平均リターン（30日・60日・90日後）</div>
      <div class="sv-table-wrap">
        <table class="sv-table">
          <thead><tr><th>判定</th><th>件数(n)</th><th>30日勝率</th><th>30日平均</th><th>60日勝率</th><th>60日平均</th><th>90日勝率</th><th>90日平均</th><th>補足</th></tr></thead>
          <tbody>${winRows || noData}</tbody>
        </table>
      </div>
      <div class="sv-note">※ n &lt; 10、または対象銘柄が1〜2件に集中する区分は統計的信頼性が低い参考値。過去実績は将来を保証しない。</div>
      <div class="sv-sec-lbl">直近${recentArr.length}件（全銘柄横断・判定日降順）</div>
      <div class="sv-table-wrap">
        <table class="sv-table">
          <thead><tr><th>銘柄</th><th>判定日</th><th>判定</th><th>判定時株価</th><th>30日後</th><th>60日後</th><th>90日後</th></tr></thead>
          <tbody>${recentRows || noData}</tbody>
        </table>
      </div>
    </div>
    </div>`;
}

// ─── ⑥ DuPont分解パネル ────────────────────────────────────────
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderDuPontPanel() {
  const el = document.getElementById('dupont-panel');
  if (!el) return;

  const dpVal = (s, col) => {
    if (col === 'ticker') return s.ticker;
    if (col === 'roe')    return s.roe;
    return s.dupont?.[col];
  };

  const rows = _stocks
    .filter(s => s.dupont != null && !s.dupont.excluded)
    .sort((a, b) => {
      const av = dpVal(a, _dpSortCol), bv = dpVal(b, _dpSortCol);
      if (av == null && bv == null) return 0;
      if (av == null) return 1; if (bv == null) return -1;
      return _dpSortDir * (typeof av === 'string' ? av.localeCompare(bv) : av - bv);
    });

  if (rows.length === 0) { el.innerHTML = ''; return; }

  const CAT_COLOR = {
    BUY:'#4ade80', GROWTH_PREMIUM:'#14b8a6', WATCH:'#facc15',
    HOLD:'#94a3b8', TRIM:'#fb923c', SELL:'#f87171', PASS:'#475569',
  };

  const pct = v => v == null ? '—' : (v * 100).toFixed(1) + '%';
  const x2  = v => v == null ? '—' : v.toFixed(2) + 'x';

  const dpTh = (col, label, align = 'right', extra = '') => {
    const isSorted = _dpSortCol === col;
    const arr = isSorted ? (_dpSortDir === -1 ? '▼' : '▲') : '';
    const color = isSorted ? 'var(--acc)' : 'var(--mut)';
    return `<th onclick="sortDuPont('${col}')" ${extra}
      style="text-align:${align};padding:4px 8px;cursor:pointer;color:${color};user-select:none;white-space:nowrap">
      ${label}${arr ? `<span style="margin-left:3px;font-size:9px;opacity:.7">${arr}</span>` : ''}
    </th>`;
  };

  const trs = rows.map(s => {
    const dp = s.dupont;
    const roeColor = dp.roe_decomposed >= 0.15 ? '#4ade80'
                   : dp.roe_decomposed >= 0     ? '#facc15'
                   :                              '#f87171';
    const catDot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAT_COLOR[s.cat]||'#475569'};margin-right:4px"></span>`;
    // ROE-DUPONT-3: |ROE|>100%（一過性要因/特殊資本構成の可能性）・reliability=LOW の視覚フラグ
    const isExtreme = Math.abs(dp.roe_decomposed ?? 0) > 1.0;
    const isLowReliability = dp.reliability === 'LOW';
    const flagTitle = [
      isLowReliability ? (dp.reliability_reason || '一過性要因の可能性あり') : null,
      isExtreme ? '一過性要因または特殊資本構成の可能性あり（|ROE|>100%）' : null,
    ].filter(Boolean).join(' / ');
    const flagBadge = flagTitle
      ? `<span data-info-text="${escAttr(flagTitle)}" style="margin-left:4px;color:#facc15">⚠</span>`
      : '';
    // TSCORE-DUPONT-3: DuPont ROEと実績ROEの乖離警告（10%pt以上）
    const divWarn = s.roe != null && dp.roe_decomposed != null && Math.abs(dp.roe_decomposed - s.roe) >= 0.10;
    const divBadge = divWarn
      ? `<span data-info-text="${escAttr('DuPont ROEと実績ROEの乖離が' + (Math.abs(dp.roe_decomposed - s.roe)*100).toFixed(1) + '%ptあります（DuPont: ' + pct(dp.roe_decomposed) + ' / 実績: ' + pct(s.roe) + '）。一過性損益・資本構造変化等が要因の可能性があります')}" style="margin-left:4px;color:#f59e0b;cursor:help">⚠</span>`
      : '';
    return `<tr${divWarn ? ' style="background:rgba(245,158,11,.06)"' : ''}>
      <td style="font-weight:600">${catDot}${s.ticker}${flagBadge}</td>
      <td class="num" style="color:${roeColor}">${pct(dp.roe_decomposed)}</td>
      <td class="num">${pct(dp.net_margin)}</td>
      <td class="num">${x2(dp.asset_turnover)}</td>
      <td class="num">${x2(dp.financial_leverage)}</td>
      <td class="num" style="color:var(--mut)">${pct(s.roe)}${divBadge}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
  <details style="margin:18px 0 10px;border:1px solid var(--border);border-radius:6px;overflow:hidden">
    <summary style="padding:10px 14px;cursor:pointer;background:var(--surface);font-weight:600;font-size:13px;list-style:none">
      ▶ DuPont分解 — ROE = 純利益率 × 資産回転率 × 財務レバレッジ（${rows.length}銘柄）
    </summary>
    <div style="padding:10px 14px;overflow-x:auto">
      <p style="font-size:11px;color:var(--mut);margin:0 0 8px">
        ※ 純資産マイナス銘柄（ABBV/BKNG/DELL/FICO/MO/MSCI/PM/RBRK）は除外。ROE(実績)は10yr平均。
        ⚠ は |ROE|>100% または単四半期NI集中（reliability=LOW）を示す。
      </p>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            ${dpTh('ticker', '銘柄', 'left')}
            ${dpTh('roe_decomposed', 'ROE(DuPont)', 'right', 'data-info="tscore_dupont_roe_color"')}
            ${dpTh('net_margin', '純利益率')}
            ${dpTh('asset_turnover', '資産回転率')}
            ${dpTh('financial_leverage', '財務ﾚﾊﾞﾚｯｼﾞ')}
            ${dpTh('roe', 'ROE(実績)')}
          </tr>
        </thead>
        <tbody>${trs}</tbody>
      </table>
    </div>
  </details>`;
}

// ─── ⑦ 投資トラップ検出パネル ────────────────────────────────────
function computeTraps(s) {
  const fcfSorted = [...s.fcfHistory].sort((a, b) => a.year - b.year);
  const latestFcf = fcfSorted.length > 0 ? fcfSorted[fcfSorted.length - 1].fcf : null;

  // 1. バリュートラップ: 低PER × FCF減少トレンド × 低成長率
  const vt_low_per     = s.per != null && s.per > 0 && s.per < 15;
  const vt_fcf_decline = fcfSorted.length >= 2 &&
                         fcfSorted[fcfSorted.length - 1].fcf < fcfSorted[fcfSorted.length - 2].fcf &&
                         fcfSorted[fcfSorted.length - 2].fcf > 0;
  const vt_low_growth  = s.growthRate != null && s.growthRate < 0.05;
  const vt_count       = [vt_low_per, vt_fcf_decline, vt_low_growth].filter(Boolean).length;
  const value_trap = {
    level:   vt_count >= 3 ? 'high' : vt_count >= 2 ? 'medium' : vt_count >= 1 ? 'low' : 'none',
    reasons: [
      vt_low_per     ? `低PER(${s.per.toFixed(1)}x)` : null,
      vt_fcf_decline ? 'FCF減少トレンド' : null,
      vt_low_growth  ? `低成長率(${((s.growthRate || 0) * 100).toFixed(0)}%)` : null,
    ].filter(Boolean),
  };

  // 2. グローストラップ: 高成長 × FCFマイナス × 高希薄化
  const gt_high_growth = s.growthRate != null && s.growthRate > 0.20;
  const gt_fcf_neg     = latestFcf != null && latestFcf < 0;
  const gt_dilution    = s.dilutionPct != null && s.dilutionPct > 5;
  const gt_count       = [gt_high_growth, gt_fcf_neg, gt_dilution].filter(Boolean).length;
  const growth_trap = {
    level:   gt_count >= 3 ? 'high' : gt_count >= 2 ? 'medium' : gt_count >= 1 ? 'low' : 'none',
    reasons: [
      gt_high_growth ? `高成長率(${((s.growthRate || 0) * 100).toFixed(0)}%)` : null,
      gt_fcf_neg     ? `FCFマイナス(${latestFcf != null ? (latestFcf / 1e6).toFixed(0) + 'M' : '?'})` : null,
      gt_dilution    ? `高希薄化(${s.dilutionPct.toFixed(1)}%/yr)` : null,
    ].filter(Boolean),
  };

  // 3. バリューデストラクション: ROIC/WACC < 1.0
  const value_destruction = {
    level:   s.roicWacc == null ? 'none'
           : s.roicWacc < 0.8  ? 'high'
           : s.roicWacc < 1.0  ? 'medium'
           : s.roicWacc < 1.2  ? 'low'
           : 'none',
    reasons: s.roicWacc != null
      ? [`ROIC/WACC=${s.roicWacc.toFixed(2)}${s.roicWacc < 1.0 ? '（資本コスト未達）' : ''}`]
      : ['データなし'],
  };

  // 4. ナラティブトラップ: 高HypePhase × FCFマイナス × 大幅割高
  const nt_high_phase = s.stage != null && s.stage >= 3;
  const nt_fcf_neg    = latestFcf != null && latestFcf < 0;
  const nt_high_prem  = s.upside != null && s.upside < -20;
  const nt_count      = [nt_high_phase, nt_fcf_neg, nt_high_prem].filter(Boolean).length;
  const narrative_trap = {
    level:   nt_count >= 3 ? 'high' : nt_count >= 2 ? 'medium' : nt_count >= 1 ? 'low' : 'none',
    reasons: [
      nt_high_phase ? `HypePhase${s.stage}(${['', '蓄積期', '上昇期', '陶酔期', '崩壊期'][s.stage] || '?'})` : null,
      nt_fcf_neg    ? 'FCFマイナス' : null,
      nt_high_prem  ? `割高乖離${s.upside?.toFixed(0)}%` : null,
    ].filter(Boolean),
  };

  // 5. サイクリカルピークトラップ: 景気敏感業種 × 低PER × FCF急増
  const CYCLICAL_KEYWORDS = [
    'Steel', 'Aluminum', 'Copper', 'Gold', 'Silver', 'Metals', 'Mining',
    'Oil', 'Gas', 'Coal', 'Chemicals', 'Agricultural',
    'Auto', 'Automobile', 'Airlines', 'Shipping', 'Marine',
    'Semiconductor Equipment', 'Paper', 'Lumber', 'Timber',
  ];
  const cy_cyclical  = CYCLICAL_KEYWORDS.some(k => s.industry.includes(k));
  const cy_low_per   = s.per != null && s.per > 0 && s.per < 12;
  const cy_fcf_spike = (() => {
    if (fcfSorted.length < 3) return false;
    const latest = fcfSorted[fcfSorted.length - 1].fcf;
    const avg    = fcfSorted.slice(0, -1).reduce((sum, e) => sum + e.fcf, 0) / (fcfSorted.length - 1);
    return avg > 0 && latest > avg * 1.5;
  })();
  const cy_count = [cy_cyclical, cy_low_per, cy_fcf_spike].filter(Boolean).length;
  const cyclical_peak = {
    level:   cy_count >= 3 ? 'high' : cy_count >= 2 ? 'medium' : cy_count >= 1 ? 'low' : 'none',
    reasons: [
      cy_cyclical  ? `景気敏感(${s.industry})` : null,
      cy_low_per   ? `低PER(${s.per.toFixed(1)}x)` : null,
      cy_fcf_spike ? 'FCF急増(直近>過去平均×1.5)' : null,
    ].filter(Boolean),
  };

  // 6. ワンタイムゲイントラップ: dupont.reliability=LOW × FCF外れ値
  const ot_low_rel = s.dupont?.reliability === 'LOW';
  const ot_fcf_out = s.fcfOutlier;
  const ot_count   = [ot_low_rel, ot_fcf_out].filter(Boolean).length;
  const one_time_gain = {
    level:   ot_count >= 2 ? 'high' : ot_count >= 1 ? 'medium' : 'none',
    reasons: [
      ot_low_rel ? `DuPont信頼性LOW(${s.dupont?.reliability_reason || '単四半期NI集中'})` : null,
      ot_fcf_out ? 'FCF外れ値フラグ' : null,
    ].filter(Boolean),
  };

  // 7. シガーバット: 純流動資産 > 時価総額 × 低成長率
  const cb_ratio = s.netCurrentAssetsRatio;
  const cb_low_growth = s.growthRate != null && s.growthRate < 0.05;
  const cigar_butt = {
    level:   (cb_ratio != null && cb_ratio > 1.0 && cb_low_growth) ? 'high'
           : (cb_ratio != null && cb_ratio > 0.7 && cb_low_growth) ? 'medium'
           : (cb_ratio != null && cb_ratio > 0.5)                  ? 'low'
           : 'none',
    reasons: cb_ratio != null
      ? [`純流動資産/時価総額=${cb_ratio.toFixed(2)}${cb_low_growth ? ' × 成長率' + ((s.growthRate||0)*100).toFixed(0) + '%' : ''}`]
      : ['データなし'],
  };

  // 8. ディビデンドトラップ: 高配当利回り × 高配当性向
  const dv_yield = s.dividendYield ?? 0.0;
  const dv_payout = s.payoutRatio ?? 0.0;
  const dividend_trap = {
    level:   (dv_yield > 0.04 && dv_payout > 1.0) ? 'high'
           : (dv_yield > 0.04 && dv_payout > 0.8) ? 'medium'
           : (dv_yield > 0.04)                     ? 'low'
           : 'none',
    reasons: dv_yield > 0
      ? [`配当利回り${(dv_yield * 100).toFixed(1)}%${dv_payout > 0 ? ' × 配当性向' + (dv_payout * 100).toFixed(0) + '%' : ''}`]
      : ['無配当'],
  };

  // 9. アセットヘビートラップ: 資産回転率低×純利益率低（固定資産比率の近似）
  const at_turn = s.dupont?.asset_turnover ?? null;
  const at_marg = s.dupont?.net_margin ?? null;
  const asset_heavy = {
    level:   (at_turn != null && at_turn < 0.3 && at_marg != null && at_marg < 0.05) ? 'high'
           : (at_turn != null && at_turn < 0.5 && at_marg != null && at_marg < 0.10) ? 'medium'
           : (at_turn != null && at_turn < 0.5)                                       ? 'low'
           : 'none',
    reasons: at_turn != null
      ? [`資産回転率${at_turn.toFixed(2)}x${at_marg != null ? ' × 純利益率' + (at_marg * 100).toFixed(1) + '%' : ''}`]
      : ['データなし'],
  };

  // 10. キャッシュトラップ: ネットキャッシュ豊富 × 株主還元ほぼゼロ
  const ct_net_debt = s.netDebt;
  const ct_mktcap   = (() => {
    const price = s.per != null && s.funda != null ? null : null; // market_cap直接保持なし
    return null; // 近似: netDebt絶対値をmarket_capと比較不可のためratio用途限定
  })();
  // netDebt < 0 = ネットキャッシュ; financial_health.net_debtは負=現金超過
  const ct_cash_rich   = ct_net_debt != null && ct_net_debt < 0;
  const ct_no_dividend = s.dividendYield < 0.005;
  const ct_no_buyback  = s.buybackTtm != null ? s.buybackTtm === 0 : null;
  const ct_low_return  = ct_no_dividend && (ct_no_buyback === true || ct_no_buyback === null);
  const cash_trap = {
    level:   (ct_cash_rich && ct_low_return) ? 'high'
           : ct_cash_rich                    ? 'medium'
           : 'none',
    reasons: ct_net_debt != null && ct_net_debt < 0
      ? [`ネットキャッシュ$${(Math.abs(ct_net_debt)/1e9).toFixed(1)}B${ct_low_return ? ' × 還元実績ほぼゼロ' : ''}`]
      : ['ネットキャッシュなし'],
  };

  return { value_trap, growth_trap, value_destruction, narrative_trap, cyclical_peak, one_time_gain, cigar_butt, dividend_trap, cash_trap, asset_heavy };
}

function renderTrapPanel() {
  const el = document.getElementById('trap-panel');
  if (!el || !_stocks.length) return;

  const TRAP_KEYS = [
    'value_trap', 'growth_trap', 'value_destruction',
    'narrative_trap', 'cyclical_peak', 'one_time_gain',
    'cigar_butt', 'dividend_trap', 'cash_trap', 'asset_heavy',
  ];
  const TRAP_LABELS = {
    value_trap: 'バリュー', growth_trap: 'グロース', value_destruction: 'バリデスト',
    narrative_trap: 'ナラティブ', cyclical_peak: 'サイクリカル', one_time_gain: 'ワンタイム',
    cigar_butt: 'シガーバット', dividend_trap: '配当', cash_trap: 'キャッシュ', asset_heavy: 'アセット重',
  };
  const LEVEL_SCORE = { high: 3, medium: 2, low: 1, none: 0 };
  const levelIcon   = lv =>
    lv === 'high'   ? '🔴' :
    lv === 'medium' ? '🟡' :
    lv === 'low'    ? '🟢' :
    '<span style="color:var(--mut)">–</span>';
  const CAT_COLOR = {
    BUY:'#4ade80', GROWTH_PREMIUM:'#14b8a6', WATCH:'#facc15',
    HOLD:'#94a3b8', TRIM:'#fb923c', SELL:'#f87171', PASS:'#475569',
  };

  const computed = _stocks.map(s => {
    const traps = computeTraps(s);
    const trapCount = TRAP_KEYS.filter(k => traps[k].level !== 'none').length;
    const sortKeys = {};
    for (const k of TRAP_KEYS) sortKeys[k + '_s'] = LEVEL_SCORE[traps[k].level];
    return { ...s, traps, trapCount, ...sortKeys };
  });

  computed.sort((a, b) => {
    if (_trapSortCol === 'ticker') return _trapSortDir * a.ticker.localeCompare(b.ticker);
    const av = a[_trapSortCol] ?? 0;
    const bv = b[_trapSortCol] ?? 0;
    if (av == null && bv == null) return 0;
    if (av == null) return 1; if (bv == null) return -1;
    return _trapSortDir * (av - bv);
  });

  const withTraps = computed.filter(s => s.trapCount > 0);
  const visible   = _trapShowAll ? computed : withTraps;
  const hiddenCnt = computed.length - withTraps.length;

  const trapTh = (col, label, align = 'center') => {
    const isSorted = _trapSortCol === col;
    const arr   = isSorted ? (_trapSortDir === -1 ? '▼' : '▲') : '';
    const color = isSorted ? 'var(--acc)' : 'var(--mut)';
    return `<th onclick="sortTrap('${col}')"
      style="text-align:${align};padding:4px 8px;cursor:pointer;color:${color};user-select:none;white-space:nowrap">
      ${label}${arr ? `<span style="margin-left:2px;font-size:9px;opacity:.7">${arr}</span>` : ''}
    </th>`;
  };

  const rows = visible.map(s => {
    const catDot   = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAT_COLOR[s.cat] || '#475569'};margin-right:4px"></span>`;
    const cntColor = s.trapCount >= 3 ? 'var(--red)' : s.trapCount >= 2 ? 'var(--amb)' : s.trapCount >= 1 ? '#facc15' : 'var(--mut)';
    const cells    = TRAP_KEYS.map(k => {
      const t   = s.traps[k];
      const tip = t.reasons.length ? t.reasons.join(' / ') : '検出なし';
      return `<td style="text-align:center"><span data-info-text="${escAttr(tip)}" style="cursor:default">${levelIcon(t.level)}</span></td>`;
    }).join('');
    return `<tr>
      <td style="white-space:nowrap;font-weight:600">${catDot}<a href="${T_BASE}stock.html?ticker=${s.ticker}" style="color:inherit;text-decoration:none">${s.ticker}</a></td>
      <td style="text-align:center;font-family:var(--mono);font-weight:600;color:${cntColor}">${s.trapCount > 0 ? s.trapCount : '<span style="color:var(--mut)">0</span>'}</td>
      ${cells}
    </tr>`;
  }).join('');

  const toggleLabel = _trapShowAll
    ? `▲ トラップ0件の${hiddenCnt}銘柄を折りたたむ`
    : `▶ トラップ0件の${hiddenCnt}銘柄を表示`;

  el.innerHTML = `
  <details style="margin:10px 0 10px;border:1px solid var(--border);border-radius:6px;overflow:hidden">
    <summary style="padding:10px 14px;cursor:pointer;background:var(--surface);font-weight:600;font-size:13px;list-style:none">
      ▶ 投資トラップ検出 — Phase1: 6種（${withTraps.length}銘柄に検出）
    </summary>
    <div style="padding:8px 14px 4px;overflow-x:auto">
      <p style="font-size:11px;color:var(--mut);margin:0 0 8px">
        🔴高 / 🟡中 / 🟢低 / – でトラップ検出度を表示。セルにホバーで判定根拠を確認。
        Phase1: バリュートラップ・グローストラップ・バリューデストラクション・ナラティブトラップ・サイクリカルピーク・ワンタイムゲイン
      </p>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            ${trapTh('ticker', '銘柄', 'left')}
            ${trapTh('trapCount', 'トラップ数')}
            ${TRAP_KEYS.map(k => trapTh(k + '_s', TRAP_LABELS[k])).join('')}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${hiddenCnt > 0 ? `<div style="padding:6px 14px 10px;font-size:11px;color:var(--mut);cursor:pointer;text-align:center" onclick="toggleTrapAll()">${toggleLabel}</div>` : ''}
  </details>`;
}

// ─── ⑤ RICE × 乖離率マトリクス ─────────────────────────────────
function renderRiceMatrix() {
  const el = document.getElementById('rice-matrix');
  if (!el) return;

  const RICE_CAP = 10;
  const RICE_FLOOR = 0.1;  // 対数軸の下限（外れ値補正の前提条件）
  const RICE_LOW = 1.0;    // 低効率/中効率の境界（理論値）
  const RICE_HIGH = 3.0;   // 中効率/高効率の境界（理論値）
  const X_MAX_CLIP = 300;

  // Fix1: 負RICE除外  Fix2: X>300は右端に折りたたむ
  // ARCH-MATRIX-DUP-1: stock.html側と同じrice.availableゲートを追加（将来の潜在差異を予防）
  const allPoints = _stocks
    .filter(s => s.riceAvailable && s.upside != null && s.riceVal != null && s.riceVal >= 0)
    .map(s => ({
      ticker: s.ticker,
      xOrig: s.upside,
      x: Math.min(s.upside, X_MAX_CLIP),
      xClamped: s.upside > X_MAX_CLIP,
      riceOrig: s.riceVal,
      // 対数軸ではRICE=0をプロットできないため別枠（下端）扱いにする
      yZero: s.riceVal <= 0,
      y: Math.min(Math.max(s.riceVal, RICE_FLOOR), RICE_CAP),
      yCapped: s.riceVal > RICE_CAP,
      yFloored: s.riceVal > 0 && s.riceVal < RICE_FLOOR,
      cat: s.cat,
    }));

  if (!allPoints.length) {
    el.innerHTML = '<p style="color:var(--mut);text-align:center;padding:20px">データなし</p>';
    return;
  }

  const zeroPoints = allPoints.filter(p => p.yZero);
  const inPoints    = allPoints.filter(p => !p.xClamped && !p.yZero);
  const overPoints  = allPoints.filter(p =>  p.xClamped && !p.yZero);

  const W = 680, H = 380;
  const ml = 46, mr = 16, mt = 22, mb = 46;
  const pw = W - ml - mr;
  const ph = H - mt - mb;

  const xVals = inPoints.map(p => p.x);
  const xPad = 15;
  const xmin = Math.min(-60, xVals.length ? Math.min(...xVals) : 0) - xPad;
  const xmax = X_MAX_CLIP + xPad;

  // Y軸: 対数スケール（NVDA等の外れ値で中央値帯が圧縮される問題を解消）
  const ylogMin = Math.log10(RICE_FLOOR), ylogMax = Math.log10(RICE_CAP);
  const tx = v => ml + (v - xmin) / (xmax - xmin) * pw;
  const ty = v => mt + ph - (Math.log10(v) - ylogMin) / (ylogMax - ylogMin) * ph;

  const x0 = tx(0);
  const yHigh = ty(RICE_HIGH);
  const yLow  = ty(RICE_LOW);

  const CAT_COLOR = {
    BUY: '#4ade80', GROWTH_PREMIUM: '#14b8a6',
    WATCH: '#facc15', HOLD: '#94a3b8',
    TRIM: '#fb923c', SELL: '#f87171', PASS: '#475569',
  };

  // 高効率帯(RICE>=3) / 中効率帯(1〜3) / 低効率帯(<1) の3バンド × 割安/割高
  const q1  = `<rect x="${x0.toFixed(1)}" y="${mt}" width="${(ml+pw-x0).toFixed(1)}" height="${(yHigh-mt).toFixed(1)}" fill="rgba(20,83,45,0.22)"/>`;
  const q2  = `<rect x="${ml}" y="${mt}" width="${(x0-ml).toFixed(1)}" height="${(yHigh-mt).toFixed(1)}" fill="rgba(113,63,18,0.10)"/>`;
  const qm1 = `<rect x="${x0.toFixed(1)}" y="${yHigh.toFixed(1)}" width="${(ml+pw-x0).toFixed(1)}" height="${(yLow-yHigh).toFixed(1)}" fill="rgba(51,65,85,0.10)"/>`;
  const qm2 = `<rect x="${ml}" y="${yHigh.toFixed(1)}" width="${(x0-ml).toFixed(1)}" height="${(yLow-yHigh).toFixed(1)}" fill="rgba(51,65,85,0.10)"/>`;
  const q3  = `<rect x="${ml}" y="${yLow.toFixed(1)}" width="${(x0-ml).toFixed(1)}" height="${(mt+ph-yLow).toFixed(1)}" fill="rgba(69,10,10,0.10)"/>`;
  const q4  = `<rect x="${x0.toFixed(1)}" y="${yLow.toFixed(1)}" width="${(ml+pw-x0).toFixed(1)}" height="${(mt+ph-yLow).toFixed(1)}" fill="rgba(30,41,59,0.15)"/>`;

  const yTickVals = [0.1, 0.3, 1, 3, 10];
  const yTicks = yTickVals.map(v => {
    const y = ty(v).toFixed(1);
    const lbl = v === 10 ? '≥10' : (v === 0.1 ? '≤0.1' : String(v));
    return `<line x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}" stroke="#1e293b" stroke-width="0.5"/>
            <text x="${ml-4}" y="${(parseFloat(y)+4).toFixed(0)}" text-anchor="end" font-size="10" fill="#64748b">${lbl}</text>`;
  }).join('');

  const xTickStep = 50;
  const xTickStart = Math.ceil(xmin / xTickStep) * xTickStep;
  let xTicks = '';
  for (let v = xTickStart; v <= xmax; v += xTickStep) {
    const x = tx(v).toFixed(1);
    const lbl = v >= 0 ? `+${v}%` : `${v}%`;
    xTicks += `<line x1="${x}" y1="${mt}" x2="${x}" y2="${mt+ph}" stroke="#1e293b" stroke-width="0.5"/>
               <text x="${x}" y="${mt+ph+14}" text-anchor="middle" font-size="10" fill="#64748b">${lbl}</text>`;
  }

  const centerLines = `
    <line x1="${x0.toFixed(1)}" y1="${mt}" x2="${x0.toFixed(1)}" y2="${mt+ph}" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="${ml}" y1="${yHigh.toFixed(1)}" x2="${ml+pw}" y2="${yHigh.toFixed(1)}" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="${ml}" y1="${yLow.toFixed(1)}" x2="${ml+pw}" y2="${yLow.toFixed(1)}" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  `;

  const qLabels = `
    <text x="${((x0+ml+pw)/2).toFixed(0)}" y="${mt+13}" text-anchor="middle" font-size="9" fill="#4ade80" opacity="0.65">① 割安×高効率(≥3)</text>
    <text x="${((ml+x0)/2).toFixed(0)}" y="${mt+13}" text-anchor="middle" font-size="9" fill="#facc15" opacity="0.55">割高×高効率(≥3)</text>
    <text x="${x0.toFixed(0)}" y="${((yHigh+yLow)/2+3).toFixed(0)}" text-anchor="middle" font-size="9" fill="#94a3b8" opacity="0.6">中効率(1〜3)</text>
    <text x="${((ml+x0)/2).toFixed(0)}" y="${mt+ph-5}" text-anchor="middle" font-size="9" fill="#f87171" opacity="0.55">割高×低効率(&lt;1)</text>
    <text x="${((x0+ml+pw)/2).toFixed(0)}" y="${mt+ph-5}" text-anchor="middle" font-size="9" fill="#64748b" opacity="0.65">割安×低効率(&lt;1)</text>
  `;

  const axisLabels = `
    <text x="${(ml+pw/2).toFixed(0)}" y="${H-2}" text-anchor="middle" font-size="10" fill="#94a3b8">← 割高（乖離率）割安 →</text>
    <text x="4" y="${mt-5}" text-anchor="start" font-size="10" fill="#94a3b8">↑ RICE</text>
    <text x="4" y="${mt+6}" text-anchor="start" font-size="8" fill="#64748b">対数軸</text>
  `;

  const borders = `<rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="none" stroke="#334155" stroke-width="1"/>`;

  // 通常ドット
  const dots = inPoints.map(p => {
    const cx = tx(p.x).toFixed(1);
    const cy = ty(p.y).toFixed(1);
    const col = CAT_COLOR[p.cat] || '#94a3b8';
    const riceStr = p.yCapped ? `≥10` : (p.yFloored ? `<${RICE_FLOOR}` : p.riceOrig.toFixed(2));
    const upsideStr = p.xOrig >= 0 ? `+${p.xOrig.toFixed(1)}%` : `${p.xOrig.toFixed(1)}%`;
    const ring = (p.yCapped || p.yFloored) ? `<circle cx="${cx}" cy="${cy}" r="7.5" fill="none" stroke="${col}" stroke-width="1" opacity="0.5"/>` : '';
    return `<g style="cursor:pointer" onclick="location.href='${T_BASE}stock.html?ticker=${p.ticker}'">
      ${ring}
      <circle cx="${cx}" cy="${cy}" r="5.5" fill="${col}" fill-opacity="0.82" stroke="#0f172a" stroke-width="1"/>
      <text x="${cx}" y="${(parseFloat(cy)-7.5).toFixed(1)}" text-anchor="middle" font-family="monospace" font-size="8.5" fill="${col}" opacity="0.88" pointer-events="none">${p.ticker}</text>
      <title>${p.ticker}  乖離率: ${upsideStr}  RICE: ${riceStr}  ${p.cat}</title>
    </g>`;
  }).join('');

  // +300%超の銘柄は右端に▶マーカーで表示
  const clipBorder = overPoints.length > 0
    ? `<line x1="${(ml+pw).toFixed(1)}" y1="${mt}" x2="${(ml+pw).toFixed(1)}" y2="${mt+ph}" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>`
    : '';
  const overDots = overPoints.map((p, i) => {
    const bx = ml + pw;
    const cy = ty(p.y);
    // 縦に重ならないよう i でオフセット
    const oy = cy + (i - (overPoints.length - 1) / 2) * 14;
    const col = CAT_COLOR[p.cat] || '#94a3b8';
    const riceStr = p.yCapped ? `≥10` : (p.yFloored ? `<${RICE_FLOOR}` : p.riceOrig.toFixed(2));
    return `<g style="cursor:pointer" onclick="location.href='${T_BASE}stock.html?ticker=${p.ticker}'">
      <text x="${bx - 2}" y="${(oy + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="${col}" opacity="0.9" pointer-events="none">▶</text>
      <text x="${bx - 14}" y="${(oy - 5).toFixed(1)}" text-anchor="end" font-family="monospace" font-size="8.5" fill="${col}" opacity="0.88" pointer-events="none">${p.ticker}</text>
      <title>${p.ticker}  乖離率: +${p.xOrig.toFixed(1)}%（+300%超）  RICE: ${riceStr}  ${p.cat}</title>
    </g>`;
  }).join('');

  // RICE<=0（計算不能・マイナス）は対数軸でプロット不可なため下端に▼で別枠表示
  const zeroDots = zeroPoints.map(p => {
    const cx = tx(p.x).toFixed(1);
    const by = mt + ph;
    const col = CAT_COLOR[p.cat] || '#94a3b8';
    const upsideStr = p.xOrig >= 0 ? `+${p.xOrig.toFixed(1)}%` : `${p.xOrig.toFixed(1)}%`;
    return `<g style="cursor:pointer" onclick="location.href='${T_BASE}stock.html?ticker=${p.ticker}'">
      <text x="${cx}" y="${(by-2).toFixed(1)}" text-anchor="middle" font-size="11" fill="${col}" opacity="0.9" pointer-events="none">▼</text>
      <text x="${cx}" y="${(by-12).toFixed(1)}" text-anchor="middle" font-family="monospace" font-size="8.5" fill="${col}" opacity="0.88" pointer-events="none">${p.ticker}</text>
      <title>${p.ticker}  乖離率: ${upsideStr}  RICE: ${p.riceOrig.toFixed(2)}（計算不能・対数軸プロット不可）  ${p.cat}</title>
    </g>`;
  }).join('');

  const legendItems = [
    ['BUY','#4ade80'],['WATCH','#facc15'],['HOLD','#94a3b8'],['TRIM','#fb923c'],['SELL','#f87171'],['PASS','#475569']
  ];
  const legendHTML = legendItems.map(([lbl,col]) =>
    `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px">
      <svg width="10" height="10" style="display:inline-block"><circle cx="5" cy="5" r="4.5" fill="${col}" opacity="0.85"/></svg>
      <span style="font-size:10px;color:#94a3b8">${lbl}</span>
    </span>`
  ).join('');

  const svg = `<svg width="${W}" height="${H}" style="max-width:100%;display:block;margin:0 auto">
    ${q1}${q2}${qm1}${qm2}${q3}${q4}
    ${yTicks}
    ${xTicks}
    ${borders}
    ${clipBorder}
    ${centerLines}
    ${qLabels}
    ${axisLabels}
    ${dots}
    ${overDots}
    ${zeroDots}
  </svg>`;

  const overNote = overPoints.length > 0
    ? `<div style="font-size:10px;color:var(--mut);padding:0 12px 4px">▶ 乖離率+${X_MAX_CLIP}%超（右端に折りたたみ表示）: ${overPoints.map(p => `${p.ticker}(+${p.xOrig.toFixed(0)}%)`).join(', ')}</div>`
    : '';
  const zeroNote = zeroPoints.length > 0
    ? `<div style="font-size:10px;color:var(--mut);padding:0 12px 4px">▼ RICE≤0（計算不能・マイナス、下端に別枠表示）: ${zeroPoints.map(p => p.ticker).join(', ')}</div>`
    : '';

  el.innerHTML = `
    <div class="sec">② RICE × 乖離率マトリクス
      <span style="font-size:10px;color:var(--mut);font-weight:400;margin-left:6px">RICE有効 ${allPoints.length}銘柄 ｜ Y軸対数 ｜ 第1象限（右上）が割安×高効率(RICE≥3)</span>
    </div>
    <div style="padding:8px 0;overflow-x:auto">${svg}</div>
    ${overNote}
    ${zeroNote}
    <div style="padding:0 12px 12px;display:flex;flex-wrap:wrap">${legendHTML}</div>
  `;
}
</script>
  <script src="../../common/site-header.js"></script>
  <script src="../../common/site-nav.js"></script>
  <script src="../../common/info-tooltip.js"></script>
