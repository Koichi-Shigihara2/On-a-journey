# 株式分割履歴設定
# ratio: 新株/旧株比率（1旧株 → ratio新株）
# date: 効力発生日（この日付より前で分割前株数のままの四半期に遡及補正を適用）
#
# 判定ロジック:
#   post_split_avg = split_date以降の四半期の平均株数
#   pre_split_threshold = post_split_avg / ratio × 1.5
#   period_end < split_date かつ diluted_shares_used < pre_split_threshold の四半期を補正

splits:
  NOW:
    - date: "2025-12-18"
      ratio: 5
      notes: "ServiceNow 5-for-1株式分割（2025年12月18日効力発生）"
  NVDA:
    - date: "2024-06-10"
      ratio: 10
      notes: "NVIDIA 10-for-1株式分割（2024年6月7日効力発生・6月10日分割調整後取引開始）。2023-04-30（FY2024 Q1）が恒久的に分割前株数のまま残存する既知ギャップあり（SPLIT-REALTIME-GAP-1参照）"
  CPRT:
    - date: "2023-08-22"
      ratio: 2
      notes: "Copart 2-for-1株式分割（2023年8月4日発表・8月14日基準日・8月21日引渡、8月22日分割調整後取引開始）。SEC 8-K（Ex-99.1、CIK0000900075）で確認済み。2022年10月の授権株式数増加（分割の前提条件）は分割そのものではないため対象外"
  WMT:
    - date: "2024-02-26"
      ratio: 3
      notes: "Walmart 3-for-1株式分割（2024年2月26日効力発生）"
  LRCX:
    - date: "2024-10-03"
      ratio: 10
      notes: "Lam Research 10-for-1株式分割（2024年10月3日効力発生）。2021-03-28〜2023-03-26の8四半期が恒久固着していた既知ギャップあり（SPLIT-REALTIME-GAP-1参照）。2023-06-25以降は既存fact競合ロジックで既に分割調整後の値になっているため、閾値判定により誤って再補正されない"
  CELH:
    - date: "2023-11-15"
      ratio: 3
      notes: "Celsius Holdings 3-for-1株式分割（2023年11月15日効力発生）"
  KLAC:
    - date: "2026-06-12"
      ratio: 10
      notes: "KLA Corporation 10-for-1株式分割（2026年6月12日効力発生）。事前登録時点ではローカルキャッシュにpost-split四半期データが存在せずapply_split_adjustments()はno-opとなる（post_split_shares空リストで自動スキップ、SPLIT-REALTIME-GAP-1参照）"
  TSLA:
    - date: "2022-08-25"
      ratio: 3
      notes: "Tesla 3-for-1株式分割（2022年8月25日効力発生）。2021-06-30の1四半期が恒久固着していた既知ギャップあり（SPLIT-REALTIME-GAP-1参照、追加登録2026-07-20）"
  KULR:
    - date: "2025-06-23"
      ratio: 0.125
      notes: "KULR Technology Group 1-for-8株式併合（リバース分割、2025年6月23日効力発生）。SEC 8-K Item 3.03/5.03（accn 0001104659-25-063716）で確認済み。2017-12-31〜2024-03-31の四半期が分割前株数のまま恒久固着（2024-06-30以降は分割後の10-Qが比較期間として遡及修正済み）。ratio<1の判定はapply_split_adjustments()の方向非依存ロジックで行う（SPLIT-REALTIME-GAP-REVERSE-1、2026-09-25）"
  SPIR:
    - date: "2023-08-31"
      ratio: 0.125
      notes: "Spire Global 1-for-8株式併合（リバース分割、2023年8月31日効力発生）。SEC 8-K Item 3.03/5.03（accn 0000950170-23-045434）で確認済み。2021-09-30〜2022-06-30の四半期が分割前株数のまま恒久固着（2022-09-30以降は遡及修正済み）。2021-06-30以前はSPAC合併前の実体の株数の疑いがあり補正対象外（SPLIT-REALTIME-GAP-REVERSE-1、2026-09-25）"
  HON:
    - date: "2026-06-29"
      ratio: 0.5
      notes: "Honeywell 1-for-2株式併合（リバース分割、2026年6月29日効力発生、Aerospace分離と同時）。SEC 8-K Item 3.03/5.03（accn 0000773840-26-000084）・10-Q XBRL StockholdersEquityNoteStockSplitConversionRatio1=0.5で確認済み。yfinanceのsplits（0.9535）は分社化の株価調整と混ざった値のため不使用。2025-06-30は分割後の10-Qで遡及修正済み（SPLIT-REALTIME-GAP-REVERSE-1のSTEP 0で追加、2026-09-25）"
